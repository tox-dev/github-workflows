name: Prepare Towncrier release
description: Resolve a version, build and format the changelog, and write a release patch
inputs:
  bump:
    description: Version bump passed to release-creator tags
    default: auto
  tag-prefix:
    description: Prefix for calculated release tags, either empty or v
    default: ""
  changelog-prefix:
    description: Prefix for the Towncrier changelog version, either empty or v
    default: ""
  version:
    description: Explicit version for repositories with custom version selection
    default: ""
  phase:
    description: Run the full preparation, changelog build, or finalization
    default: all
outputs:
  version:
    description: Resolved release version
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Require a valid preparation phase
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
      run: |
        case "$PHASE" in
        all | build | finalize) ;;
        *)
          echo '::error::phase must be all, build, or finalize' >&2
          exit 1
          ;;
        esac
    - id: config
      uses: $/read-towncrier-config
    - id: version
      name: Select release version
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        FRAGMENTS: ${{ steps.config.outputs.fragments }}
        PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        if [[ "$PHASE" == finalize ]]; then
          [[ -n "$VERSION" ]] || {
            echo '::error::finalize requires a version from the build phase' >&2
            exit 1
          }
          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -n "$VERSION" ]]; then
          git tag --list | release-creator tags --next auto --directory "$FRAGMENTS" >/dev/null
          git tag --list | release-creator tags "$VERSION" --require-newer
        else
          args=(--next "$BUMP" --directory "$FRAGMENTS")
          if [[ -n "$TAG_PREFIX" ]]; then
            args+=(--prefix "$TAG_PREFIX")
          fi
          VERSION=$(git tag --list | release-creator tags "${args[@]}")
        fi
        printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
    - name: Link fragments and authors
      if: inputs.phase != 'finalize'
      shell: bash
      env:
        FRAGMENTS: ${{ steps.config.outputs.fragments }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        release-creator fragments --directory "$FRAGMENTS" --repository "$REPOSITORY"
    - name: Build changelog
      if: inputs.phase != 'finalize'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG_PREFIX: ${{ inputs.changelog-prefix }}
      run: |
        set -euo pipefail
        case "$CHANGELOG_PREFIX" in
        '' | v) ;;
        *)
          echo '::error::changelog-prefix must be empty or v' >&2
          exit 1
          ;;
        esac
        towncrier build --yes --version "$CHANGELOG_PREFIX${VERSION#v}"
    - name: Format changelog
      if: inputs.phase != 'build'
      shell: bash
      env:
        CHANGELOG: ${{ steps.config.outputs.changelog }}
        FORMAT: ${{ steps.config.outputs.format }}
      run: |
        set -euo pipefail
        case "$FORMAT" in
        markdown) formatter=mdformat ;;
        rst) formatter=docstrfmt ;;
        *)
          echo '::error::unsupported changelog format' >&2
          exit 1
          ;;
        esac
        if ! prek run "$formatter" --files "$CHANGELOG"; then
          prek run "$formatter" --files "$CHANGELOG"
        fi
    - name: Check generated files
      if: inputs.phase != 'build'
      shell: bash
      env:
        CHANGELOG: ${{ steps.config.outputs.changelog }}
      run: |
        if [[ -f "$CHANGELOG" ]] && ! git ls-files --error-unmatch "$CHANGELOG" >/dev/null 2>&1; then
          git add -N -- "$CHANGELOG"
        fi
    - name: Write release patch
      if: inputs.phase != 'build'
      shell: bash
      run: |
        set -euo pipefail
        git diff HEAD --binary >"$RUNNER_TEMP/release.patch"
