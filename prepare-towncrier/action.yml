name: Prepare Towncrier release
description: Resolve a version, build the changelog, run prek, and write a release patch
inputs:
  bump:
    description: Version bump passed to release-creator tags
    default: auto
  tag-prefix:
    description: Prefix for calculated release tags, either empty or v
    default: ""
  changelog-prefix:
    description: Prefix for the Towncrier changelog version, either empty or v
    default: ""
  version:
    description: Explicit version for repositories with custom version selection
    default: ""
  changelog:
    description: Changelog path
    required: true
  fragments:
    description: Towncrier fragment directory, relative to the repository root
    default: changelog.d
  format:
    description: Changelog format, markdown, rst, or none
    default: none
  link-fragments:
    description: Resolve named fragments and authors with release-creator
    default: "true"
  numbered-prs:
    description: Treat numeric fragment names as original pull request numbers
    default: "false"
  patch:
    description: Path for the generated Git patch
    required: true
  repository:
    description: GitHub owner/repository used to resolve fragment authors
    default: ""
outputs:
  version:
    description: Resolved release version
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Require a clean checkout
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo '::error::release preparation requires a clean checkout' >&2
          exit 1
        fi
    - id: version
      name: Select release version
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        FRAGMENTS: ${{ inputs.fragments }}
      run: |
        set -euo pipefail
        if [[ -z "$VERSION" ]]; then
          args=(--next "$BUMP" --directory "$FRAGMENTS")
          if [[ -n "$TAG_PREFIX" ]]; then
            args+=(--prefix "$TAG_PREFIX")
          fi
          VERSION=$(git tag --list | release-creator tags "${args[@]}")
        fi
        git tag --list | release-creator tags "$VERSION" --require-newer
        printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
    - name: Link fragments and authors
      shell: bash
      env:
        LINK_FRAGMENTS: ${{ inputs.link-fragments }}
        NUMBERED_PRS: ${{ inputs.numbered-prs }}
        FRAGMENTS: ${{ inputs.fragments }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "$LINK_FRAGMENTS" != true && "$LINK_FRAGMENTS" != false ]]; then
          echo '::error::link-fragments must be true or false' >&2
          exit 1
        fi
        if [[ "$NUMBERED_PRS" != true && "$NUMBERED_PRS" != false ]]; then
          echo '::error::numbered-prs must be true or false' >&2
          exit 1
        fi
        if [[ "$LINK_FRAGMENTS" == true ]]; then
          args=(--directory "$FRAGMENTS" --repository "$REPOSITORY" --git --resolve-authors)
          if [[ "$NUMBERED_PRS" == true ]]; then
            args+=(--numbered-prs)
          fi
          release-creator fragments "${args[@]}"
        fi
    - name: Build changelog
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG_PREFIX: ${{ inputs.changelog-prefix }}
      run: |
        set -euo pipefail
        case "$CHANGELOG_PREFIX" in
        '' | v) ;;
        *)
          echo '::error::changelog-prefix must be empty or v' >&2
          exit 1
          ;;
        esac
        towncrier build --yes --version "$CHANGELOG_PREFIX${VERSION#v}"
    - name: Format changelog
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
        FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        case "$FORMAT" in
        markdown) formatter=mdformat ;;
        rst) formatter=docstrfmt ;;
        none) formatter="" ;;
        *)
          echo '::error::format must be markdown, rst, or none' >&2
          exit 1
          ;;
        esac
        if [[ -n "$formatter" ]] && ! prek run "$formatter" --files "$CHANGELOG"; then
          prek run "$formatter" --files "$CHANGELOG"
        fi
    - name: Check rendered release notes
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG: ${{ inputs.changelog }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
      run: |
        set -euo pipefail
        notes=$(release-creator notes --changelog "$CHANGELOG" --tag "$VERSION" --repository "$REPOSITORY")
        if [[ "$notes" != *'### '* ]]; then
          echo '::error::release preparation has no release notes' >&2
          exit 1
        fi
    - name: Run repository checks
      shell: bash
      run: prek run --all-files
    - name: Check generated files
      shell: bash
      run: |
        if [[ -n $(git ls-files --others --exclude-standard) ]]; then
          echo '::error::release preparation created untracked files' >&2
          exit 1
        fi
    - name: Check RST conflict markers
      if: inputs.format == 'rst'
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
      run: |
        set -euo pipefail
        if grep -Eq '^(<{7}|\|{7}|>{7})([[:space:]]|$)' "$CHANGELOG"; then
          echo '::error::release changelog contains conflict markers' >&2
          exit 1
        fi
        printf '%s conflict-marker-size=10\n' "$CHANGELOG" >>"$(git rev-parse --git-path info/attributes)"
    - name: Write release patch
      shell: bash
      env:
        PATCH: ${{ inputs.patch }}
      run: |
        set -euo pipefail
        git diff --check
        git diff HEAD --binary >"$PATCH"
        if [[ ! -s "$PATCH" ]]; then
          echo '::error::release preparation produced no patch' >&2
          exit 1
        fi
