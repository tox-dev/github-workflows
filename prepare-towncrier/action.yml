name: Prepare Towncrier release
description: Resolve a version, build and format the changelog, and write a release patch
inputs:
  bump:
    description: Version bump passed to release-creator tags
    default: auto
  tag-prefix:
    description: Prefix for calculated release tags, either empty or v
    default: ""
  changelog-prefix:
    description: Prefix for the Towncrier changelog version, either empty or v
    default: ""
  version:
    description: Explicit version for repositories with custom version selection
    default: ""
  phase:
    description: Run the full preparation, changelog build, or finalization
    default: all
outputs:
  version:
    description: Resolved release version
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: ⚙️ Read Towncrier configuration
      id: config
      uses: $/read-towncrier-config
    - id: version
      name: 🏷️ Select release version
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        FRAGMENTS: ${{ steps.config.outputs.fragments }}
        PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        if [[ "$PHASE" == finalize ]]; then
          echo "Release version: $VERSION (from the version input in the finalize phase)"
          echo 'Fragment linking, changelog build and contributors skipped: the build phase did them'
          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -z "$VERSION" ]]; then
          args=(--next "$BUMP" --directory "$FRAGMENTS")
          if [[ -n "$TAG_PREFIX" ]]; then
            args+=(--prefix "$TAG_PREFIX")
          fi
          VERSION=$(git tag --list | release-creator tags "${args[@]}")
          echo "Next version: $VERSION (bump $BUMP from the fragments in $FRAGMENTS and the existing${TAG_PREFIX:+ $TAG_PREFIX-prefixed} tags)"
        else
          echo "Release version: $VERSION (from the version input)"
        fi
        if [[ "$PHASE" == build ]]; then
          echo 'Changelog formatting and the release patch skipped: the finalize phase does them'
        fi
        printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
    - name: 📝 Link fragments and authors
      if: inputs.phase != 'finalize'
      shell: bash
      env:
        FRAGMENTS: ${{ steps.config.outputs.fragments }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        release-creator fragments --directory "$FRAGMENTS" --repository "$REPOSITORY"
    - name: 📝 Build changelog
      if: inputs.phase != 'finalize'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG_PREFIX: ${{ inputs.changelog-prefix }}
      run: |
        set -euo pipefail
        echo "Changelog version: $CHANGELOG_PREFIX${VERSION#v} (tag $VERSION${CHANGELOG_PREFIX:+, changelog-prefix $CHANGELOG_PREFIX})"
        towncrier build --yes --version "$CHANGELOG_PREFIX${VERSION#v}"
    - name: 📝 Add new contributors to the changelog
      if: inputs.phase != 'finalize'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG_PREFIX: ${{ inputs.changelog-prefix }}
        CHANGELOG: ${{ steps.config.outputs.changelog }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: >-
        release-creator contributors --changelog "$CHANGELOG" --version "$CHANGELOG_PREFIX${VERSION#v}" --repository "$REPOSITORY"
    - name: 🧹 Format changelog
      if: inputs.phase != 'build'
      shell: bash
      env:
        CHANGELOG: ${{ steps.config.outputs.changelog }}
        FORMAT: ${{ steps.config.outputs.format }}
      run: |
        set -euo pipefail
        case "$FORMAT" in
        rst) formatter=docstrfmt ;;
        *) formatter=mdformat ;;
        esac
        echo "Changelog formatter: $formatter ($FORMAT changelog $CHANGELOG)"
        prek=$GITHUB_ACTION_PATH/../tools/cooled_prek.sh
        if ! "$prek" run "$formatter" --files "$CHANGELOG"; then
          echo "$formatter rewrote $CHANGELOG, running it again to confirm the result is stable"
          "$prek" run "$formatter" --files "$CHANGELOG"
        fi
    - name: 🔍 Check generated files
      if: inputs.phase != 'build'
      shell: bash
      env:
        CHANGELOG: ${{ steps.config.outputs.changelog }}
      run: |
        if [[ ! -f "$CHANGELOG" ]]; then
          echo "$CHANGELOG does not exist, nothing to add to the release patch"
        elif git ls-files --error-unmatch "$CHANGELOG" >/dev/null 2>&1; then
          echo "$CHANGELOG is already tracked"
        else
          echo "$CHANGELOG is new, marking it intent-to-add so the release patch includes it"
          git add -N -- "$CHANGELOG"
        fi
    - name: ⚙️ Write release patch
      if: inputs.phase != 'build'
      shell: bash
      run: |
        set -euo pipefail
        git diff HEAD --binary >"$RUNNER_TEMP/release.patch"
        echo "Release patch -> $RUNNER_TEMP/release.patch:"
        git diff HEAD --stat
