name: Label bot pull request news
description: Keep skip news on bot PRs without a changelog fragment
inputs:
  pull-request:
    description: Verified pull request number from a workflow-run resolver, or current PR event when empty
    default: ""
  bot-author:
    description: Whether the verified pull request author is a bot, or current PR author when empty
    default: ""
  fragments:
    description: Comma-separated directories containing changelog fragments
    default: changelog.d
  extension:
    description: Fragment extension without the dot, either md or rst
    default: md
  fragment-style:
    description: Filename convention, towncrier or changeset
    default: towncrier
runs:
  using: composite
  steps:
    - name: Validate bot fragment format
      if: inputs.bot-author == 'true' || github.event.pull_request.user.type == 'Bot'
      shell: bash
      env:
        EXTENSION: ${{ inputs.extension }}
        FRAGMENT_STYLE: ${{ inputs.fragment-style }}
      run: |
        if [[ "$EXTENSION" != md && "$EXTENSION" != rst ]]; then
          echo '::error::fragment extension must be md or rst' >&2
          exit 1
        fi
        if [[ "$FRAGMENT_STYLE" != towncrier && "$FRAGMENT_STYLE" != changeset ]]; then
          echo '::error::fragment style must be towncrier or changeset' >&2
          exit 1
        fi
        if [[ "$FRAGMENT_STYLE" == changeset && "$EXTENSION" != md ]]; then
          echo '::error::changeset fragments must use md' >&2
          exit 1
        fi
    - name: Read bot pull request files
      if: inputs.bot-author == 'true' || github.event.pull_request.user.type == 'Bot'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pull-request || github.event.pull_request.number }}
      run: |
        gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
          --jq '.[] | select(.status != "removed") | .filename' >"$RUNNER_TEMP/bot-pr-files"
    - name: Find bot news fragments
      if: inputs.bot-author == 'true' || github.event.pull_request.user.type == 'Bot'
      shell: bash
      env:
        FRAGMENTS: ${{ inputs.fragments }}
        EXTENSION: ${{ inputs.extension }}
        FRAGMENT_STYLE: ${{ inputs.fragment-style }}
      run: |
        has_fragment=false
        mapfile -t files <"$RUNNER_TEMP/bot-pr-files"
        read -ra directories <<<"${FRAGMENTS//,/ }"
        for path in "${files[@]}"; do
          for directory in "${directories[@]}"; do
            if [[ "$FRAGMENT_STYLE" == changeset ]]; then
              case "$path" in
              "$directory"/*.md)
                fragment=${path#"$directory"/}
                if [[ "$fragment" != */* ]]; then has_fragment=true; fi
                ;;
              esac
            else
              case "$path" in
              "$directory"/*.*."$EXTENSION")
                fragment=${path#"$directory"/}
                if [[ "$fragment" != */* ]]; then has_fragment=true; fi
                ;;
              esac
            fi
          done
        done
        echo "$has_fragment" >"$RUNNER_TEMP/bot-has-fragment"
    - name: Read bot pull request labels
      if: inputs.bot-author == 'true' || github.event.pull_request.user.type == 'Bot'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pull-request || github.event.pull_request.number }}
      run: gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' >"$RUNNER_TEMP/bot-pr-labels"
    - name: Set skip news for a bot PR
      if: inputs.bot-author == 'true' || github.event.pull_request.user.type == 'Bot'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pull-request || github.event.pull_request.number }}
      run: |
        read -r has_fragment <"$RUNNER_TEMP/bot-has-fragment"
        has_label=false
        if grep -Fxq 'skip news' "$RUNNER_TEMP/bot-pr-labels"; then
          has_label=true
        fi
        if [[ "$has_fragment" == false && "$has_label" == false ]]; then
          gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=skip news' >/dev/null
        elif [[ "$has_fragment" == true && "$has_label" == true ]]; then
          gh api -X DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/skip%20news" >/dev/null
        fi
