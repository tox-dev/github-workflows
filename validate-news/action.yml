name: Validate changelog news
description: Require a fragment for human changes and validate any fragment supplied by a bot
inputs:
  additional-lock:
    description: Secondary pylock basename to check on a pull request
    default: ""
  additional-lock-groups:
    description: Groups selected by the secondary lock
    default: ""
  additional-lock-selection:
    description: Project or build-or-groups selection for the secondary lock
    default: build-or-groups
  additional-matrix-python:
    description: Python range for the secondary lock
    default: ""
  additional-matrix-platforms:
    description: Space-separated Nab platform IDs for the secondary lock
    default: ""
  additional-matrix-implementations:
    description: Space-separated implementations for the secondary lock
    default: ""
  exclude-newer:
    description: Upload cutoff for the tools this Action installs from PyPI
    default: 7 days
  exclude-newer-package:
    description: Newline-separated name=date cutoffs that override exclude-newer for single packages
    default: ""
runs:
  using: composite
  steps:
    - id: opening
      name: 🧭 Skip labels set while opening
      if: github.event.action == 'labeled' || github.event.action == 'unlabeled'
      shell: bash
      env:
        CREATED: ${{ github.event.pull_request.created_at }}
        UPDATED: ${{ github.event.pull_request.updated_at }}
      run: |
        set -euo pipefail
        # `gh pr create --label` labels a pull request right after opening it, so `labeled` fires beside `opened`. The
        # run for `opened` reads the current labels when it checks, which leaves this run nothing to add.
        seconds=$(($(date -d "$UPDATED" +%s) - $(date -d "$CREATED" +%s)))
        if ((seconds < 60)); then
          echo "News check skipped: labels changed ${seconds}s after opening, which the run for opening covers"
          echo 'skip=true' >>"$GITHUB_OUTPUT"
        fi
    - id: news-change
      name: 🧭 Check whether news inputs changed
      if: steps.opening.outputs.skip != 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        base=$(git merge-base "origin/$BASE_REF" HEAD)
        python3 - "$base" "$GITHUB_OUTPUT" <<'PY'
        import subprocess
        import sys
        import tomllib
        from pathlib import Path

        base, output = sys.argv[1:]


        def towncrier(ref: str, name: str) -> object:
            shown = subprocess.run(["git", "show", f"{ref}:{name}"], capture_output=True, text=True, check=False)
            if shown.returncode:
                return None
            try:
                return tomllib.loads(shown.stdout).get("tool", {}).get("towncrier")
            except tomllib.TOMLDecodeError:
                return shown.stdout


        names = ("towncrier.toml", "pyproject.toml")
        config = any(towncrier(base, name) != towncrier("HEAD", name) for name in names)
        current = next((table for name in names if isinstance(table := towncrier("HEAD", name), dict)), {})
        changed = (
            subprocess.run(
                ["git", "diff", "--name-only", base, "HEAD", "--", current["directory"]],
                capture_output=True,
                text=True,
                check=True,
            ).stdout.splitlines()
            if "directory" in current
            else []
        )
        fragments = bool(changed)
        with Path(output).open("a", encoding="utf-8") as stream:
            stream.write(f"fragments={str(fragments).lower()}\nconfig={str(config).lower()}\n")
        directory = current.get("directory", "the fragment directory (not configured)")
        if config:
            print(f"Fragment check runs: the Towncrier configuration changed since {base[:12]}")
        elif fragments:
            print(f"Fragment check runs: {len(changed)} file{'' if len(changed) == 1 else 's'} changed in {directory}")
        else:
            print(f"Fragment check skipped: nothing changed in {directory} and the Towncrier configuration is unchanged")
        PY
    - name: 🔍 Count changed fragments
      if: steps.news-change.outputs.fragments == 'true' || steps.news-change.outputs.config == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        release-creator validate-news --base "$BASE_REF" >"$RUNNER_TEMP/news-fragment-count"
        echo "Changed fragments: $(python3 "$GITHUB_ACTION_PATH/../tools/plural.py" "$(<"$RUNNER_TEMP/news-fragment-count")" fragment) valid against origin/$BASE_REF"
    - id: labels
      name: 🏷️ Read the current labels
      if: steps.opening.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PULL: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # A re-run replays its original event, whose label list can predate a skip news label added since.
        skip=$(gh api "repos/$REPOSITORY/pulls/$PULL" --jq 'any(.labels[]; .name == "skip news")')
        echo "Current labels of #$PULL: skip news $([[ "$skip" == true ]] && echo present || echo absent)"
        echo "skip=$skip" >>"$GITHUB_OUTPUT"
    - name: 🔍 Require news for human changes
      if: steps.opening.outputs.skip != 'true'
      shell: bash
      env:
        SKIP_NEWS: ${{ steps.labels.outputs.skip }}
        BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
      run: |
        fragments=0
        if [[ -f "$RUNNER_TEMP/news-fragment-count" ]]; then read -r fragments <"$RUNNER_TEMP/news-fragment-count"; fi
        if ((fragments)); then
          echo "News requirement: met by $(python3 "$GITHUB_ACTION_PATH/../tools/plural.py" "$fragments" fragment)"
        elif [[ "$SKIP_NEWS" == true ]]; then
          echo 'News requirement: waived by the skip news label'
        elif [[ "$BOT_AUTHOR" == true ]]; then
          echo 'News requirement: waived for a bot author'
        else
          echo '::error::add a changelog fragment or apply the skip news label' >&2
          exit 1
        fi
    - id: lock-change
      name: 🧭 Check whether release inputs changed
      if: steps.opening.outputs.skip != 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- \
          ':(glob)**/pyproject.toml' pylock.toml ':(glob)pylock.*.toml' nab.toml)
        if [[ -z "$changed" ]]; then
          echo 'Lock check skipped: no lock inputs changed (pyproject.toml, pylock.toml, pylock.*.toml, nab.toml untouched)'
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ ! -f pylock.toml ]]; then
          echo 'Lock check skipped: no pylock.toml'
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Lock check runs: changed ${changed//$'\n'/ }"
        echo 'changed=true' >>"$GITHUB_OUTPUT"
    - name: 🔒 Check the release lock against the project
      if: steps.lock-change.outputs.changed == 'true'
      uses: $/refresh-release-lock
      with:
        additional-lock: ${{ inputs.additional-lock }}
        additional-lock-groups: ${{ inputs.additional-lock-groups }}
        additional-lock-selection: ${{ inputs.additional-lock-selection }}
        additional-matrix-python: ${{ inputs.additional-matrix-python }}
        additional-matrix-platforms: ${{ inputs.additional-matrix-platforms }}
        additional-matrix-implementations: ${{ inputs.additional-matrix-implementations }}
        exclude-newer: ${{ inputs.exclude-newer }}
        exclude-newer-package: ${{ inputs.exclude-newer-package }}
        mode: check
