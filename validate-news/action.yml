name: Validate changelog news
description: Require a fragment for human changes and validate any fragment supplied by a bot
inputs:
  additional-lock:
    description: Secondary pylock basename to check on a pull request
    default: ""
  additional-lock-groups:
    description: Groups selected by the secondary lock
    default: ""
  additional-lock-selection:
    description: Project or build-or-groups selection for the secondary lock
    default: build-or-groups
  additional-matrix-python:
    description: Python range for the secondary lock
    default: ""
  additional-matrix-platforms:
    description: Space-separated Nab platform IDs for the secondary lock
    default: ""
  additional-matrix-implementations:
    description: Space-separated implementations for the secondary lock
    default: ""
  exclude-newer:
    description: Upload cutoff for the tools this Action installs from PyPI
    default: 7 days
  exclude-newer-package:
    description: Newline-separated name=date cutoffs that override exclude-newer for single packages
    default: ""
runs:
  using: composite
  steps:
    - id: news-change
      name: Check whether news inputs changed
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        base=$(git merge-base "origin/$BASE_REF" HEAD)
        python3 - "$base" "$GITHUB_OUTPUT" <<'PY'
        import subprocess
        import sys
        import tomllib
        from pathlib import Path

        base, output = sys.argv[1:]


        def towncrier(ref: str, name: str) -> object:
            shown = subprocess.run(["git", "show", f"{ref}:{name}"], capture_output=True, text=True, check=False)
            if shown.returncode:
                return None
            try:
                return tomllib.loads(shown.stdout).get("tool", {}).get("towncrier")
            except tomllib.TOMLDecodeError:
                return shown.stdout


        names = ("towncrier.toml", "pyproject.toml")
        config = any(towncrier(base, name) != towncrier("HEAD", name) for name in names)
        current = next((table for name in names if isinstance(table := towncrier("HEAD", name), dict)), {})
        fragments = "directory" in current and bool(
            subprocess.run(
                ["git", "diff", "--name-only", base, "HEAD", "--", current["directory"]],
                capture_output=True,
                text=True,
                check=True,
            ).stdout
        )
        with Path(output).open("a", encoding="utf-8") as stream:
            stream.write(f"fragments={str(fragments).lower()}\nconfig={str(config).lower()}\n")
        PY
    - name: Count changed fragments
      if: steps.news-change.outputs.fragments == 'true' || steps.news-change.outputs.config == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: release-creator validate-news --base "$BASE_REF" >"$RUNNER_TEMP/news-fragment-count"
    - name: Require news for human changes
      shell: bash
      env:
        SKIP_NEWS: ${{ contains(github.event.pull_request.labels.*.name, 'skip news') }}
        BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
      run: |
        fragments=0
        if [[ -f "$RUNNER_TEMP/news-fragment-count" ]]; then read -r fragments <"$RUNNER_TEMP/news-fragment-count"; fi
        if ((! fragments)) && [[ "$SKIP_NEWS" != true && "$BOT_AUTHOR" != true ]]; then
          echo '::error::add a changelog fragment or apply the skip news label' >&2
          exit 1
        fi
    - id: lock-change
      name: Check whether release inputs changed
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        ADDITIONAL_LOCK: ${{ inputs.additional-lock }}
      run: |
        changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- \
          ':(glob)**/pyproject.toml' pylock.toml ':(glob)pylock.*.toml' nab.toml)
        if [[ -z "$changed" ]]; then
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ ! -f pylock.toml ]]; then
          # Removing the lock is fine only once nothing is left that would produce one.
          if git cat-file -e "origin/$BASE_REF:pylock.toml" 2>/dev/null && { [[ -n "$ADDITIONAL_LOCK" || -f nab.toml ]] || {
            [[ -f pyproject.toml ]] &&
              python3 -c 'import sys, tomllib; sys.exit("nab" not in tomllib.load(open("pyproject.toml", "rb")).get("tool", {}))'
          }; }; then
            echo '::error::the release lock was removed' >&2
            exit 1
          fi
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'changed=true' >>"$GITHUB_OUTPUT"
    - name: Check the release lock against the project
      if: steps.lock-change.outputs.changed == 'true'
      uses: $/refresh-release-lock
      with:
        additional-lock: ${{ inputs.additional-lock }}
        additional-lock-groups: ${{ inputs.additional-lock-groups }}
        additional-lock-selection: ${{ inputs.additional-lock-selection }}
        additional-matrix-python: ${{ inputs.additional-matrix-python }}
        additional-matrix-platforms: ${{ inputs.additional-matrix-platforms }}
        additional-matrix-implementations: ${{ inputs.additional-matrix-implementations }}
        exclude-newer: ${{ inputs.exclude-newer }}
        exclude-newer-package: ${{ inputs.exclude-newer-package }}
        mode: check
