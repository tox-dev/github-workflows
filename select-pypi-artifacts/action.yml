name: Select PyPI artifacts
description: Copy validated build files named by the keyless PyPI stage
inputs:
  dist:
    description: Original validated distribution directory
    required: true
  manifest:
    description: File listing the staged missing artifact names
    required: true
  output-dir:
    description: Fresh directory passed to the PyPI upload action
    required: true
  expected-count:
    description: Expected local selection count; required unless partitioned
    required: false
  partitioned:
    description: Select only names present in this matrix cell's validated distribution
    default: "false"
outputs:
  selected-count:
    description: Number of original distribution files selected for upload
    value: ${{ steps.select.outputs.count }}
  selected-manifest:
    description: File listing this cell's selected names for a keyless partition check
    value: ${{ steps.select.outputs.manifest }}
runs:
  using: composite
  steps:
    - id: select
      name: Copy selected validated files
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        MANIFEST: ${{ inputs.manifest }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        EXPECTED_COUNT: ${{ inputs.expected-count }}
        PARTITIONED: ${{ inputs.partitioned }}
      run: |
        set -euo pipefail
        [[ -d "$DIST" && -f "$MANIFEST" && ! -e "$OUTPUT_DIR" ]] || exit 1
        dist_path=$(realpath "$DIST")
        output_path=$(realpath -m "$OUTPUT_DIR")
        case "$output_path" in
        "$dist_path" | "$dist_path"/*)
          echo '::error::output directory overlaps the validated distribution' >&2
          exit 1
          ;;
        esac
        mkdir "$OUTPUT_DIR"
        selected_manifest=$(mktemp "$RUNNER_TEMP/pypi-selected.XXXXXX")
        count=0
        while IFS= read -r name; do
          case "$name" in
          '' | .* | *[!a-zA-Z0-9._+-]*)
            echo "::error::invalid distribution filename: $name" >&2
            exit 1
            ;;
          esac
          if [[ "$PARTITIONED" == true && ! -e "$DIST/$name" && ! -L "$DIST/$name" ]]; then
            continue
          fi
          [[ -f "$DIST/$name" && ! -L "$DIST/$name" && ! -e "$OUTPUT_DIR/$name" ]] || exit 1
          cp -- "$DIST/$name" "$OUTPUT_DIR/$name"
          cmp -s "$DIST/$name" "$OUTPUT_DIR/$name"
          printf '%s\n' "$name" >>"$selected_manifest"
          count=$((count + 1))
        done <"$MANIFEST"
        if [[ -n "$EXPECTED_COUNT" ]]; then
          test "$count" = "$EXPECTED_COUNT"
        else
          test "$PARTITIONED" == true
        fi
        echo "count=$count" >>"$GITHUB_OUTPUT"
        echo "manifest=$selected_manifest" >>"$GITHUB_OUTPUT"
