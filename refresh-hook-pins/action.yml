name: Refresh pre-commit hook pins
description: Update cooled frozen hook revisions and exact dependencies without GitHub writes
outputs:
  changed:
    description: Whether the hook configuration differs from the checkout
    value: ${{ steps.patch.outputs.changed }}
runs:
  using: composite
  steps:
    - uses: $/install-locked-tools
      with:
        groups: release-hooks
        venv: ${{ runner.temp }}/hook-tools
    - name: Refresh frozen hook revisions
      shell: bash
      run: |
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" prek update --config .pre-commit-config.yaml \
          --freeze --cooldown-days 7 --no-progress
    - name: Refresh exact hook dependencies
      shell: bash
      run: |
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" release-creator hooks \
          --exclude-newer '7 days' --python-version 3.15
    - name: Run repository checks
      shell: bash
      run: >-
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" prek run --config .pre-commit-config.yaml --all-files
    - name: Check updated paths
      shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r entry; do
          path=${entry:3}
          if [[ "$path" != .pre-commit-config.yaml ]]; then
            echo "::error::hook update changed unexpected path: $path" >&2
            exit 1
          fi
        done < <(git status --porcelain=v1 --untracked-files=all)
    - id: patch
      shell: bash
      run: |
        set -euo pipefail
        if git diff --quiet -- .pre-commit-config.yaml; then
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'changed=true' >>"$GITHUB_OUTPUT"
        git diff --binary -- .pre-commit-config.yaml >"$RUNNER_TEMP/hooks.patch"
        test -s "$RUNNER_TEMP/hooks.patch"
