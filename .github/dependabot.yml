version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
  - package-ecosystem: github-actions
    directory: /check-hook-update-cooldown
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
