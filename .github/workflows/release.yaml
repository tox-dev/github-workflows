name: Release actions
on:
  push:
    tags: ["*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 .venv
          uv pip sync --preview-features pylock --python .venv/bin/python pylock.toml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check tagged source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag --list | release-creator tags "$TAG"
          prek run --all-files
          pytest -q
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          args=()
          if [[ -n "$previous" ]]; then
            args+=(--previous "$previous")
          fi
          release-creator notes --changelog CHANGELOG.md --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" "${args[@]}" \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
