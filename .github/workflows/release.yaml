name: Release actions
on:
  push:
    tags: ["*"]
permissions:
  contents: read
jobs:
  validate:
    uses: $/.github/workflows/validate-release.yaml
    permissions:
      contents: read
      pull-requests: read
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 .venv
          uv pip sync --preview-features pylock --python .venv/bin/python --group release --group test pylock.toml
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - name: Fetch contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          args=(-f "tag_name=$TAG")
          if [[ -n "$previous" ]]; then
            args+=(-f "previous_tag_name=$previous")
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body \
            >"$RUNNER_TEMP/generated-notes.md"
      - uses: $/render-release-notes
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
