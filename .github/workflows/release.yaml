name: Release actions
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    name: 📝 Render GitHub Release notes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install release tools
        env:
          EXCLUDE_NEWER: 7 days
          # Temporary: release-creator 4.3.2 is younger than seven days. Delete after 2026-11-06.
          EXCLUDE_NEWER_PACKAGE: release-creator=2026-10-30T15:13:19Z
        run: |
          tools/install_live_tools.py .venv 'release-creator>=4.3'
          uv run --no-project --python .venv python tools/expose_locked_commands.py .venv
      - name: 📝 Render release notes
        uses: $/render-release-notes
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
      - name: 📤 Upload release notes
        id: artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish:
    name: 🚀 Publish GitHub Release
    needs: notes
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: 📩 Download release notes
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: 🚀 Publish GitHub Release
        uses: $/publish-github-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
