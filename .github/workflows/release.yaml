name: Release actions
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          git check-ref-format "refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
  notes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install release tools
        env:
          EXCLUDE_NEWER: 7 days
          # Temporary: release-creator 2.0.0 is younger than seven days. Delete after 2026-11-01.
          EXCLUDE_NEWER_PACKAGE: release-creator=2026-10-25T07:08:32Z
        run: |
          tools/install_live_tools.sh .venv 'release-creator>=2.0.0'
          uv run --no-project --python .venv python tools/expose_locked_commands.py .venv
      - uses: $/render-release-notes
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish:
    needs: [source, notes]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: Require the tag to still name the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" = "$GITHUB_SHA"
      - uses: $/publish-github-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ needs.source.outputs.commit }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
