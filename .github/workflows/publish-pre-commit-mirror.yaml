name: 🪞 Publish pre-commit mirror
on:
  workflow_call:
    inputs:
      package-name:
        description: Package that pre-commit-mirror-maker wraps, such as pyproject-fmt
        required: true
        type: string
      files-regex:
        description: Regular expression for the files the mirrored hook accepts
        required: true
        type: string
      exclude-newer:
        description: Upload cutoff for the tools the shared Actions install from PyPI
        type: string
        default: 7 days
      exclude-newer-package:
        description: Newline-separated name=date cutoffs that override exclude-newer for single packages
        type: string
        default: ""
permissions: {}
concurrency:
  group: pre-commit-mirror-${{ github.repository }}
  cancel-in-progress: false
jobs:
  mirror:
    name: 🪞 Mirror
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 🚫 Refuse untrusted caller event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
          pull_request | pull_request_target | workflow_run | issue_comment | merge_group)
            echo "::error::writer job refuses $EVENT_NAME callers; call it from push, schedule, workflow_dispatch or release"
            exit 1
            ;;
          esac
      - name: 📥 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.7"
          enable-cache: false
      - name: ⚙️ Configure Git identity
        run: |
          set -euo pipefail
          git config user.name 'Github Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 🪞 Generate mirror
        id: generate
        env:
          EXCLUDE_NEWER: ${{ inputs.exclude-newer }}
          EXCLUDE_NEWER_PACKAGE: ${{ inputs.exclude-newer-package }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          FILES_REGEX: ${{ inputs.files-regex }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          echo "base=$base" >>"$GITHUB_OUTPUT"
          options=(--exclude-newer "$EXCLUDE_NEWER")
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then options+=(--exclude-newer-package "$line"); fi
          done <<<"$EXCLUDE_NEWER_PACKAGE"
          uvx -p 3.15 "${options[@]}" --from pre-commit-mirror-maker==1.14.0 pre-commit-mirror . \
            --language=python --package-name="$PACKAGE_NAME" --files-regex "$FILES_REGEX"
          if [[ "$(git rev-parse HEAD)" == "$base" ]]; then
            echo 'No new mirror versions'
            echo 'mirrored=false' >>"$GITHUB_OUTPUT"
          else
            echo 'mirrored=true' >>"$GITHUB_OUTPUT"
          fi
      - name: 📝 Update README with current version
        if: ${{ steps.generate.outputs.mirrored == 'true' }}
        run: |
          set -euo pipefail
          version=$(cat .version)
          # keep the quoting style of the README, which may write rev: v1.2.3 or rev: "v1.2.3"
          sed -E -i "s/^([[:space:]]*rev:[[:space:]]*)(\"?)v?[^\"[:space:]]+\\2/\\1\\2v$version\\2/" README.md
          if ! grep -Eq "rev:[[:space:]]*\"?v$version\"?$" README.md; then
            echo "::error::README.md has no rev: line to update to v$version" >&2
            exit 1
          fi
      - name: 💅 Format generated files
        if: ${{ steps.generate.outputs.mirrored == 'true' }}
        env:
          EXCLUDE_NEWER: ${{ inputs.exclude-newer }}
          EXCLUDE_NEWER_PACKAGE: ${{ inputs.exclude-newer-package }}
        run: |
          set -euo pipefail
          options=(--exclude-newer "$EXCLUDE_NEWER")
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then options+=(--exclude-newer-package "$line"); fi
          done <<<"$EXCLUDE_NEWER_PACKAGE"
          prek=(uvx "${options[@]}" --from prek==0.5.5 prek)
          # The first run exits 1 when a hook rewrites files; the second run must pass on the rewritten tree.
          status=0
          "${prek[@]}" run --all-files || status=$?
          case "$status" in
          0)
            echo 'Formatting left the generated files unchanged'
            ;;
          1)
            echo 'Formatting rewrote generated files, checking the result'
            "${prek[@]}" run --all-files
            ;;
          *)
            echo "::error::prek exited with $status, not a file change" >&2
            exit "$status"
            ;;
          esac
      - name: ⚙️ Configure Git credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com --force
      - name: 🔄 Commit mirror changes
        id: commit
        if: ${{ steps.generate.outputs.mirrored == 'true' }}
        env:
          BASE: ${{ steps.generate.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          # Folds the README and formatting changes into the newest mirror commit; its tag moves locally only.
          if ! git diff --cached --quiet; then
            git commit --quiet --amend --no-edit
            git tag --force "v$(cat .version)"
          fi
          mapfile -t commits < <(git rev-list --reverse "$BASE..HEAD")
          tags=()
          for commit in "${commits[@]}"; do
            tags+=("$(git tag --points-at "$commit")")
          done
          pushed=()
          for tag in "${tags[@]}"; do
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
            case "$status" in
            0)
              git fetch --quiet --no-tags origin "refs/tags/$tag"
              published=$(git rev-parse 'FETCH_HEAD^{tree}')
              regenerated=$(git rev-parse "$tag^{tree}")
              if [[ "$published" != "$regenerated" ]]; then
                echo "::error::$tag is published with a different mirror tree ($published), the regenerated tree is $regenerated; bump the package version to publish new content" >&2
                exit 1
              fi
              echo "::notice::$tag is already published with identical mirror content, not pushing it"
              ;;
            2) pushed+=("$tag") ;;
            *)
              echo "::error::could not read tags from origin, git exited with $status" >&2
              exit "$status"
              ;;
            esac
          done
          echo "tags=${pushed[*]}" >>"$GITHUB_OUTPUT"
      - name: 🚀 Push mirror commits and tags
        if: ${{ github.ref == 'refs/heads/main' && steps.commit.outputs.tags != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAGS: ${{ steps.commit.outputs.tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<<"$NEW_TAGS"
          refs=()
          for tag in "${tags[@]}"; do refs+=("refs/tags/$tag"); done
          git push --atomic origin HEAD:refs/heads/main "${refs[@]}"
      - name: 🎉 Create GitHub releases
        if: ${{ github.ref == 'refs/heads/main' && steps.commit.outputs.tags != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAGS: ${{ steps.commit.outputs.tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<<"$NEW_TAGS"
          for tag in "${tags[@]}"; do
            gh release create "$tag" --generate-notes
          done
