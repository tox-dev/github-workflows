name: Label bot news
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Verifies source CI and PR metadata without checkout or artifacts.
    workflows: [Check]
    types: [completed]
permissions: {}
concurrency:
  group: label-bot-news-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  label:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - id: pr
        uses: $/resolve-pr-from-run
        with:
          run-id: ${{ github.event.workflow_run.id }}
          workflow-path: .github/workflows/check.yaml
      - if: steps.pr.outputs.bot-author == 'true'
        uses: $/label-bot-news
        with:
          pull-request: ${{ steps.pr.outputs.number }}
          bot-author: "true"
