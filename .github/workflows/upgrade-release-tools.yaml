name: Upgrade release tools
on:
  workflow_call:
    inputs:
      lock:
        description: Path to the checked-in pylock file
        type: string
        default: pylock.toml
      hook-config:
        description: Path to the pre-commit configuration
        type: string
        default: .pre-commit-config.yaml
      python-version:
        description: Python version used to run the exporter and release tools
        type: string
        default: "3.15"
      keep-uv-lock:
        description: Also refresh a checked-in uv.lock used by the project build
        type: boolean
        default: false
      exclude-newer-packages:
        description: Reviewed package=UTC cutoff entries exempted from the seven-day cutoff, one per line
        type: string
        default: ""
      branch:
        description: Branch used for the dependency pull request
        type: string
        default: automation/update-release-tools
      check-workflow:
        description: Workflow dispatched on the update branch
        type: string
        default: check.yaml
      base:
        description: Target branch for the dependency pull request
        type: string
        default: main
      commit-message:
        description: Commit message for the refreshed dependency files
        type: string
        default: "🔧 build(deps): refresh release tools"
      pull-request-title:
        description: Title for the dependency pull request
        type: string
        default: "🔧 build(deps): refresh release tools"
      pull-request-body:
        description: Body for the dependency pull request
        type: string
        default: |-
          Refresh the project lock and exact pre-commit hook dependency pins.
permissions: {}
jobs:
  generate-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - id: lock
        uses: $/refresh-release-lock
        with:
          lock: ${{ inputs.lock }}
          python-version: ${{ inputs.python-version }}
          keep-uv-lock: ${{ inputs.keep-uv-lock }}
          exclude-newer-packages: ${{ inputs.exclude-newer-packages }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/lock.patch
          if-no-files-found: error
          retention-days: 1
  generate-hooks:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.hooks.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - id: hooks
        uses: $/refresh-hook-pins
        with:
          config: ${{ inputs.hook-config }}
          python-version: ${{ inputs.python-version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.hooks.outputs.changed == 'true'
        with:
          name: release-tools-hooks
          path: ${{ runner.temp }}/hooks.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [generate-lock, generate-hooks]
    if: (needs.generate-lock.outputs.changed == 'true' || needs.generate-hooks.outputs.changed == 'true') && github.ref == format('refs/heads/{0}', inputs.base)
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate-lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/release-tools-lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate-hooks.outputs.changed == 'true'
        with:
          name: release-tools-hooks
          path: ${{ runner.temp }}/release-tools-hooks
      - name: Apply lock patch
        if: needs.generate-lock.outputs.changed == 'true'
        run: |
          git apply --check "$RUNNER_TEMP/release-tools-lock/lock.patch"
          git apply --index "$RUNNER_TEMP/release-tools-lock/lock.patch"
      - name: Apply hook patch
        if: needs.generate-hooks.outputs.changed == 'true'
        run: |
          git apply --check "$RUNNER_TEMP/release-tools-hooks/hooks.patch"
          git apply --index "$RUNNER_TEMP/release-tools-hooks/hooks.patch"
      - name: Check dependency patch paths
        env:
          LOCK: ${{ inputs.lock }}
          CONFIG: ${{ inputs.hook-config }}
          KEEP_UV_LOCK: ${{ inputs.keep-uv-lock }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if [[ "$path" != "$LOCK" && "$path" != "$CONFIG" && ("$KEEP_UV_LOCK" != true || "$path" != uv.lock) ]]; then
              echo "::error::unexpected dependency path: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only)
          git diff --cached --check
      - name: Check dependency patch file mode
        run: |
          set -euo pipefail
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            if [[ "${fields[1]}" != 100644 ]]; then
              echo "::error::unexpected dependency file mode in $path: ${fields[1]}" >&2
              exit 1
            fi
          done < <(git diff --cached --raw --no-renames -z)
      - name: Commit refreshed tools
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
      - name: Check dependency branch
        env:
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH"
          if [[ "$BRANCH" == "$BASE" ]]; then
            echo '::error::dependency branch must differ from the base branch' >&2
            exit 1
          fi
      - name: Push dependency branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          gh auth setup-git --hostname github.com --force
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
      - name: Write dependency pull request body
        env:
          PR_BODY: ${{ inputs.pull-request-body }}
          EXCLUDE_NEWER_PACKAGES: ${{ inputs.exclude-newer-packages }}
        run: |
          printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/pull-request.md"
          if [[ -n "$EXCLUDE_NEWER_PACKAGES" ]]; then
            printf '\nSeven-day cutoff exceptions:\n' >>"$RUNNER_TEMP/pull-request.md"
            while IFS= read -r entry; do
              if [[ -n "$entry" ]]; then
                printf -- '- `%s`\n' "$entry" >>"$RUNNER_TEMP/pull-request.md"
              fi
            done <<<"$EXCLUDE_NEWER_PACKAGES"
          fi
      - name: Find dependency pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: printf 'number=%s\n' "$(gh pr list --base "$BASE" --head "$BRANCH" --state open --json number --jq '.[0].number')" >>"$GITHUB_OUTPUT"
      - name: Update dependency pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pull-request.md" --add-label dependencies --add-label 'skip news'
      - name: Open dependency pull request
        if: steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: gh pr create --base "$BASE" --head "$BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pull-request.md" --label dependencies --label 'skip news'
      - name: Run dependency branch checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          CHECK_WORKFLOW: ${{ inputs.check-workflow }}
        run: gh workflow run "$CHECK_WORKFLOW" --ref "$BRANCH"
