name: Upgrade release tools
on:
  workflow_call:
    inputs:
      lock:
        description: Path to the checked-in pylock file
        type: string
        default: pylock.toml
      python-version:
        description: Python version used to run the exporter and release tools
        type: string
        default: "3.15"
      branch:
        description: Branch used for the dependency pull request
        type: string
        default: automation/update-release-tools
      check-workflow:
        description: Workflow dispatched on the update branch
        type: string
        default: check.yaml
      base:
        description: Target branch for the dependency pull request
        type: string
        default: main
      commit-message:
        description: Commit message for the refreshed lock
        type: string
        default: "🔧 build(deps): refresh release lock"
      pull-request-title:
        description: Title for the dependency pull request
        type: string
        default: "🔧 build(deps): refresh release tool lock"
      pull-request-body:
        description: Body for the dependency pull request
        type: string
        default: |-
          Refresh the project lock across its runtime dependencies, groups, extras, and supported Python versions.
permissions: {}
jobs:
  generate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - id: lock
        uses: $/refresh-release-lock
        with:
          lock: ${{ inputs.lock }}
          python-version: ${{ inputs.python-version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/lock.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', inputs.base)
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/release-tools-lock
      - name: Apply lock patch
        run: |
          git apply --check "$RUNNER_TEMP/release-tools-lock/lock.patch"
          git apply --index "$RUNNER_TEMP/release-tools-lock/lock.patch"
      - name: Check lock patch paths
        env:
          LOCK: ${{ inputs.lock }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if [[ "$path" != "$LOCK" ]]; then
              echo "::error::unexpected lock path: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only)
          git diff --cached --check
      - name: Check lock patch file mode
        run: |
          set -euo pipefail
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            if [[ "${fields[1]}" != 100644 ]]; then
              echo "::error::unexpected lock file mode in $path: ${fields[1]}" >&2
              exit 1
            fi
          done < <(git diff --cached --raw --no-renames -z)
      - name: Commit refreshed lock
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
      - name: Check dependency branch
        env:
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH"
          if [[ "$BRANCH" == "$BASE" ]]; then
            echo '::error::dependency branch must differ from the base branch' >&2
            exit 1
          fi
      - name: Push dependency branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          gh auth setup-git --hostname github.com --force
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
      - name: Write dependency pull request body
        env:
          PR_BODY: ${{ inputs.pull-request-body }}
        run: printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/pull-request.md"
      - name: Find dependency pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: printf 'number=%s\n' "$(gh pr list --base "$BASE" --head "$BRANCH" --state open --json number --jq '.[0].number')" >>"$GITHUB_OUTPUT"
      - name: Update dependency pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pull-request.md" --add-label dependencies --add-label 'skip news'
      - name: Open dependency pull request
        if: steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: gh pr create --base "$BASE" --head "$BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pull-request.md" --label dependencies --label 'skip news'
      - name: Run dependency branch checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          CHECK_WORKFLOW: ${{ inputs.check-workflow }}
        run: gh workflow run "$CHECK_WORKFLOW" --ref "$BRANCH"
