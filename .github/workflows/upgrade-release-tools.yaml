name: Upgrade release tools
on:
  workflow_call:
    inputs:
      lock-groups:
        description: Release dependency groups selected by the universal lock
        required: true
        type: string
      additional-lock:
        description: Optional secondary pylock basename for a separate build matrix
        type: string
        default: ""
      additional-lock-groups:
        description: Groups for the secondary lock; empty selects build requirements
        type: string
        default: ""
      additional-lock-selection:
        description: Select project dependencies and configured groups for the secondary lock
        type: string
        default: build-or-groups
      additional-matrix-python:
        description: Python range for the secondary lock
        type: string
        default: ""
      additional-matrix-platforms:
        description: Space-separated Nab platform IDs for the secondary lock
        type: string
        default: ""
      additional-matrix-implementations:
        description: Space-separated implementations for the secondary lock
        type: string
        default: ""
      commit-message:
        description: Commit message for the refreshed dependency files
        type: string
        default: "🔧 build(deps): refresh release tools"
      pull-request-title:
        description: Title for the dependency pull request
        type: string
        default: "🔧 build(deps): refresh release tools"
      pull-request-body:
        description: Body for the dependency pull request
        type: string
        default: |-
          Refresh the project lock and exact pre-commit hook dependency pins.
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Repo-only release App key
        required: true
permissions: {}
jobs:
  generate-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - id: lock
        uses: $/refresh-release-lock
        with:
          lock-groups: ${{ inputs.lock-groups }}
          additional-lock: ${{ inputs.additional-lock }}
          additional-lock-groups: ${{ inputs.additional-lock-groups }}
          additional-lock-selection: ${{ inputs.additional-lock-selection }}
          additional-matrix-python: ${{ inputs.additional-matrix-python }}
          additional-matrix-platforms: ${{ inputs.additional-matrix-platforms }}
          additional-matrix-implementations: ${{ inputs.additional-matrix-implementations }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/lock.patch
          if-no-files-found: error
          retention-days: 7
  generate-hooks:
    runs-on: ubuntu-26.04
    env:
      UV_EXCLUDE_NEWER: ""
      UV_EXCLUDE_NEWER_PACKAGE: ""
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.hooks.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: $/install-locked-tools
        with:
          groups: release-hooks
          lock-source: shared
          venv: ${{ runner.temp }}/hook-tools
      - name: Refresh frozen hook revisions
        run: >-
          uv run --no-project --python "$RUNNER_TEMP/hook-tools" prek update --config .pre-commit-config.yaml --freeze --cooldown-days 7 --no-progress
      - name: Refresh exact hook dependencies
        run: >-
          uv run --no-project --python "$RUNNER_TEMP/hook-tools" release-creator hooks --exclude-newer '7 days' --python-version 3.15
      - id: hooks
        name: Write hook patch
        run: |
          set -euo pipefail
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >>"$GITHUB_OUTPUT"
          git diff --binary -- .pre-commit-config.yaml >"$RUNNER_TEMP/hooks.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.hooks.outputs.changed == 'true'
        with:
          name: release-tools-hooks
          path: ${{ runner.temp }}/hooks.patch
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [generate-lock, generate-hooks]
    if: |
      (needs.generate-lock.outputs.changed == 'true' || needs.generate-hooks.outputs.changed == 'true') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate-lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/release-tools-lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate-hooks.outputs.changed == 'true'
        with:
          name: release-tools-hooks
          path: ${{ runner.temp }}/release-tools-hooks
      - name: Check artifact patch paths
        env:
          ADDITIONAL_LOCK: ${{ inputs.additional-lock }}
          LOCK_CHANGED: ${{ needs.generate-lock.outputs.changed }}
          HOOKS_CHANGED: ${{ needs.generate-hooks.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ -n "$ADDITIONAL_LOCK" &&
            ("$ADDITIONAL_LOCK" != pylock.*.toml || "$ADDITIONAL_LOCK" == */*) ]]; then
            echo "::error::invalid additional lock: $ADDITIONAL_LOCK" >&2
            exit 1
          fi
          for artifact in lock hooks; do
            if [[ "$artifact" == lock ]]; then
              [[ "$LOCK_CHANGED" == true ]] || continue
              patch="$RUNNER_TEMP/release-tools-lock/lock.patch"
            else
              [[ "$HOOKS_CHANGED" == true ]] || continue
              patch="$RUNNER_TEMP/release-tools-hooks/hooks.patch"
            fi
            GIT_INDEX_FILE="$RUNNER_TEMP/$artifact.index" git read-tree HEAD
            GIT_INDEX_FILE="$RUNNER_TEMP/$artifact.index" git apply --cached "$patch"
            GIT_INDEX_FILE="$RUNNER_TEMP/$artifact.index" \
              git diff --cached --name-only --no-renames -z >"$RUNNER_TEMP/$artifact-paths"
            while IFS= read -r -d '' path; do
              if [[ "$artifact" == lock && "$path" != pylock.toml && "$path" != pyproject.toml &&
                "$path" != "$ADDITIONAL_LOCK" ]] ||
                [[ "$artifact" == hooks && "$path" != .pre-commit-config.yaml ]]; then
                echo "::error::unexpected $artifact patch path: $path" >&2
                exit 1
              fi
            done <"$RUNNER_TEMP/$artifact-paths"
          done
      - name: Apply lock patch
        if: needs.generate-lock.outputs.changed == 'true'
        run: git apply --index "$RUNNER_TEMP/release-tools-lock/lock.patch"
      - name: Apply hook patch
        if: needs.generate-hooks.outputs.changed == 'true'
        run: git apply --index "$RUNNER_TEMP/release-tools-hooks/hooks.patch"
      - name: Check dependency patch file mode
        run: |
          set -euo pipefail
          git diff --cached --raw --no-renames -z >"$RUNNER_TEMP/dependency-modes"
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            if [[ "${fields[1]}" != 100644 ]]; then
              echo "::error::unexpected dependency file mode in $path: ${fields[1]}" >&2
              exit 1
            fi
          done <"$RUNNER_TEMP/dependency-modes"
      - uses: $/verify-nab-cutoff-patch
      - name: Commit refreshed tools
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
      - id: repository
        name: Select the current repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repository.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push dependency branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git --hostname github.com --force
          git push --force-with-lease origin HEAD:refs/heads/automation/update-release-tools
      - name: Write dependency pull request body
        env:
          PR_BODY: ${{ inputs.pull-request-body }}
        run: printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/pull-request.md"
      - name: Find dependency pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open \
            -f head="$owner:automation/update-release-tools" -f base=main |
            jq -r --arg repository "$GITHUB_REPOSITORY" '
              [.[] | select(.head.repo.full_name == $repository and
                .head.ref == "automation/update-release-tools" and .base.ref == "main")] |
              if length == 0 then "number="
              elif length == 1 then "number=\(.[0].number)"
              else error("multiple dependency pull requests") end
            ' >>"$GITHUB_OUTPUT"
      - name: Update dependency pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: |
          gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pull-request.md" \
            --add-label dependencies --add-label 'skip news'
      - name: Open dependency pull request
        if: steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: |
          gh pr create --base main --head automation/update-release-tools --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pull-request.md" --label dependencies --label 'skip news'
