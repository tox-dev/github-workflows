name: Upgrade release tools
on:
  workflow_call:
    inputs:
      lock:
        description: Path to the checked-in pylock file
        type: string
        default: pylock.toml
      hook-config:
        description: Path to the pre-commit configuration
        type: string
        default: .pre-commit-config.yaml
      python-version:
        description: Python version used to run the exporter and release tools
        type: string
        default: "3.15"
      check-group:
        description: Dependency group containing prek
        type: string
        default: release
      keep-uv-lock:
        description: Also refresh a checked-in uv.lock used by the project build
        type: boolean
        default: false
      build-constraints:
        description: Generated backend constraints path kept with the project lock
        type: string
        default: ""
      build-requirements:
        description: Additional build requirements, one per line
        type: string
        default: ""
      exclude-newer-packages:
        description: Reviewed package=UTC minimum cutoffs; each expires when the seven-day cutoff passes it
        type: string
        default: ""
      branch:
        description: Branch used for the dependency pull request
        type: string
        default: automation/update-release-tools
      base:
        description: Target branch for the dependency pull request
        type: string
        default: main
      commit-message:
        description: Commit message for the refreshed dependency files
        type: string
        default: "🔧 build(deps): refresh release tools"
      pull-request-title:
        description: Title for the dependency pull request
        type: string
        default: "🔧 build(deps): refresh release tools"
      pull-request-body:
        description: Body for the dependency pull request
        type: string
        default: |-
          Refresh the project lock and exact pre-commit hook dependency pins.
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Repo-only release App key
        required: true
permissions: {}
jobs:
  generate-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - id: lock
        uses: $/refresh-release-lock
        with:
          lock: ${{ inputs.lock }}
          python-version: ${{ inputs.python-version }}
          check-group: ${{ inputs.check-group }}
          keep-uv-lock: ${{ inputs.keep-uv-lock }}
          build-constraints: ${{ inputs.build-constraints }}
          build-requirements: ${{ inputs.build-requirements }}
          hook-config: ${{ inputs.hook-config }}
          exclude-newer-packages: ${{ inputs.exclude-newer-packages }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/lock.patch
          if-no-files-found: error
          retention-days: 1
  generate-hooks:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.hooks.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - id: hooks
        uses: $/refresh-hook-pins
        with:
          config: ${{ inputs.hook-config }}
          python-version: ${{ inputs.python-version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.hooks.outputs.changed == 'true'
        with:
          name: release-tools-hooks
          path: ${{ runner.temp }}/hooks.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [generate-lock, generate-hooks]
    if: |
      (needs.generate-lock.outputs.changed == 'true' || needs.generate-hooks.outputs.changed == 'true') &&
      github.ref == format('refs/heads/{0}', inputs.base)
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate-lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/release-tools-lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate-hooks.outputs.changed == 'true'
        with:
          name: release-tools-hooks
          path: ${{ runner.temp }}/release-tools-hooks
      - name: Apply lock patch
        if: needs.generate-lock.outputs.changed == 'true'
        run: |
          git apply --check "$RUNNER_TEMP/release-tools-lock/lock.patch"
          git apply --index "$RUNNER_TEMP/release-tools-lock/lock.patch"
      - name: Apply hook patch
        if: needs.generate-hooks.outputs.changed == 'true'
        run: |
          git apply --check "$RUNNER_TEMP/release-tools-hooks/hooks.patch"
          git apply --index "$RUNNER_TEMP/release-tools-hooks/hooks.patch"
      - name: Check dependency patch paths
        env:
          LOCK: ${{ inputs.lock }}
          CONFIG: ${{ inputs.hook-config }}
          KEEP_UV_LOCK: ${{ inputs.keep-uv-lock }}
          BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if [[ "$path" != "$LOCK" && "$path" != "$CONFIG" && "$path" != "$BUILD_CONSTRAINTS" ]] &&
              [[ "$KEEP_UV_LOCK" != true || "$path" != uv.lock ]]; then
              echo "::error::unexpected dependency path: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only)
          git diff --cached --check
      - name: Check dependency patch file mode
        run: |
          set -euo pipefail
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            if [[ "${fields[1]}" != 100644 ]]; then
              echo "::error::unexpected dependency file mode in $path: ${fields[1]}" >&2
              exit 1
            fi
          done < <(git diff --cached --raw --no-renames -z)
      - name: Commit refreshed tools
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
      - name: Check dependency branch
        env:
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH"
          if [[ "$BRANCH" == "$BASE" ]]; then
            echo '::error::dependency branch must differ from the base branch' >&2
            exit 1
          fi
      - name: Check release App credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_CLIENT_ID"
          test -n "$RELEASE_APP_PRIVATE_KEY"
      - id: repository
        name: Select the current repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repository.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push dependency branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          gh auth setup-git --hostname github.com --force
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
      - name: Write dependency pull request body
        env:
          PR_BODY: ${{ inputs.pull-request-body }}
          EXCLUDE_NEWER_PACKAGES: ${{ inputs.exclude-newer-packages }}
        run: |
          printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/pull-request.md"
          if [[ -n "$EXCLUDE_NEWER_PACKAGES" ]]; then
            printf '\nReviewed package cutoff floors:\n' >>"$RUNNER_TEMP/pull-request.md"
            while IFS= read -r entry; do
              if [[ -n "$entry" ]]; then
                printf -- '- %s\n' "\`$entry\`" >>"$RUNNER_TEMP/pull-request.md"
              fi
            done <<<"$EXCLUDE_NEWER_PACKAGES"
          fi
      - name: Find dependency pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$BRANCH" -f base="$BASE" |
            jq -r --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg base "$BASE" '
              [.[] | select(.head.repo.full_name == $repository and .head.ref == $branch and .base.ref == $base)] |
              if length == 0 then "number="
              elif length == 1 then "number=\(.[0].number)"
              else error("multiple dependency pull requests") end
            ' >>"$GITHUB_OUTPUT"
      - name: Update dependency pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: |
          gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pull-request.md" \
            --add-label dependencies --add-label 'skip news'
      - name: Open dependency pull request
        if: steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.pull-request-title }}
        run: |
          gh pr create --base "$BASE" --head "$BRANCH" --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pull-request.md" --label dependencies --label 'skip news'
