name: Cooled hooks
on:
  workflow_call:
    inputs:
      exclude-newer:
        description: Upload cutoff for the lock reader the shared Actions install from PyPI
        type: string
        default: 7 days
      exclude-newer-package:
        description: Newline-separated name=date cutoffs for single locked tools; hook environments ignore them
        type: string
        default: ""
permissions: {}
jobs:
  hooks:
    name: 🧹 Hooks under the cooldown
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 💾 Restore prek cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          # A changed hook or cutoff exception misses the cache, so its environment builds under the cutoff again.
          key: prek-cooled-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: $/install-locked-tools
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
          exclude-newer: ${{ inputs.exclude-newer }}
          exclude-newer-package: ${{ inputs.exclude-newer-package }}
      - name: 🧹 Run every hook under the cooldown
        uses: $/cooled-prek
        with:
          args: run --all-files --show-diff-on-failure
