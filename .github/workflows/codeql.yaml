name: CodeQL
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages; each language gets its own analysis job
        type: string
        default: '["actions","python"]'
      paths-ignore:
        description: JSON array of path patterns CodeQL skips, written to its configuration
        type: string
        default: "[]"
      queries:
        description: Query suite or comma-separated query list for CodeQL init
        type: string
        default: security-extended
      config-file:
        description: Repository path to a CodeQL configuration file; when set, paths-ignore has no effect
        type: string
        default: ""
      build-mode:
        description: CodeQL build mode for each language, such as none or autobuild
        type: string
        default: none
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}
          config-file: ${{ inputs.config-file }}
          config: "${{ inputs.config-file == '' && format('paths-ignore: {0}', inputs.paths-ignore) || '' }}"
      - name: 🛡️ Analyze
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
