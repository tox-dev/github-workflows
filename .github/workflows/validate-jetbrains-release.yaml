name: Validate JetBrains release
on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      pull-request:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  rehearse:
    runs-on: ubuntu-26.04
    steps:
      - name: Limit rehearsal targets
        env:
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          case "$REPOSITORY/$PR_NUMBER" in
          tox-dev/PyVenvManage/274 | tox-dev/jetbrains-fish/150) ;;
          *)
            echo '::error::unsupported rehearsal target' >&2
            exit 1
            ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull-request }}/head
      - name: Verify the exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Add a local release fragment
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          printf 'Verify a user-visible plugin fix.\n' >"changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git add "changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com \
            commit -m "Validate plugin release (#${PR_NUMBER})"
      - name: Create a local release remote
        run: |
          git init --bare "$RUNNER_TEMP/rehearsal.git"
          git remote add rehearsal "$RUNNER_TEMP/rehearsal.git"
          git push rehearsal HEAD:refs/heads/main
      - name: Reject an unsupported fragment name
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          set -euo pipefail
          mv "changelog.d/+validation-${PR_NUMBER}.bugfix.md" "changelog.d/validation-${PR_NUMBER}.bugfix.md"
          if git tag --list | release-creator tags --next auto; then
            echo '::error::unsupported fragment was accepted' >&2
            exit 1
          fi
          mv "changelog.d/validation-${PR_NUMBER}.bugfix.md" "changelog.d/+validation-${PR_NUMBER}.bugfix.md"
      - name: Reject an invalid release tag
        run: |
          if release-creator tags v0.1; then
            echo '::error::invalid release tag was accepted' >&2
            exit 1
          fi
      - name: Dirty the release checkout
        run: touch untracked-release-file
      - id: dirty_prepare
        name: Reject a dirty release checkout
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          tag-prefix: v
          changelog: CHANGELOG.md
          fragments: changelog.d
          format: markdown
          patch: ${{ runner.temp }}/dirty-release.patch
      - name: Check dirty checkout rejection
        env:
          OUTCOME: ${{ steps.dirty_prepare.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          rm untracked-release-file
      - id: candidate
        name: Record local candidate
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - id: prepare
        uses: $/prepare-towncrier
        with:
          tag-prefix: v
          changelog: CHANGELOG.md
          fragments: changelog.d
          format: markdown
          repository: ${{ inputs.repository }}
          patch: ${{ runner.temp }}/release.patch
      - name: Restore the local candidate
        run: git reset --hard HEAD
      - id: stale_validate
        name: Reject a stale release branch
        uses: $/validate-release-patch
        continue-on-error: true
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: CHANGELOG.md
          fragments: changelog.d
          remote: rehearsal
          expected-sha: "0000000000000000000000000000000000000000"
          repository: ${{ inputs.repository }}
      - name: Check stale branch rejection
        env:
          OUTCOME: ${{ steps.stale_validate.outcome }}
        run: test "$OUTCOME" = failure
      - uses: $/validate-release-patch
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: CHANGELOG.md
          fragments: changelog.d
          remote: rehearsal
          expected-sha: ${{ steps.candidate.outputs.sha }}
          repository: ${{ inputs.repository }}
      - name: Commit and tag locally
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com \
            commit -m "release $VERSION"
          git tag "$VERSION"
      - name: Select Marketplace URL
        id: marketplace
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          case "$REPOSITORY" in
          tox-dev/PyVenvManage) url=https://plugins.jetbrains.com/plugin/20536-pyvenv-manage-2 ;;
          tox-dev/jetbrains-fish) url=https://plugins.jetbrains.com/plugin/29973-fish-shell ;;
          esac
          echo "url=$url" >>"$GITHUB_OUTPUT"
      - uses: $/render-release-notes
        with:
          tag: ${{ steps.prepare.outputs.version }}
          changelog: CHANGELOG.md
          repository: ${{ inputs.repository }}
          artifact-url: ${{ steps.marketplace.outputs.url }}
          artifact-label: JetBrains Marketplace
          output: ${{ runner.temp }}/release-notes.md
      - name: Check rendered notes
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          grep -Fq '### Bug fixes' "$RUNNER_TEMP/release-notes.md"
          grep -Fq '[JetBrains Marketplace](https://plugins.jetbrains.com/plugin/' "$RUNNER_TEMP/release-notes.md"
          grep -Fq "**Full Changelog**: https://github.com/$REPOSITORY/compare/" "$RUNNER_TEMP/release-notes.md"
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Set plugin version from the local tag
        env:
          TAG: ${{ steps.prepare.outputs.version }}
        run: sed -i "s/^pluginVersion=.*/pluginVersion=${TAG#v}/" gradle.properties
      - name: Build the plugin ZIP
        run: ./gradlew --console=plain buildPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetbrains-release-rehearsal
          path: |
            ${{ runner.temp }}/release-notes.md
            build/distributions/*.zip
          if-no-files-found: error
