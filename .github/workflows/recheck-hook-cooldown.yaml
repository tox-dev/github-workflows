name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: recheck-hook-cooldown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recheck:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: $/recheck-hook-update-cooldown
