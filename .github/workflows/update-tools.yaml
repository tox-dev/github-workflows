name: Update release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"
permissions: {}
jobs:
  update:
    uses: $/.github/workflows/upgrade-release-tools.yaml
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      python-version: "3.15"
      check-group: release-check
      build-constraints: release-build-constraints.txt
      build-requirements: |-
        Cython>=3.0
        setuptools>=80
      exclude-newer-packages: release-creator=2026-10-22T13:51:56Z
      commit-message: "🔧 build: refresh release tool lock"
      pull-request-title: "🔧 build: refresh release tool lock"
      pull-request-body: "Refresh the locked tools used by release preparation and CI."
