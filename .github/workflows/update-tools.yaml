name: Update release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"
permissions: {}
jobs:
  update:
    uses: $/.github/workflows/upgrade-release-tools.yaml
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      commit-message: "🔧 build: refresh release tool lock"
      pull-request-title: "🔧 build: refresh release tool lock"
      pull-request-body: "Refresh the locked tools used by release preparation and CI."
      # Temporary: release-creator 2.0.0 is younger than seven days. Delete after 2026-11-01.
      exclude-newer-package: release-creator=2026-10-25T07:08:32Z
