name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
jobs:
  prepare:
    uses: $/.github/workflows/prepare-towncrier-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      # Temporary: release-creator 2.0.0 is younger than seven days. Delete after 2026-11-01.
      exclude-newer-package: release-creator=2026-10-25T07:08:32Z
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
