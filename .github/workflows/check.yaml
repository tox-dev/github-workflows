name: Check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'current' }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}
jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            pylock.toml
            pyproject.toml
      - uses: $/install-locked-tools
        with:
          groups: release-check
          venv: .release-tools
      - name: Check repository formatting
        run: tools/cooled_prek.sh run --all-files
  shell:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            pylock.toml
            pyproject.toml
      - uses: $/install-locked-tools
        with:
          groups: release-shell
          venv: .release-tools
      - name: Check inline shell
        run: |
          set -euo pipefail
          script_dir=./inline-shell-check
          mkdir "$script_dir"
          trap 'rm -rf "$script_dir"' EXIT
          for file in .github/workflows/*.yaml */action.yml; do
            yq -rj '[.. | objects | select(has("run")) | .run] | .[] | . + "\u0000"' "$file" \
              >"$RUNNER_TEMP/run-blocks"
            index=0
            while IFS= read -r -d '' script; do
              script_file="$script_dir/run-${file//\//-}-$index.sh"
              printf '#!/usr/bin/env bash\n%s\n' "${script%$'\n'}" >"$script_file"
              index=$((index + 1))
            done <"$RUNNER_TEMP/run-blocks"
          done
          tools/cooled_prek.sh run shellcheck --files "$script_dir"/*.sh
          tools/cooled_prek.sh run shfmt --files "$script_dir"/*.sh
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            pylock.toml
            pyproject.toml
      - uses: $/install-locked-tools
        with:
          groups: release-news release-shell
          venv: .release-tools
      - name: Run Action tests
        run: uvx --with tox-uv tox run -e test
  type:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            pylock.toml
            pyproject.toml
      - name: Check Python types
        run: uvx --with tox-uv tox run -e type
  hook-cooldown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: $/check-hook-update-cooldown
        with:
          release-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
  gate:
    name: ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Required checks pass (non-PR)' }}
    if: ${{ !cancelled() }}
    needs: [check, shell, test, type, hook-cooldown]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e '
            all(
              to_entries[];
              .value.result == "success" or
              ($ENV.EVENT_NAME != "pull_request" and .value.result == "skipped" and
                .key == "hook-cooldown")
            )
          ' <<<"$NEEDS_JSON"
