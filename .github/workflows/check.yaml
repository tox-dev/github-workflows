name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked tools
        run: |
          uv venv --python 3.15 .venv
          uv pip sync --preview-features pylock --python .venv/bin/python pylock.toml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check Python tests
        run: |
          ruff format --check .
          ruff check . --output-format=concise
          ty check tests
      - name: Exercise release actions
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov
          KCOV_BIN=kcov KCOV_OUTPUT="$RUNNER_TEMP/shell-coverage" pytest -q
          kcov --merge "$RUNNER_TEMP/shell-coverage-merged" "$RUNNER_TEMP/shell-coverage"/*
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = next(Path(os.environ["RUNNER_TEMP"], "shell-coverage-merged").rglob("codecov.json"))
          coverage = json.loads(report.read_text())["coverage"]
          expected = {
              "prepare-towncrier/prepare.sh",
              "validate-release-patch/validate.sh",
              "commit-and-tag/commit.sh",
          }
          if set(coverage) != expected or any(not lines or not all(lines.values()) for lines in coverage.values()):
              raise SystemExit(f"Shell coverage is below 100%: {coverage}")
          PY
      - name: Check repository formatting
        run: prek run --all-files
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Require release notes
        env:
          SKIP_NEWS: ${{ contains(github.event.pull_request.labels.*.name, 'skip news') }}
          BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- 'changelog.d/*.md' | grep -q .; then
            uv run --no-default-groups --group release towncrier check --compare-with "origin/${GITHUB_BASE_REF}"
          elif [[ "$SKIP_NEWS" != true && "$BOT_AUTHOR" != true ]]; then
            echo '::error::add a changelog fragment or apply the skip news label'
            exit 1
          fi
  release-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 .venv
          uv pip sync --preview-features pylock --python .venv/bin/python pylock.toml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Rehearse a squash merge
        id: fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git checkout -B release-validation "$BASE_SHA"
          git merge --squash "$HEAD_SHA"
          printf 'Validate the release pipeline on this pull request.\n' \
            > "changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git add -A
          git -c user.name=release-validation \
            -c user.email=release-validation@users.noreply.github.com \
            commit -m "Validate release pipeline (#${PR_NUMBER})"
          git init --bare "$RUNNER_TEMP/release-origin.git"
          git remote set-url origin "$RUNNER_TEMP/release-origin.git"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: prepare
        uses: $/prepare-towncrier
        with:
          changelog: CHANGELOG.md
          format: markdown
          patch: ${{ runner.temp }}/release.patch
      - name: Restore the source commit
        run: git reset --hard HEAD
      - uses: $/validate-release-patch
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: CHANGELOG.md
          fragments: changelog.d
          expected-sha: ${{ steps.fixture.outputs.sha }}
      - uses: $/commit-and-tag
        with:
          version: ${{ steps.prepare.outputs.version }}
          token: ${{ github.token }}
          app-slug: github-actions
          message: release ${{ steps.prepare.outputs.version }}
      - name: Render tagged notes
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$(git ls-remote origin "refs/tags/$VERSION")"
          previous=$(git tag --list | release-creator tags "$VERSION" --previous)
          args=()
          if [[ -n "$previous" ]]; then
            args+=(--previous "$previous")
          fi
          release-creator notes --changelog CHANGELOG.md --tag "$VERSION" \
            --repository "$GITHUB_REPOSITORY" "${args[@]}" \
            > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  gate:
    name: Required checks pass
    if: always()
    needs: [check, changelog, release-dry-run]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(
              to_entries[];
              .value.result == "success" or
              (.key == "changelog" and .value.result == "skipped") or
              (.key == "release-dry-run" and .value.result == "skipped")
            )
          ' <<< "$NEEDS_JSON"
