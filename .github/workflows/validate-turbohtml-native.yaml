name: Validate turbohtml native release
on:
  workflow_call:
    inputs:
      head-sha:
        description: Exact turbohtml pull request head SHA
        required: true
        type: string
      pull-request:
        description: Turbohtml pull request number
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tox-dev/turbohtml
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Verify the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(gh api "repos/tox-dev/turbohtml/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked source checks
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
      - name: Check tagged source
        run: '"$RUNNER_TEMP/release-tools/bin/prek" run --all-files'
      - name: Check source remains clean
        run: test -z "$(git status --porcelain)"
      - name: Derive locked build constraints
        run: python tools/build_constraints.py pylock.toml build-constraints.txt
      - name: Build native source distribution
        run: uv build --sdist --build-constraint build-constraints.txt --out-dir dist
      - name: Build native Linux wheel
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: cp315-manylinux_x86_64
          CIBW_ENVIRONMENT: UV_BUILD_CONSTRAINT="$(pwd)/build-constraints.txt"
      - name: Collect native wheel
        run: cp wheelhouse/*.whl dist/
      - name: Check source version was detected
        run: test -z "$(find dist -name 'turbohtml-0.0.0-*' -print -quit)"
      - name: Install locked artifact checks
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/package-checks"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/package-checks/bin/python" --group pkg-meta pylock.toml
          echo "$RUNNER_TEMP/package-checks/bin" >>"$GITHUB_PATH"
      - name: Check native distribution metadata
        run: twine check dist/*
      - name: Check native wheel contents
        run: check-wheel-contents --no-config dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbohtml-native-distributions
          path: dist/*
          if-no-files-found: error
