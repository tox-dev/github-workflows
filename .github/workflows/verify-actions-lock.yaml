name: Verify actions lockfile
on:
  workflow_call:
permissions: {}
jobs:
  verify:
    name: 🔒 Verify actions lockfile
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🔒 Verify every action is locked to a commit its ref reaches
        env:
          GH_TOKEN: ${{ github.token }}
          # Dependabot does not update gh extensions, so this pin moves by hand.
          ACTIONS_LOCK_VERSION: v0.4.1
        run: |
          gh extension install github/gh-actions-lock --pin "$ACTIONS_LOCK_VERSION"
          gh actions-lock --verify
