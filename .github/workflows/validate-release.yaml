name: Validate release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 .venv
          uv pip sync --preview-features pylock --python .venv/bin/python --group release --group test pylock.toml
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - if: github.event_name == 'pull_request'
        uses: $/validate-bot-credits
      - name: Squash the target pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout -B release-validation "$BASE_SHA"
          git merge --squash "$HEAD_SHA"
      - name: Commit a validation fragment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf 'Validate the release pipeline on this pull request.\n' \
            >"changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git add -A
          git -c user.name=release-validation \
            -c user.email=release-validation@users.noreply.github.com \
            commit -m "Validate release pipeline (#${PR_NUMBER})"
      - name: Create the local release remote
        if: github.event_name == 'pull_request'
        id: fixture
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/release-origin.git"
          git remote set-url origin "$RUNNER_TEMP/release-origin.git"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Introduce an unsupported fragment name
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git mv "changelog.d/+validation-${PR_NUMBER}.bugfix.md" \
            "changelog.d/validation-${PR_NUMBER}.bugfix.md"
          git -c user.name=release-validation \
            -c user.email=release-validation@users.noreply.github.com \
            commit -m "Validate fragment rejection"
          git push origin HEAD:main
      - id: invalid_fragment
        if: github.event_name == 'pull_request'
        name: Reject an unsupported fragment name
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          changelog: CHANGELOG.md
          format: markdown
          patch: ${{ runner.temp }}/release.patch
      - name: Check fragment rejection and restore the source
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.invalid_fragment.outcome }}
          SOURCE_SHA: ${{ steps.fixture.outputs.sha }}
        run: |
          test "$OUTCOME" = failure
          if error=$(git tag --list | release-creator tags --next auto 2>&1); then
            exit 1
          fi
          [[ "$error" == *'unsupported changelog fragment name'* ]]
          git reset --hard "$SOURCE_SHA"
          git push --force origin HEAD:main
      - name: Dirty the release checkout
        if: github.event_name == 'pull_request'
        run: touch untracked-release-file
      - id: dirty_prepare
        if: github.event_name == 'pull_request'
        name: Reject a dirty release checkout
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          changelog: CHANGELOG.md
          format: markdown
          patch: ${{ runner.temp }}/release.patch
      - name: Check dirty checkout rejection
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.dirty_prepare.outcome }}
        run: |
          test "$OUTCOME" = failure
          rm untracked-release-file
      - id: prefixed_prepare
        if: github.event_name == 'pull_request'
        uses: $/prepare-towncrier
        with:
          tag-prefix: v
          changelog: CHANGELOG.md
          format: markdown
          patch: ${{ runner.temp }}/prefixed-release.patch
      - name: Check prefixed release candidate
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.prefixed_prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" == v* ]]
          git tag --list | release-creator tags "$VERSION" --require-newer
          test -s "$RUNNER_TEMP/prefixed-release.patch"
          git reset --hard HEAD
      - id: prepare
        if: github.event_name == 'pull_request'
        uses: $/prepare-towncrier
        with:
          changelog: CHANGELOG.md
          format: markdown
          patch: ${{ runner.temp }}/release.patch
      - name: Restore the source commit
        if: github.event_name == 'pull_request'
        run: git reset --hard HEAD
      - id: stale_validate
        if: github.event_name == 'pull_request'
        name: Reject a stale release branch
        uses: $/validate-release-patch
        continue-on-error: true
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: CHANGELOG.md
          fragments: changelog.d
          expected-sha: "0000000000000000000000000000000000000000"
      - name: Check stale branch rejection
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.stale_validate.outcome }}
        run: test "$OUTCOME" = failure
      - uses: $/validate-release-patch
        if: github.event_name == 'pull_request'
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: CHANGELOG.md
          fragments: changelog.d
          expected-sha: ${{ steps.fixture.outputs.sha }}
      - id: missing_token
        if: github.event_name == 'pull_request'
        name: Reject a missing App token
        uses: $/commit-and-tag
        continue-on-error: true
        with:
          version: ${{ steps.prepare.outputs.version }}
          token: ""
          app-slug: github-actions
          message: release ${{ steps.prepare.outputs.version }}
      - name: Check missing token left the remote unchanged
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.missing_token.outcome }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_SHA: ${{ steps.fixture.outputs.sha }}
        run: |
          test "$OUTCOME" = failure
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f 1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote origin "refs/tags/$VERSION")"
      - id: missing_key
        if: github.event_name == 'pull_request'
        name: Reject a missing App private key
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        continue-on-error: true
        with:
          app-id: "1"
          private-key: ""
          owner: tox-dev
          repositories: github-workflows
          permission-contents: read
      - name: Check missing key left the remote unchanged
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.missing_key.outcome }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_SHA: ${{ steps.fixture.outputs.sha }}
        run: |
          test "$OUTCOME" = failure
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f 1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote origin "refs/tags/$VERSION")"
      - id: invalid_tag
        if: github.event_name == 'pull_request'
        name: Reject an invalid release tag
        uses: $/commit-and-tag
        continue-on-error: true
        with:
          version: bad tag
          token: ${{ github.token }}
          app-slug: github-actions
          message: invalid release
      - name: Check invalid tag rejection
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.invalid_tag.outcome }}
        run: test "$OUTCOME" = failure
      - uses: $/commit-and-tag
        if: github.event_name == 'pull_request'
        with:
          version: ${{ steps.prepare.outputs.version }}
          token: ${{ github.token }}
          app-slug: github-actions
          message: release ${{ steps.prepare.outputs.version }}
      - name: Check tagged source
        env:
          TAG: ${{ steps.prepare.outputs.version || github.ref_name }}
        run: |
          git tag --list | release-creator tags "$TAG"
          prek run --all-files
      - name: Prepare generated notes fixture
        if: github.event_name == 'pull_request'
        id: metadata
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          test -n "$(git ls-remote origin "refs/tags/$VERSION")"
          printf '* Validate release pipeline by @%s in https://github.com/%s/pull/%s\n' \
            "$PR_AUTHOR" "$GITHUB_REPOSITORY" "$PR_NUMBER" >"$RUNNER_TEMP/generated-notes.md"
          echo "path=$RUNNER_TEMP/generated-notes.md" >>"$GITHUB_OUTPUT"
      - uses: $/render-release-notes
        with:
          tag: ${{ steps.prepare.outputs.version || github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          generated-notes: ${{ steps.metadata.outputs.path }}
          output: ${{ runner.temp }}/release-notes.md
      - name: Inspect tagged notes
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/release-notes.md"
          grep -Fq "[#${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})" \
            "$RUNNER_TEMP/release-notes.md"
          if [[ "$PR_AUTHOR_TYPE" == Bot ]]; then
            if grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"; then
              exit 1
            fi
          else
            grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/bot-notes.md
          if-no-files-found: error
