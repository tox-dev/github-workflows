name: Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  changelog:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: pyproject.toml
      - name: 📦 Install release tools
        env:
          EXCLUDE_NEWER: 7 days
          # Temporary: release-creator 4.3.2 is younger than seven days. Delete after 2026-11-06.
          EXCLUDE_NEWER_PACKAGE: release-creator=2026-10-30T15:13:19Z
        run: |
          tools/install_live_tools.sh "$RUNNER_TEMP/release-tools" 'release-creator>=4.1' 'towncrier>=26.9'
          uv run --no-project --python "$RUNNER_TEMP/release-tools" python tools/expose_locked_commands.py "$RUNNER_TEMP/release-tools"
      - name: 🔍 Validate news fragments
        uses: $/validate-news
        with:
          # Temporary: release-creator 4.3.2 is younger than seven days. Delete after 2026-11-06.
          exclude-newer-package: release-creator=2026-10-30T15:13:19Z
