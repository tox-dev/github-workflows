name: Prepare Towncrier release
on:
  workflow_call:
    inputs:
      bump:
        description: Version selection mode
        type: string
        default: auto
      tag-prefix:
        description: Optional v prefix for the tag
        type: string
        default: ""
      changelog:
        description: Tracked changelog path
        required: true
        type: string
      fragments:
        description: Towncrier fragment directory
        required: true
        type: string
      format:
        description: Changelog format for the repository's prek hook
        type: string
        default: markdown
      lock:
        description: Full project pylock path
        type: string
        default: pylock.toml
      python-version:
        description: Python version for the locked release tools
        type: string
        default: "3.15"
      link-fragments:
        description: Link merged fragments to their pull requests
        type: boolean
        default: true
      numbered-prs:
        description: Treat numeric fragment names as original pull request numbers
        type: boolean
        default: false
      annotated:
        description: Create an annotated tag
        type: boolean
        default: false
      dry-run:
        description: Validate a pull request head without pushing a commit or tag
        type: boolean
        default: false
      release-auth-deployment:
        description: Create a GitHub Deployment for the App-key job
        type: boolean
        default: true
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Key held by the caller's release-auth environment
        required: false
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/main' || inputs.dry-run
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - name: Install locked release tools
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          LOCK: ${{ inputs.lock }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip sync --preview-features pylock --python .venv/bin/python --group release "$LOCK"
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - id: prepare
        uses: $/prepare-towncrier
        with:
          bump: ${{ inputs.bump }}
          tag-prefix: ${{ inputs.tag-prefix }}
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          format: ${{ inputs.format }}
          link-fragments: ${{ inputs.link-fragments }}
          numbered-prs: ${{ inputs.numbered-prs }}
          patch: ${{ runner.temp }}/release.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  validate:
    needs: assemble
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      patch-sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - name: Install locked release tools
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          LOCK: ${{ inputs.lock }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip sync --preview-features pylock --python .venv/bin/python --group release "$LOCK"
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - uses: $/validate-release-patch
        with:
          version: ${{ needs.assemble.outputs.version }}
          patch: ${{ runner.temp }}/release-patch/release.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          branch: ${{ inputs.dry-run && github.head_ref || 'main' }}
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record validated patch digest
        id: digest
        run: |
          read -r patch_sha _ < <(sha256sum "$RUNNER_TEMP/release-patch/release.patch")
          echo "sha=$patch_sha" >>"$GITHUB_OUTPUT"
  push:
    if: ${{ !inputs.dry-run }}
    needs: [assemble, validate]
    runs-on: ubuntu-26.04
    environment:
      name: release-auth
      deployment: ${{ inputs.release-auth-deployment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: $/validate-release-patch
        with:
          version: ${{ needs.assemble.outputs.version }}
          patch: ${{ runner.temp }}/release-patch/release.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          expected-sha: ${{ github.sha }}
          expected-patch-sha: ${{ needs.validate.outputs.patch-sha }}
          checks: "false"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: $/commit-and-tag
        with:
          version: ${{ needs.assemble.outputs.version }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: release ${{ needs.assemble.outputs.version }}
          annotated: ${{ inputs.annotated }}
