name: Prepare Towncrier release
on:
  workflow_call:
    inputs:
      bump:
        description: Version selection mode
        type: string
        default: auto
      tag-prefix:
        description: Optional v prefix for the tag
        type: string
        default: ""
      changelog-prefix:
        description: Optional v prefix for the Towncrier changelog heading
        type: string
        default: ""
      local-tool-source:
        description: Install release-creator from the tagged checkout for its own release
        type: boolean
        default: false
      annotated:
        description: Create an annotated tag
        type: boolean
        default: false
      release-auth-deployment:
        description: Create a GitHub Deployment for the App-key job
        type: boolean
        default: true
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Key held by the caller's release-auth environment
        required: true
permissions: {}
concurrency:
  group: prepare-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      artifact-id: ${{ steps.patch.outputs.artifact-id }}
      patch-sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: $/install-locked-tools
        with:
          groups: release-prepare${{ inputs.local-tool-source && ' project-runtime' || '' }}
          venv: .venv
          local-tool-source: ${{ inputs.local-tool-source }}
      - name: Add locked tools to PATH
        run: echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - name: Install prek hooks
        id: hooks
        run: prek install-hooks
        background: true
      - name: Create a fresh validation worktree
        run: git worktree add --detach "$RUNNER_TEMP/release-validation" "$GITHUB_SHA"
      - name: Export local build constraints
        if: inputs.local-tool-source
        id: constraints
        uses: $/export-build-constraints
      - name: Build local release tool wheel
        if: inputs.local-tool-source
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
        run: |
          uv build --wheel --build-constraints "$BUILD_CONSTRAINTS" \
            --require-build-hashes --out-dir "$RUNNER_TEMP/local-tool-dist" .
      - name: Install local release tool wheel
        if: inputs.local-tool-source
        run: uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP/local-tool-dist/"*.whl
      - id: prepare
        name: Build changelog
        uses: $/prepare-towncrier
        with:
          bump: ${{ inputs.bump }}
          tag-prefix: ${{ inputs.tag-prefix }}
          changelog-prefix: ${{ inputs.changelog-prefix }}
          phase: build
      - wait: hooks
      - name: Finalize release patch
        uses: $/prepare-towncrier
        with:
          version: ${{ steps.prepare.outputs.version }}
          phase: finalize
      - uses: $/validate-release-patch
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          working-directory: ${{ runner.temp }}/release-validation
      - name: Record validated patch digest
        id: digest
        run: |
          patch_sha=$(sha256sum "$RUNNER_TEMP/release.patch")
          printf 'sha=%s\n' "${patch_sha%% *}" >>"$GITHUB_OUTPUT"
      - id: patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    needs: assemble
    runs-on: ubuntu-26.04
    environment:
      name: release-auth
      deployment: ${{ inputs.release-auth-deployment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-patch
      - uses: $/validate-release-patch
        with:
          version: ${{ needs.assemble.outputs.version }}
          patch: ${{ runner.temp }}/release-patch/release.patch
          expected-patch-sha: ${{ needs.assemble.outputs.patch-sha }}
          checks: "false"
      - name: Require release App key
        env:
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo '::error::RELEASE_APP_PRIVATE_KEY is missing from release-auth' >&2
            exit 1
          fi
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: $/commit-and-tag
        with:
          version: ${{ needs.assemble.outputs.version }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: release ${{ needs.assemble.outputs.version }}
          annotated: ${{ inputs.annotated }}
