name: Prepare Towncrier release
on:
  workflow_call:
    inputs:
      bump:
        description: Version selection mode
        type: string
        default: auto
      tag-prefix:
        description: Optional v prefix for the tag
        type: string
        default: ""
      changelog-prefix:
        description: Optional v prefix for the Towncrier changelog heading
        type: string
        default: ""
      changelog:
        description: Tracked changelog path
        required: true
        type: string
      fragments:
        description: Towncrier fragment directory
        required: true
        type: string
      artifact-prefix:
        description: Prefix for the release patch artifact when preparing multiple packages
        type: string
        default: ""
      format:
        description: Changelog format for the repository's prek hook
        type: string
        default: none
      lock:
        description: Full project pylock path
        type: string
        default: pylock.toml
      python-version:
        description: Python version for the locked release tools
        type: string
        default: "3.15"
      local-tool-source:
        description: Install release-creator from the tagged checkout for its own release
        type: boolean
        default: false
      link-fragments:
        description: Link merged fragments to their pull requests
        type: boolean
        default: true
      numbered-prs:
        description: Treat numeric fragment names as original pull request numbers
        type: boolean
        default: false
      annotated:
        description: Create an annotated tag
        type: boolean
        default: false
      release-auth-deployment:
        description: Create a GitHub Deployment for the App-key job
        type: boolean
        default: true
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Key held by the caller's release-auth environment
        required: true
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - uses: $/install-locked-tools
        with:
          lock: ${{ inputs.lock }}
          groups: ${{ inputs.local-tool-source && 'release fix build project-runtime' || 'release' }}
          python-version: ${{ inputs.python-version }}
          venv: .venv
      - name: Add locked tools to PATH
        run: echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - name: Install the tagged release tool
        if: inputs.local-tool-source
        run: uv pip install --python .venv/bin/python --no-deps --no-build-isolation .
      - id: prepare
        uses: $/prepare-towncrier
        with:
          bump: ${{ inputs.bump }}
          tag-prefix: ${{ inputs.tag-prefix }}
          changelog-prefix: ${{ inputs.changelog-prefix }}
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          format: ${{ inputs.format }}
          link-fragments: ${{ inputs.link-fragments }}
          numbered-prs: ${{ inputs.numbered-prs }}
          patch: ${{ runner.temp }}/release.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  validate:
    needs: assemble
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      patch-sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - uses: $/install-locked-tools
        with:
          lock: ${{ inputs.lock }}
          groups: ${{ inputs.local-tool-source && 'release fix build project-runtime' || 'release' }}
          python-version: ${{ inputs.python-version }}
          venv: .venv
      - name: Add locked tools to PATH
        run: echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - name: Install the tagged release tool
        if: inputs.local-tool-source
        run: uv pip install --python .venv/bin/python --no-deps --no-build-isolation .
      - uses: $/validate-release-patch
        with:
          version: ${{ needs.assemble.outputs.version }}
          patch: ${{ runner.temp }}/release-patch/release.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          branch: main
          expected-sha: ${{ github.sha }}
      - name: Record validated patch digest
        id: digest
        run: |
          read -r patch_sha _ < <(sha256sum "$RUNNER_TEMP/release-patch/release.patch")
          echo "sha=$patch_sha" >>"$GITHUB_OUTPUT"
  push:
    needs: [assemble, validate]
    runs-on: ubuntu-26.04
    environment:
      name: release-auth
      deployment: ${{ inputs.release-auth-deployment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: $/validate-release-patch
        with:
          version: ${{ needs.assemble.outputs.version }}
          patch: ${{ runner.temp }}/release-patch/release.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          expected-sha: ${{ github.sha }}
          expected-patch-sha: ${{ needs.validate.outputs.patch-sha }}
          checks: "false"
      - name: Require release App key
        env:
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo '::error::RELEASE_APP_PRIVATE_KEY is missing from release-auth' >&2
            exit 1
          fi
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: $/commit-and-tag
        with:
          version: ${{ needs.assemble.outputs.version }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: release ${{ needs.assemble.outputs.version }}
          annotated: ${{ inputs.annotated }}
