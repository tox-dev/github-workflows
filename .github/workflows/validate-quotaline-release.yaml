name: Validate Quotaline release
on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      pull-request:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  rehearse:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Limit rehearsal target
        env:
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
        run: test "$REPOSITORY/$PR_NUMBER" = quotaline/quotaline/12
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull-request }}/head
      - name: Verify exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Add a local release fragment
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          printf 'Verify a user-visible release fix.\n' >"changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git add "changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com \
            commit -m "Validate release pipeline (#${PR_NUMBER})"
      - name: Create local release remote
        id: candidate
        run: |
          git init --bare "$RUNNER_TEMP/rehearsal.git"
          git remote add rehearsal "$RUNNER_TEMP/rehearsal.git"
          git push rehearsal HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Select first release version
        id: version
        run: |
          previous=$(awk '$1 == "##" { print "v" $2; exit }' website/content/changelog/_index.md)
          test -n "$previous"
          version=$(printf '%s\n' "$previous" | release-creator tags --next auto --prefix v)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Match Rust and Xcode source versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["VERSION"].removeprefix("v")
          for manifest in Path.cwd().rglob("Cargo.toml"):
              if "target" in manifest.parts:
                  continue
              actual = tomllib.loads(manifest.read_text()).get("package", {}).get("version")
              if actual is not None and actual != expected:
                  raise SystemExit(f"{manifest} has {actual}; expected {expected}")
          project = Path("macos/App/project.yml").read_text().splitlines()
          for field in ("MARKETING_VERSION", "SOURCE_VERSION"):
              if f'    {field}: "{expected}"' not in project:
                  raise SystemExit(f"macos/App/project.yml needs {field}: {expected}")
          PY
      - id: prepare
        uses: $/prepare-towncrier
        env:
          SKIP: swift-format,swiftlint
        with:
          version: ${{ steps.version.outputs.version }}
          changelog: website/content/changelog/_index.md
          fragments: changelog.d
          format: markdown
          repository: ${{ inputs.repository }}
          numbered-prs: "true"
          patch: ${{ runner.temp }}/release.patch
      - name: Restore candidate source
        run: git reset --hard HEAD
      - uses: $/validate-release-patch
        env:
          SKIP: swift-format,swiftlint
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: website/content/changelog/_index.md
          fragments: changelog.d
          remote: rehearsal
          expected-sha: ${{ steps.candidate.outputs.sha }}
          repository: ${{ inputs.repository }}
      - name: Create local release tag
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com \
            commit -m "Prepare $VERSION"
          git tag "$VERSION"
      - uses: $/render-release-notes
        with:
          tag: ${{ steps.prepare.outputs.version }}
          changelog: website/content/changelog/_index.md
          repository: ${{ inputs.repository }}
          artifact-url: https://github.com/quotaline/quotaline/releases/tag/${{ steps.prepare.outputs.version }}
          artifact-label: Downloads
          output: ${{ runner.temp }}/release-notes.md
      - name: Check release notes
        run: |
          grep -Fq '### Bug fixes' "$RUNNER_TEMP/release-notes.md"
          grep -Fq 'Verify a user-visible release fix.' "$RUNNER_TEMP/release-notes.md"
          ! grep -Fq '<!-- Release notes generated' "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quotaline-release-rehearsal
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  cask:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Limit rehearsal target
        env:
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
        run: test "$REPOSITORY/$PR_NUMBER" = quotaline/quotaline/12
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull-request }}/head
      - name: Verify exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA"
      - name: Create a local Homebrew asset fixture
        run: |
          mkdir -p macos/dist/homebrew
          printf 'cask validation fixture\n' >macos/dist/homebrew/Quotaline-Homebrew.dmg
      - name: Update the cask without publishing
        run: macos/Scripts/update-cask.sh 0.2.0 dist/homebrew/Quotaline-Homebrew.dmg
      - name: Verify the cask transition
        run: |
          set -o pipefail
          expected=$(shasum -a 256 macos/dist/homebrew/Quotaline-Homebrew.dmg | awk '{print $1}')
          grep -Fq '  version "0.2.0"' Casks/quotaline.rb
          grep -Fq "  sha256 \"$expected\"" Casks/quotaline.rb
          grep -Fq 'releases/download/v#{version}/Quotaline-Homebrew.dmg' Casks/quotaline.rb
          git diff --check -- Casks/quotaline.rb
