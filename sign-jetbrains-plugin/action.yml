name: Sign JetBrains plugin
description: Sign one verified plugin ZIP in a job without checkout or Gradle
inputs:
  archive:
    description: Unsigned plugin ZIP from the keyless build
    required: true
  sha256:
    description: SHA256 recorded by the keyless build before artifact upload
    required: true
  certificate-chain:
    description: JetBrains signing certificate chain in PEM or base64 form
    required: true
  private-key:
    description: Signing private key in PEM or base64 form
    required: true
  private-key-password:
    description: Password for an encrypted signing private key
    required: false
outputs:
  archive:
    description: Path to the signed plugin ZIP
    value: ${{ steps.digest.outputs.archive }}
  sha256:
    description: SHA256 of the signed plugin ZIP
    value: ${{ steps.digest.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: Verify unsigned plugin ZIP
      id: unsigned
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        EXPECTED_SHA: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        [[ -f "$ARCHIVE" && ! -L "$ARCHIVE" ]] || exit 1
        case "$ARCHIVE" in *.zip) ;; *) exit 1 ;; esac
        test "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$EXPECTED_SHA"
        unzip -tq "$ARCHIVE" >/dev/null
        test -z "$(zipinfo -1 "$ARCHIVE" | LC_ALL=C sort | uniq -d)"
        echo "archive=${ARCHIVE%.zip}-signed.zip" >>"$GITHUB_OUTPUT"
    - name: Download pinned Marketplace signer
      shell: bash
      env:
        SIGNER_BASE_URL: https://repo.maven.apache.org/maven2/org/jetbrains/marketplace-zip-signer/0.1.43
      run: |
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          --output "$RUNNER_TEMP/marketplace-signer-cli.jar" \
          "$SIGNER_BASE_URL/marketplace-zip-signer-0.1.43-cli.jar"
    - name: Verify Marketplace signer digest
      shell: bash
      env:
        SIGNER_SHA256: 2958a0f42221d6062b50f22754e413ae5cc42f60c441467202c6700df2e22f44
      run: echo "$SIGNER_SHA256  $RUNNER_TEMP/marketplace-signer-cli.jar" | sha256sum --check
    - name: Check Java 17
      shell: bash
      run: test -x "$JAVA_HOME_17_X64/bin/java"
    - name: Sign and verify plugin ZIP
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        SIGNED: ${{ steps.unsigned.outputs.archive }}
        CERTIFICATE_CHAIN: ${{ inputs.certificate-chain }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        PRIVATE_KEY_PASSWORD: ${{ inputs.private-key-password }}
      run: |
        set -euo pipefail
        umask 077
        if [[ -e "$SIGNED" || -L "$SIGNED" ]]; then
          echo '::error::signed archive already exists' >&2
          exit 1
        fi
        trap 'rm -f "$RUNNER_TEMP"/signing-{key,key-decrypted,chain}.pem' EXIT
        if [[ "$CERTIFICATE_CHAIN" == *'-----BEGIN CERTIFICATE-----'* ]]; then
          printf '%s' "$CERTIFICATE_CHAIN" >"$RUNNER_TEMP/signing-chain.pem"
        else
          printf '%s' "$CERTIFICATE_CHAIN" | base64 --decode >"$RUNNER_TEMP/signing-chain.pem"
        fi
        if [[ "$PRIVATE_KEY" == *'-----BEGIN '* ]]; then
          printf '%s' "$PRIVATE_KEY" >"$RUNNER_TEMP/signing-key.pem"
        else
          printf '%s' "$PRIVATE_KEY" | base64 --decode >"$RUNNER_TEMP/signing-key.pem"
        fi
        while IFS= read -r line; do
          [[ -z "$line" ]] || echo "::add-mask::$line"
        done <"$RUNNER_TEMP/signing-key.pem"
        signing_key="$RUNNER_TEMP/signing-key.pem"
        if [[ -n "$PRIVATE_KEY_PASSWORD" ]]; then
          openssl pkey -in "$signing_key" -out "$RUNNER_TEMP/signing-key-decrypted.pem" \
            -passin env:PRIVATE_KEY_PASSWORD
          while IFS= read -r line; do
            [[ -z "$line" ]] || echo "::add-mask::$line"
          done <"$RUNNER_TEMP/signing-key-decrypted.pem"
          signing_key="$RUNNER_TEMP/signing-key-decrypted.pem"
        fi
        "$JAVA_HOME_17_X64/bin/java" -jar "$RUNNER_TEMP/marketplace-signer-cli.jar" sign \
          -in "$ARCHIVE" -out "$SIGNED" -cert-file "$RUNNER_TEMP/signing-chain.pem" \
          -key-file "$signing_key"
        "$JAVA_HOME_17_X64/bin/java" -jar "$RUNNER_TEMP/marketplace-signer-cli.jar" verify \
          -in "$SIGNED" -cert "$RUNNER_TEMP/signing-chain.pem"
    - name: Record signed plugin ZIP
      id: digest
      shell: bash
      env:
        SIGNED: ${{ steps.unsigned.outputs.archive }}
      run: |
        set -euo pipefail
        [[ -f "$SIGNED" && ! -L "$SIGNED" ]] || exit 1
        unzip -tq "$SIGNED" >/dev/null
        test -z "$(zipinfo -1 "$SIGNED" | LC_ALL=C sort | uniq -d)"
        read -r digest _ < <(sha256sum "$SIGNED")
        echo "archive=$SIGNED" >>"$GITHUB_OUTPUT"
        echo "sha256=$digest" >>"$GITHUB_OUTPUT"
