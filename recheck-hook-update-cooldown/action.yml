name: Recheck cooled hook updates
description: Recheck failed hook-update cooldown jobs each day
inputs:
  workflow:
    description: Workflow file containing the hook cooldown job
    default: check.yaml
  job-name:
    description: Name of the hook cooldown job
    default: hook-cooldown
runs:
  using: composite
  steps:
    - name: Find hook update pull requests
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
          jq -c --arg repository "$GITHUB_REPOSITORY" '
            .[] | select(.head.repo.full_name != null and .base.repo.full_name == $repository) |
            {number, head: .head.sha, branch: .head.ref, headRepository: .head.repo.full_name, opened: .created_at}
          ' >"$RUNNER_TEMP/hook-pulls.jsonl"
    - name: Rerun the failed hook checks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        JOB_NAME: ${{ inputs.job-name }}
      run: |
        set -euo pipefail
        [[ -n "$WORKFLOW" && -n "$JOB_NAME" ]] || exit 1
        while IFS= read -r pull; do
          number=$(jq -r .number <<<"$pull")
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files" --jq '.[].filename' \
            >"$RUNNER_TEMP/hook-files"
          if ! grep -Fxq .pre-commit-config.yaml "$RUNNER_TEMP/hook-files"; then
            continue
          fi
          head=$(jq -r .head <<<"$pull")
          branch=$(jq -r .branch <<<"$pull")
          head_repository=$(jq -r .headRepository <<<"$pull")
          opened=$(jq -r '.opened | fromdateiso8601' <<<"$pull")
          # The check also accepts revisions observed on earlier heads, so maturity counts every head of the branch.
          runs=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs" \
            -f event=pull_request -f branch="$branch" -f per_page=100 |
            jq -sc --arg repository "$head_repository" --arg branch "$branch" \
              --argjson number "$number" --argjson opened "$opened" '
              [.[].workflow_runs[] | select(
                .event == "pull_request" and .head_repository.full_name == $repository and
                .head_branch == $branch and
                (any(.pull_requests[]; .number == $number) or
                  (.pull_requests == [] and (.created_at | fromdateiso8601) >= $opened))
              )]')
          if ! jq -e \
            '[.[].created_at | fromdateiso8601] | min <= now - 7 * 86400' \
            <<<"$runs" >/dev/null; then
            continue
          fi
          run=$(jq -c --arg head "$head" '
            [.[] | select(.head_sha == $head and .status == "completed")] | sort_by(.created_at) | last // empty
          ' <<<"$runs")
          if [[ -z "$run" ]]; then
            continue
          fi
          if ! jq -e '(.created_at | fromdateiso8601) >= now - 30 * 86400' <<<"$run" >/dev/null; then
            continue
          fi
          job=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .id <<<"$run")/jobs" \
            -f filter=latest -f per_page=100 |
            jq -sc --arg job_name "$JOB_NAME" \
              '[.[].jobs[] | select(.name == $job_name and .conclusion == "failure")] | first // empty')
          if [[ -n "$job" ]]; then
            if ! gh run rerun "$(jq -r .id <<<"$run")" --job "$(jq -r .id <<<"$job")" \
              --repo "$GITHUB_REPOSITORY"; then
              echo "::warning::could not rerun hook cooldown for pull request #$number" >&2
            fi
          fi
        done <"$RUNNER_TEMP/hook-pulls.jsonl"
