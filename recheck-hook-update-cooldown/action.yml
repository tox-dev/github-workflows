name: Recheck cooled hook updates
description: Rerun a failed hook cooldown job seven days after GitHub first ran its exact PR head
inputs:
  workflow:
    description: Workflow file containing the required hook-cooldown job
    default: check.yaml
  minimum-days:
    description: Minimum age of the first PR workflow run for the current head
    default: "7"
  job-name:
    description: Name of the required cooldown job to rerun
    default: hook-cooldown
runs:
  using: composite
  steps:
    - name: Find cooled hook pull requests
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
          jq -c --arg repository "$GITHUB_REPOSITORY" '
            .[] | select(.user.login == "pre-commit-ci[bot]" and
              .head.repo.full_name == $repository and .base.repo.full_name == $repository) |
            {number, head: .head.sha, branch: .head.ref}
          ' >"$RUNNER_TEMP/cooled-hook-pulls.jsonl"
    - name: Rerun the failed hook checks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
        JOB_NAME: ${{ inputs.job-name }}
      run: |
        set -euo pipefail
        while IFS= read -r pull; do
          head=$(jq -r .head <<<"$pull")
          branch=$(jq -r .branch <<<"$pull")
          runs=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs" \
            -f event=pull_request -f head_sha="$head" -f per_page=100 |
            jq -sc --arg repository "$GITHUB_REPOSITORY" --arg branch "$branch" --arg head "$head" \
              --argjson number "$(jq -r .number <<<"$pull")" '
              [.[].workflow_runs[] | select(
                .event == "pull_request" and .head_repository.full_name == $repository and
                .head_branch == $branch and .head_sha == $head and
                any(.pull_requests[]; .number == $number)
              )]')
          observed=$(jq -r '[.[].created_at] | min // empty' <<<"$runs")
          if [[ -z "$observed" ]] || ! jq -n -e --arg date "$observed" --argjson days "$MINIMUM_DAYS" '
            ($date | fromdateiso8601) <= now - ($days * 86400)
          ' >/dev/null; then
            continue
          fi
          run=$(jq -c '[.[] | select(.status == "completed")] | sort_by(.created_at) | last // empty' <<<"$runs")
          if [[ -z "$run" ]]; then
            continue
          fi
          job=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .id <<<"$run")/jobs" \
            -f filter=latest -f per_page=100 |
            jq -sc --arg name "$JOB_NAME" \
              '[.[].jobs[] | select(.name == $name and .conclusion == "failure")] | first // empty')
          if [[ -n "$job" ]] && jq -e --argjson days "$MINIMUM_DAYS" --arg date "$observed" '
            (.completed_at | fromdateiso8601) <
              (($date | fromdateiso8601) + ($days * 86400))
          ' <<<"$job" >/dev/null; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$(jq -r .id <<<"$job")/rerun" >/dev/null
          fi
        done <"$RUNNER_TEMP/cooled-hook-pulls.jsonl"
