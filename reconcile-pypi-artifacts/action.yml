name: Verify PyPI artifacts
description: Compare every built file with PyPI and verify its trusted-publisher attestation
inputs:
  project:
    description: PyPI project name
    required: true
  version:
    description: PyPI release version
    required: true
  dist:
    description: Directory containing the complete expected distribution set
    required: true
  exclude-newer:
    description: Upload cutoff for the tools this Action installs from PyPI
    default: 7 days
  exclude-newer-package:
    description: Newline-separated name=date cutoffs that override exclude-newer for single packages
    default: ""
runs:
  using: composite
  steps:
    - name: 📦 Install provenance verifier
      shell: bash
      env:
        EXCLUDE_NEWER: ${{ inputs.exclude-newer }}
        EXCLUDE_NEWER_PACKAGE: ${{ inputs.exclude-newer-package }}
      run: >-
        "$GITHUB_ACTION_PATH/../tools/install_live_tools.sh" "$RUNNER_TEMP/pypi-attestations" 'certifi>=2026.7.22' 'pypi-attestations>=0.0.30'
    - name: 🔍 Compare published files
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        VERSION: ${{ inputs.version }}
        DIST: ${{ inputs.dist }}
      run: |
        uv run --no-project --python "$RUNNER_TEMP/pypi-attestations" python \
          "$GITHUB_ACTION_PATH/../tools/verify_pypi_files.py" "$PROJECT" "$VERSION" "$DIST" \
          >"$RUNNER_TEMP/pypi-local-files"
    - name: 🔍 Verify trusted-publisher attestations
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        while IFS= read -r path; do
          uv run --no-project --python "$RUNNER_TEMP/pypi-attestations" pypi-attestations verify pypi \
            --repository "https://github.com/$REPOSITORY" "$path"
          echo "PyPI: ${path##*/} digest matches and is attested by $REPOSITORY"
        done <"$RUNNER_TEMP/pypi-local-files"
