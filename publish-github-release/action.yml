name: Publish GitHub Release
description: Resume a matching draft or verify an already published release
inputs:
  tag:
    description: Existing Git tag for the release
    required: true
  commit:
    description: Commit expected at the tag
    required: true
  title:
    description: Exact GitHub Release title
    required: true
  notes-file:
    description: File containing the exact GitHub Release body
    required: true
  assets-directory:
    description: Directory containing only the intended Release assets
    default: ""
  prerelease:
    description: Whether the release is a prerelease
    default: "false"
  mode:
    description: Stage a draft, publish an existing draft, or complete both phases
    default: complete
runs:
  using: composite
  steps:
    - name: Verify the tagged release request
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        COMMIT: ${{ inputs.commit }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
        PRERELEASE: ${{ inputs.prerelease }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        [[ -n "$GH_REPO" && -n "$TAG" && -n "$TITLE" && -s "$NOTES_FILE" ]] || exit 1
        test "$PRERELEASE" = true || test "$PRERELEASE" = false
        case "$MODE" in
        stage | publish | complete) ;;
        *)
          echo "::error::invalid release mode: $MODE"
          exit 1
          ;;
        esac
        tag_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
        test "$tag_commit" == "$COMMIT"
        printf '[]\n' >"$RUNNER_TEMP/release-assets.json"
        if [[ -n "$ASSETS_DIRECTORY" ]]; then
          shopt -s nullglob dotglob
          test -d "$ASSETS_DIRECTORY"
          test -z "$(find "$ASSETS_DIRECTORY" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          : >"$RUNNER_TEMP/release-assets.tsv"
          for asset in "$ASSETS_DIRECTORY"/*; do
            test -f "$asset"
            name=${asset##*/}
            case "$name" in
            .* | *#* | *[[:cntrl:]]*)
              echo "::error::unsafe release asset name: $name"
              exit 1
              ;;
            esac
            printf '%s\tsha256:%s\n' "$name" "$(sha256sum "$asset" | cut -d' ' -f1)" \
              >>"$RUNNER_TEMP/release-assets.tsv"
          done
          jq -R -s '[split("\n")[] | select(length > 0) | split("\t") | {name: .[0], digest: .[1]}]' \
            "$RUNNER_TEMP/release-assets.tsv" >"$RUNNER_TEMP/release-assets.json"
        fi
    - name: Inspect any existing release
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        PRERELEASE: ${{ inputs.prerelease }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
          jq -s --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' >"$RUNNER_TEMP/release-existing.json"
        if jq -e 'length == 1' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          jq -er '.[0].id' "$RUNNER_TEMP/release-existing.json" >"$RUNNER_TEMP/release-id"
        fi
        jq -e --arg title "$TITLE" --rawfile body "$NOTES_FILE" --argjson prerelease "$PRERELEASE" \
          --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
            length <= 1 and all(.[];
              . as $release |
              .name == $title and .body == $body and .prerelease == $prerelease and
              ((.assets | map(.name) | unique | length) == (.assets | length)) and
              all(.assets[];
                .name as $name | .digest as $digest |
                any($assets[0][]; .name == $name) and
                (.state != "uploaded" and $release.draft or
                  any($assets[0][]; .name == $name and .digest == $digest))) and
              (.draft or (.assets | length) == ($assets[0] | length))
            )
          ' "$RUNNER_TEMP/release-existing.json"
        if [[ "$MODE" == publish ]]; then
          jq -e 'length == 1' "$RUNNER_TEMP/release-existing.json" >/dev/null
        fi
    - name: Create a missing draft
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        COMMIT: ${{ inputs.commit }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        PRERELEASE: ${{ inputs.prerelease }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [[ "$MODE" != publish ]] && jq -e 'length == 0' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          jq -n --arg tag "$TAG" --arg commit "$COMMIT" --arg title "$TITLE" \
            --rawfile body "$NOTES_FILE" --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, target_commitish: $commit, name: $title, body: $body,
              draft: true, prerelease: $prerelease}' >"$RUNNER_TEMP/release-request.json"
          gh api -X POST "repos/$GH_REPO/releases" --input "$RUNNER_TEMP/release-request.json" \
            >"$RUNNER_TEMP/release-created.json"
          jq -er '.id | select(type == "number")' "$RUNNER_TEMP/release-created.json" >"$RUNNER_TEMP/release-id"
        fi
    - name: Upload missing draft assets
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
        PRERELEASE: ${{ inputs.prerelease }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [[ "$MODE" != publish && -n "$ASSETS_DIRECTORY" ]]; then
          shopt -s nullglob
          release_id=$(<"$RUNNER_TEMP/release-id")
          if jq -e 'length == 1 and .[0].draft' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
            while IFS= read -r asset_id; do
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset_id" >/dev/null
            done < <(jq -r '.[0].assets[] | select(.state != "uploaded") | .id' "$RUNNER_TEMP/release-existing.json")
          fi
          for attempt in {1..6}; do
            if ! gh api "repos/$GH_REPO/releases/$release_id" | jq -s . >"$RUNNER_TEMP/release-current.json"; then
              if ((attempt == 6)); then
                echo '::error::draft release could not be read' >&2
                exit 1
              fi
              sleep 2
              continue
            fi
            if jq -e --arg title "$TITLE" --rawfile body "$NOTES_FILE" --argjson prerelease "$PRERELEASE" \
              --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
                length == 1 and .[0].name == $title and .[0].body == $body and
                .[0].prerelease == $prerelease and
                all(.[0].assets[]; .state == "uploaded" and
                  (.name as $name | .digest as $digest |
                    any($assets[0][]; .name == $name and .digest == $digest)))
              ' "$RUNNER_TEMP/release-current.json" >/dev/null; then
              break
            fi
            if ((attempt == 6)); then
              echo '::error::draft release did not become visible' >&2
              exit 1
            fi
            sleep 2
          done
          if jq -e '.[0].draft' "$RUNNER_TEMP/release-current.json" >/dev/null; then
            for asset in "$ASSETS_DIRECTORY"/*; do
              name=${asset##*/}
              if ! jq -e --arg name "$name" --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
                any(.[0].assets[]; .name == $name and .state == "uploaded" and
                  (.digest as $digest | any($assets[0][]; .name == $name and .digest == $digest)))
              ' \
                "$RUNNER_TEMP/release-current.json" >/dev/null; then
                for attempt in {1..6}; do
                  if ((attempt > 1)); then
                    release=$(gh api "repos/$GH_REPO/releases/$release_id")
                    asset_ids=$(jq -r --arg name "$name" \
                      '.assets[] | select(.name == $name and .state != "uploaded") | .id' <<<"$release")
                    while IFS= read -r asset_id; do
                      [[ -n "$asset_id" ]] || continue
                      gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset_id" >/dev/null
                    done <<<"$asset_ids"
                  fi
                  if gh release upload "$TAG" "$asset" --repo "$GH_REPO"; then
                    break
                  fi
                  if gh api "repos/$GH_REPO/releases/$release_id" | jq -e --arg name "$name" \
                    --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
                    any(.assets[]; .name == $name and .state == "uploaded" and
                      (.digest as $digest | any($assets[0][]; .name == $name and .digest == $digest)))
                  ' >/dev/null; then
                    break
                  fi
                  if ((attempt == 6)); then
                    echo "::error::could not upload release asset: $name" >&2
                    exit 1
                  fi
                  sleep 2
                done
              fi
            done
          fi
        fi
    - name: Verify the complete asset set
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        release_id=$(<"$RUNNER_TEMP/release-id")
        for attempt in {1..6}; do
          if ! gh api "repos/$GH_REPO/releases/$release_id" | jq -s . >"$RUNNER_TEMP/release-complete.json"; then
            if ((attempt == 6)); then
              echo '::error::release could not be read after upload' >&2
              exit 1
            fi
            sleep 2
            continue
          fi
          if jq -e --arg title "$TITLE" --rawfile body "$NOTES_FILE" --argjson prerelease "$PRERELEASE" \
            --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
              length == 1 and .[0].name == $title and .[0].body == $body and
              .[0].prerelease == $prerelease and
              ([.[0].assets[] | select(.state == "uploaded") | {name, digest}] | sort_by(.name)) ==
              ($assets[0] | sort_by(.name))
            ' "$RUNNER_TEMP/release-complete.json" >/dev/null; then
            exit 0
          fi
          if ((attempt < 6)); then sleep 2; fi
        done
        echo '::error::release metadata or assets did not match after publication' >&2
        exit 1
    - name: Publish the draft
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [[ "$MODE" != stage ]] && jq -e '.[0].draft' "$RUNNER_TEMP/release-complete.json" >/dev/null; then
          release_id=$(<"$RUNNER_TEMP/release-id")
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false >/dev/null
        fi
    - name: Verify the final release state
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        PRERELEASE: ${{ inputs.prerelease }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        release_id=$(<"$RUNNER_TEMP/release-id")
        for attempt in {1..6}; do
          if ! gh api "repos/$GH_REPO/releases/$release_id" | jq -s . >"$RUNNER_TEMP/release-published.json"; then
            if ((attempt == 6)); then
              echo '::error::published release could not be read' >&2
              exit 1
            fi
            sleep 2
            continue
          fi
          if jq -e --arg title "$TITLE" --rawfile body "$NOTES_FILE" --argjson prerelease "$PRERELEASE" \
            --arg mode "$MODE" \
            --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
              length == 1 and ($mode == "stage" or .[0].draft == false) and .[0].name == $title and
              .[0].body == $body and .[0].prerelease == $prerelease and
              ([.[0].assets[] | select(.state == "uploaded") | {name, digest}] | sort_by(.name)) ==
              ($assets[0] | sort_by(.name))
            ' "$RUNNER_TEMP/release-published.json" >/dev/null; then
            exit 0
          fi
          if ((attempt < 6)); then sleep 2; fi
        done
        echo '::error::final release state did not match after publication' >&2
        exit 1
    - name: Verify published asset attestations
      if: inputs.mode != 'stage' && inputs.assets-directory != ''
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        for asset in "$ASSETS_DIRECTORY"/*; do
          for attempt in {1..6}; do
            if gh release verify-asset "$TAG" "$asset" --repo "$GH_REPO"; then
              break
            fi
            if ((attempt == 6)); then
              echo "::error::release asset attestation could not be verified: ${asset##*/}" >&2
              exit 1
            fi
            sleep 2
          done
        done
