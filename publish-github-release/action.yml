name: Publish GitHub Release
description: Resume a matching draft or verify an already published release
inputs:
  tag:
    description: Existing Git tag for the release
    required: true
  commit:
    description: Commit the release targets
    required: true
  title:
    description: Exact GitHub Release title
    required: true
  notes-file:
    description: File containing the exact GitHub Release body
    required: true
  assets-directory:
    description: Directory containing only the intended Release assets
    default: ""
  prerelease:
    description: Whether the release is a prerelease
    default: "false"
  mode:
    description: Stage a draft, publish an existing draft, or complete both phases
    default: complete
runs:
  using: composite
  steps:
    - name: ⚙️ Record asset digests
      shell: bash
      env:
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
      run: |
        set -euo pipefail
        printf '[]\n' >"$RUNNER_TEMP/release-assets.json"
        if [[ -n "$ASSETS_DIRECTORY" ]]; then
          shopt -s nullglob dotglob
          : >"$RUNNER_TEMP/release-assets.tsv"
          for asset in "$ASSETS_DIRECTORY"/*; do
            # GitHub stores an uploaded asset under its file name with each other character replaced by a period.
            name=${asset##*/}
            name=${name//[^A-Za-z0-9._+-]/.}
            printf '%s\tsha256:%s\n' "$name" "$(sha256sum "$asset" | cut -d' ' -f1)" \
              >>"$RUNNER_TEMP/release-assets.tsv"
          done
          jq -R -s '[split("\n")[] | select(length > 0) | split("\t") | {name: .[0], digest: .[1]}]' \
            "$RUNNER_TEMP/release-assets.tsv" >"$RUNNER_TEMP/release-assets.json"
          jq -r --arg directory "$ASSETS_DIRECTORY" '"Release assets: \(length) file\(if length == 1 then "" else "s" end) from \($directory)\(
            if length > 0 then ": " + ([.[].name] | join(", ")) else "" end)"' "$RUNNER_TEMP/release-assets.json"
        else
          echo 'Release assets: none (assets-directory input is empty)'
        fi
    - name: 🔍 Inspect any existing release
      id: inspect
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
          jq -s --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' >"$RUNNER_TEMP/release-existing.json"
        if jq -e 'length > 0' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          jq -er '.[0].id' "$RUNNER_TEMP/release-existing.json" >"$RUNNER_TEMP/release-id"
        fi
        jq -r --arg tag "$TAG" 'if length == 0 then "Existing GitHub Release \($tag): none"
          else .[0] | "Existing GitHub Release \($tag): \(if .draft then "draft" else "published" end) \(.id)\(
            if .immutable then ", immutable" else "" end)" end' "$RUNNER_TEMP/release-existing.json"
        immutable=$(jq -r '.[0] | .draft == false and .immutable == true' "$RUNNER_TEMP/release-existing.json")
        if [[ "$immutable" == true ]]; then
          if ! jq '[.[0]]' "$RUNNER_TEMP/release-existing.json" | jq -e --arg phase complete \
            --slurpfile assets "$RUNNER_TEMP/release-assets.json" -f "$GITHUB_ACTION_PATH/match.jq" >/dev/null; then
            echo "::error::published immutable release $TAG does not have the expected assets" >&2
            exit 1
          fi
          echo "GitHub Release $TAG is published and immutable with the expected assets; nothing to upload or publish"
        fi
        printf 'immutable=%s\n' "$immutable" >>"$GITHUB_OUTPUT"
    - name: 👋 Credit new contributors
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        COMMIT: ${{ inputs.commit }}
        NOTES_FILE: ${{ inputs.notes-file }}
      run: |
        set -euo pipefail
        if jq -e '.[0].draft == false' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          echo "New Contributors skipped: GitHub Release $TAG is already published"
          cp "$NOTES_FILE" "$RUNNER_TEMP/release-body.md"
          exit 0
        fi
        # The comparison link that release-creator renders names the previous tag GitHub should count from.
        previous=$(grep -oP "/compare/\K[^)]+(?=\.\.\.\Q$TAG\E\))" "$NOTES_FILE" | head -n 1 || true)
        request=(-f "tag_name=$TAG" -f "target_commitish=$COMMIT")
        if [[ -n "$previous" ]]; then
          request+=(-f "previous_tag_name=$previous")
        fi
        echo "Generated notes range: ${previous:-first release}...$TAG"
        gh api -X POST "repos/$GH_REPO/releases/generate-notes" "${request[@]}" --jq .body >"$RUNNER_TEMP/generated-notes.md"
        python3 "$GITHUB_ACTION_PATH/../tools/new_contributors.py" \
          "$NOTES_FILE" "$RUNNER_TEMP/generated-notes.md" "$RUNNER_TEMP/release-body.md"
    - name: 🚀 Create or update the draft
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        COMMIT: ${{ inputs.commit }}
        TITLE: ${{ inputs.title }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        if jq -e 'length == 0' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          jq -n --arg tag "$TAG" --arg commit "$COMMIT" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/release-body.md" --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, target_commitish: $commit, name: $title, body: $body,
              draft: true, prerelease: $prerelease}' >"$RUNNER_TEMP/release-request.json"
          gh api -X POST "repos/$GH_REPO/releases" --input "$RUNNER_TEMP/release-request.json" \
            >"$RUNNER_TEMP/release-created.json"
          jq -er '.id | select(type == "number")' "$RUNNER_TEMP/release-created.json" >"$RUNNER_TEMP/release-id"
          echo "GitHub Release $TAG: created draft $(<"$RUNNER_TEMP/release-id") for $COMMIT (prerelease $PRERELEASE)"
        elif jq -e --arg title "$TITLE" --rawfile body "$RUNNER_TEMP/release-body.md" --argjson prerelease "$PRERELEASE" \
          '.[0].draft and (.[0].name != $title or .[0].body != $body or .[0].prerelease != $prerelease)' \
          "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          jq -n --arg title "$TITLE" --rawfile body "$RUNNER_TEMP/release-body.md" --argjson prerelease "$PRERELEASE" \
            '{name: $title, body: $body, prerelease: $prerelease}' >"$RUNNER_TEMP/release-update.json"
          gh api -X PATCH "repos/$GH_REPO/releases/$(<"$RUNNER_TEMP/release-id")" \
            --input "$RUNNER_TEMP/release-update.json" \
            --jq '"GitHub Release \(.tag_name): updated draft \(.id) to the expected title, notes and prerelease flag"'
        elif jq -e '.[0].draft' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
          echo "GitHub Release $TAG: draft $(<"$RUNNER_TEMP/release-id") already has the expected title, notes and prerelease flag"
        else
          echo "GitHub Release $TAG: already published, leaving its title and notes unchanged"
        fi
    - name: 🚀 Upload missing draft assets
      if: steps.inspect.outputs.immutable != 'true'
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # GitHub supplies this Action path at runtime.
        source "$GITHUB_ACTION_PATH/retry.sh"
        # shellcheck disable=SC1091 # GitHub supplies this Action path at runtime.
        source "$GITHUB_ACTION_PATH/../tools/plural.sh"
        if [[ "$MODE" == publish ]]; then
          echo 'Asset upload skipped: mode publish only publishes the staged draft'
        elif [[ -z "$ASSETS_DIRECTORY" ]]; then
          echo 'Asset upload skipped: assets-directory input is empty'
        else
          shopt -s nullglob
          release_id=$(<"$RUNNER_TEMP/release-id")
          if jq -e '.[0].draft' "$RUNNER_TEMP/release-existing.json" >/dev/null; then
            while IFS= read -r asset_id; do
              echo "Deleting incomplete draft asset $asset_id left by an earlier attempt"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            done < <(jq -r '.[0].assets[] | select(.state != "uploaded") | .id' "$RUNNER_TEMP/release-existing.json")
          fi
          read_draft() {
            gh api "repos/$GH_REPO/releases/$release_id" | jq -s . >"$RUNNER_TEMP/release-current.json" &&
              jq -e --arg phase draft --slurpfile assets "$RUNNER_TEMP/release-assets.json" \
                -f "$GITHUB_ACTION_PATH/match.jq" "$RUNNER_TEMP/release-current.json" >/dev/null
          }
          if ! retry read_draft; then
            echo '::error::draft release did not become visible' >&2
            exit 1
          fi
          if ! jq -e '.[0].draft' "$RUNNER_TEMP/release-current.json" >/dev/null; then
            echo "Asset upload skipped: GitHub Release $TAG is already published"
          else
            uploaded=0
            present=0
            for asset in "$ASSETS_DIRECTORY"/*; do
              name=${asset##*/}
              name=${name//[^A-Za-z0-9._+-]/.}
              if jq -e --arg name "$name" --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
                any(.[0].assets[]; .name == $name and .state == "uploaded" and
                  (.digest as $digest | any($assets[0][]; .name == $name and .digest == $digest)))
              ' \
                "$RUNNER_TEMP/release-current.json" >/dev/null; then
                echo "Asset $name: already uploaded with the expected digest"
                present=$((present + 1))
              else
                for attempt in {1..6}; do
                  if ((attempt > 1)); then
                    release=$(gh api "repos/$GH_REPO/releases/$release_id")
                    asset_ids=$(jq -r --arg name "$name" \
                      '.assets[] | select(.name == $name and .state != "uploaded") | .id' <<<"$release")
                    while IFS= read -r asset_id; do
                      [[ -n "$asset_id" ]] || continue
                      echo "Deleting incomplete upload $asset_id of $name before retrying"
                      gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset_id"
                    done <<<"$asset_ids"
                  fi
                  echo "Asset $name: uploading (attempt $attempt of 6)"
                  if gh release upload "$TAG" "$asset" --repo "$GH_REPO"; then
                    break
                  fi
                  if gh api "repos/$GH_REPO/releases/$release_id" | jq -e --arg name "$name" \
                    --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
                    any(.assets[]; .name == $name and .state == "uploaded" and
                      (.digest as $digest | any($assets[0][]; .name == $name and .digest == $digest)))
                  ' >/dev/null; then
                    echo "Asset $name: upload reported a failure but the asset arrived with the expected digest"
                    break
                  fi
                  if ((attempt == 6)); then
                    echo "::error::could not upload release asset: $name" >&2
                    exit 1
                  fi
                  sleep 2
                done
                uploaded=$((uploaded + 1))
              fi
            done
            echo "GitHub Release $TAG: uploaded $(plural "$uploaded" asset), $present already present"
          fi
        fi
    - name: 🔍 Verify the complete asset set
      if: steps.inspect.outputs.immutable != 'true'
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # GitHub supplies this Action path at runtime.
        source "$GITHUB_ACTION_PATH/retry.sh"
        release_id=$(<"$RUNNER_TEMP/release-id")
        read_complete() {
          gh api "repos/$GH_REPO/releases/$release_id" | jq -s . >"$RUNNER_TEMP/release-complete.json" &&
            jq -e --arg phase complete --slurpfile assets "$RUNNER_TEMP/release-assets.json" \
              -f "$GITHUB_ACTION_PATH/match.jq" "$RUNNER_TEMP/release-complete.json" >/dev/null
        }
        if ! retry read_complete; then
          echo '::error::release assets did not match after publication' >&2
          exit 1
        fi
        jq -r '.[0] | "GitHub Release \(.tag_name): \(.assets | length) uploaded asset\(if (.assets | length) == 1 then "" else "s" end) match the expected set"' \
          "$RUNNER_TEMP/release-complete.json"
    - name: 🚀 Publish the draft
      if: steps.inspect.outputs.immutable != 'true'
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [[ "$MODE" == stage ]]; then
          echo 'Publish skipped: mode stage leaves the release as a draft'
        elif jq -e '.[0].draft' "$RUNNER_TEMP/release-complete.json" >/dev/null; then
          release_id=$(<"$RUNNER_TEMP/release-id")
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false \
            --jq '"GitHub Release \(.tag_name): published \(.html_url)"'
        else
          echo 'Publish skipped: the release is already published'
        fi
    - name: 🔍 Verify published asset attestations
      if: inputs.mode != 'stage' && inputs.assets-directory != ''
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # GitHub supplies this Action path at runtime.
        source "$GITHUB_ACTION_PATH/retry.sh"
        shopt -s nullglob
        for asset in "$ASSETS_DIRECTORY"/*; do
          if ! retry gh release verify-asset "$TAG" "$asset" --repo "$GH_REPO"; then
            echo "::error::release asset attestation could not be verified: ${asset##*/}" >&2
            exit 1
          fi
          echo "Asset ${asset##*/}: attestation verified"
        done
