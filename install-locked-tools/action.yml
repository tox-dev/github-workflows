name: Install locked release tools
description: Install selected pylock groups with hashed build dependencies
inputs:
  groups:
    description: Space-separated dependency groups to install
    default: ""
  venv:
    description: Virtual environment directory
    default: ""
  lock-source:
    description: Install groups from the caller or the shared Action lock
    default: caller
  local-tool-source:
    description: The caller builds release-creator from its own checkout after installing locked third-party tools
    default: "false"
  constraints-lock:
    description: Lock used to export build constraints; defaults to the selected install lock
    default: ""
  target-platform:
    description: Nab platform ID for the exported build constraints
    default: ""
  targets:
    description: Space-separated full-version:implementation pairs for the exported build constraints
    default: ""
outputs:
  build-constraints:
    description: Hashed build requirements selected from the lock
    value: ${{ steps.constraints.outputs.path }}
runs:
  using: composite
  steps:
    - name: Create lock-tool environment
      shell: bash
      run: uv venv --allow-existing --python 3.15 "$RUNNER_TEMP/lock-tools"
    - name: Install lock reader
      shell: bash
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        digest=$(sha256sum "$GITHUB_ACTION_PATH/../pylock.toml")
        if [[ -f "$RUNNER_TEMP/lock-tools/.lock-digest" &&
          $(cat "$RUNNER_TEMP/lock-tools/.lock-digest") == "${digest%% *}" ]]; then
          exit 0
        fi
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/lock-tools" --group lock-tools \
          --only-binary :all: --require-hashes "$GITHUB_ACTION_PATH/../pylock.toml"
        printf '%s\n' "${digest%% *}" >"$RUNNER_TEMP/lock-tools/.lock-digest"
    - id: selection
      name: Select locked groups and build constraints
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        VENV: ${{ inputs.venv }}
        LOCK_SOURCE: ${{ inputs.lock-source }}
        LOCAL_TOOL_SOURCE: ${{ inputs.local-tool-source }}
      run: |
        set -euo pipefail
        case "$LOCK_SOURCE" in
        caller)
          lock=pylock.toml
          lock_check=(--shared-lock "$GITHUB_ACTION_PATH/../pylock.toml" --verify-pypi --project pyproject.toml)
          ;;
        shared)
          lock="$GITHUB_ACTION_PATH/../pylock.toml"
          lock_check=()
          ;;
        *)
          echo "::error::unknown lock source: $LOCK_SOURCE" >&2
          exit 1
          ;;
        esac
        groups=()
        while IFS= read -r line; do
          read -ra selected <<<"$line"
          groups+=("${selected[@]}")
        done <<<"$DEPENDENCY_GROUPS"
        if ((${#groups[@]})); then
          [[ -n "$VENV" ]] || {
            echo '::error::venv is required when installing groups' >&2
            exit 1
          }
          uv venv --allow-existing --python 3.15 "$VENV"
          source_check=()
          if [[ "$LOCAL_TOOL_SOURCE" == true ]]; then source_check=(--local-tool-source); fi
          uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
            "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" "$lock" "${groups[@]}" \
            "${lock_check[@]}" "${source_check[@]}"
          printf '%s\n' "${groups[@]}" >"$RUNNER_TEMP/selected-lock-groups"
        else
          uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
            "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" "$lock" --build-constraints \
            "${lock_check[@]}"
        fi
        printf 'lock=%s\n' "$lock" >>"$GITHUB_OUTPUT"
    - id: constraints
      name: Export locked build requirements
      shell: bash
      env:
        BUILD_LOCK: ${{ steps.selection.outputs.lock }}
        CONSTRAINTS_LOCK: ${{ inputs.constraints-lock }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        if [[ -n "$CONSTRAINTS_LOCK" && "$CONSTRAINTS_LOCK" != "$BUILD_LOCK" ]]; then
          lock_check=()
          if [[ "$CONSTRAINTS_LOCK" != "$GITHUB_ACTION_PATH/../pylock.toml" ]]; then
            lock_check=(--verify-pypi --project pyproject.toml)
          fi
          uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
            "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" "$CONSTRAINTS_LOCK" --build-constraints \
            "${lock_check[@]}"
        fi
        if [[ -n "$CONSTRAINTS_LOCK" ]]; then BUILD_LOCK=$CONSTRAINTS_LOCK; fi
        args=()
        if [[ "$BUILD_LOCK" == pylock.toml ]]; then
          args+=(--shared-policy "$GITHUB_ACTION_PATH/../pyproject.toml")
          locks=("$GITHUB_ACTION_PATH/../pylock.toml" pylock.toml)
        else
          locks=("$BUILD_LOCK")
        fi
        if [[ -n "$TARGET_PLATFORM" || -n "$TARGETS" ]]; then
          args+=(--target-platform "$TARGET_PLATFORM" --targets "$TARGETS")
        fi
        digest=$(
          sha256sum "${locks[@]}"
          printf '%s\n' "$TARGET_PLATFORM" "$TARGETS" "${args[@]}"
        )
        digest=$(sha256sum <<<"$digest")
        output="$RUNNER_TEMP/build-constraints-${digest%% *}.txt"
        if [[ ! -f "$output" ]]; then
          uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
            "$GITHUB_ACTION_PATH/../tools/build_constraints.py" "${args[@]}" \
            "$output" "${locks[@]}"
        fi
        echo "path=$output" >>"$GITHUB_OUTPUT"
    - name: Install selected groups
      if: inputs.groups != ''
      shell: bash
      env:
        VENV: ${{ inputs.venv }}
        LOCK: ${{ steps.selection.outputs.lock }}
        BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        groups=()
        while IFS= read -r group; do
          groups+=(--group "$group")
        done <"$RUNNER_TEMP/selected-lock-groups"
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes --python "$VENV" \
          "${groups[@]}" --build-constraints "$BUILD_CONSTRAINTS" \
          --require-build-hashes --require-hashes "$LOCK"
    - name: Expose installed commands
      if: inputs.groups != ''
      shell: bash
      env:
        VENV: ${{ inputs.venv }}
      run: |
        uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
          "$GITHUB_ACTION_PATH/../tools/expose_locked_commands.py" "$VENV"
