name: Install locked release tools
description: Install selected pylock groups with hashed build dependencies
inputs:
  groups:
    description: Space-separated dependency groups to install
    default: ""
  venv:
    description: Virtual environment directory
    default: ""
  constraints-lock:
    description: Lock used to export build constraints; defaults to the selected install lock
    default: ""
  verify-lock:
    description: Another lock whose selected packages will be included in a release artifact
    default: ""
  verify-groups:
    description: Whitespace-separated groups to verify in verify-lock
    default: ""
  target-platform:
    description: Nab platform ID for the exported build constraints
    default: ""
  targets:
    description: Space-separated full-version:implementation pairs for the exported build constraints
    default: ""
  exclude-newer:
    description: Upload cutoff for the lock reader this Action installs from PyPI
    default: 7 days
  exclude-newer-package:
    description: Newline-separated name=date cutoffs that override exclude-newer for single packages
    default: ""
outputs:
  build-constraints:
    description: Hashed build requirements selected from the lock
    value: ${{ steps.constraints.outputs.path }}
runs:
  using: composite
  steps:
    - name: Create lock-tool environment
      shell: bash
      run: uv venv --allow-existing --python 3.15 "$RUNNER_TEMP/lock-reader"
    - name: Install lock reader
      shell: bash
      env:
        EXCLUDE_NEWER: ${{ inputs.exclude-newer }}
        EXCLUDE_NEWER_PACKAGE: ${{ inputs.exclude-newer-package }}
      run: >-
        "$GITHUB_ACTION_PATH/../tools/install_live_tools.sh" "$RUNNER_TEMP/lock-reader" --only-binary :all: 'certifi>=2026.7.22' 'packaging>=26.3'
    - id: selection
      name: Select locked groups and build constraints
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        VENV: ${{ inputs.venv }}
        CONSTRAINTS_LOCK: ${{ inputs.constraints-lock }}
      run: |
        set -euo pipefail
        groups=()
        while IFS= read -r line; do
          read -ra selected <<<"$line"
          groups+=("${selected[@]}")
        done <<<"$DEPENDENCY_GROUPS"
        if ((${#groups[@]})); then
          [[ -n "$VENV" ]] || {
            echo '::error::venv is required when installing groups' >&2
            exit 1
          }
          uv venv --allow-existing --python 3.15 "$VENV"
          selection=("${groups[@]}")
          printf '%s\n' "${groups[@]}" >"$RUNNER_TEMP/selected-lock-groups"
        else
          selection=(--build-constraints)
        fi
        # An export from a named constraints lock checks that lock instead of the primary one.
        checked=false
        if ((${#groups[@]})) || [[ -z "$CONSTRAINTS_LOCK" ]]; then
          uv run --no-project --python "$RUNNER_TEMP/lock-reader" python \
            "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" pylock.toml "${selection[@]}"
          checked=true
        fi
        printf 'lock=pylock.toml\nchecked=%s\n' "$checked" >>"$GITHUB_OUTPUT"
    - name: Verify additional release lock
      if: inputs.verify-lock != '' || inputs.verify-groups != ''
      shell: bash
      env:
        VERIFY_LOCK: ${{ inputs.verify-lock }}
        VERIFY_GROUPS: ${{ inputs.verify-groups }}
      run: |
        set -euo pipefail
        groups=()
        while IFS= read -r line; do
          read -ra selected <<<"$line"
          groups+=("${selected[@]}")
        done <<<"$VERIFY_GROUPS"
        if [[ -z "$VERIFY_LOCK" || ${#groups[@]} -eq 0 ]]; then
          echo '::error::verify-lock and verify-groups must be set together' >&2
          exit 1
        fi
        uv run --no-project --python "$RUNNER_TEMP/lock-reader" python \
          "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" "$VERIFY_LOCK" "${groups[@]}"
    - id: constraints
      name: Export locked build requirements
      shell: bash
      env:
        BUILD_LOCK: ${{ steps.selection.outputs.lock }}
        CHECKED: ${{ steps.selection.outputs.checked }}
        CONSTRAINTS_LOCK: ${{ inputs.constraints-lock }}
        VERIFY_LOCK: ${{ inputs.verify-lock }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        # A verified lock already had its groups checked.
        if [[ -n "$CONSTRAINTS_LOCK" && "$CONSTRAINTS_LOCK" != "$VERIFY_LOCK" &&
          ("$CHECKED" != true || "$CONSTRAINTS_LOCK" != "$BUILD_LOCK") ]]; then
          uv run --no-project --python "$RUNNER_TEMP/lock-reader" python \
            "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" "$CONSTRAINTS_LOCK" --build-constraints
        fi
        if [[ -n "$CONSTRAINTS_LOCK" ]]; then BUILD_LOCK=$CONSTRAINTS_LOCK; fi
        args=()
        if [[ -n "$TARGET_PLATFORM" || -n "$TARGETS" ]]; then
          args+=(--target-platform "$TARGET_PLATFORM" --targets "$TARGETS")
        fi
        digest=$(
          sha256sum "$BUILD_LOCK"
          printf '%s\n' "$TARGET_PLATFORM" "$TARGETS" "${args[@]}"
        )
        digest=$(sha256sum <<<"$digest")
        output="$RUNNER_TEMP/build-constraints-${digest%% *}.txt"
        if [[ ! -f "$output" ]]; then
          uv run --no-project --python "$RUNNER_TEMP/lock-reader" python \
            "$GITHUB_ACTION_PATH/../tools/build_constraints.py" "${args[@]}" "$output" "$BUILD_LOCK"
        fi
        echo "path=$output" >>"$GITHUB_OUTPUT"
    - name: Install selected groups
      if: inputs.groups != ''
      shell: bash
      env:
        VENV: ${{ inputs.venv }}
        LOCK: ${{ steps.selection.outputs.lock }}
        BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        groups=()
        while IFS= read -r group; do
          groups+=(--group "$group")
        done <"$RUNNER_TEMP/selected-lock-groups"
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes --python "$VENV" \
          "${groups[@]}" --build-constraints "$BUILD_CONSTRAINTS" \
          --require-build-hashes --require-hashes "$LOCK"
    - name: Expose installed commands
      if: inputs.groups != ''
      shell: bash
      env:
        VENV: ${{ inputs.venv }}
      run: |
        uv run --no-project --python "$RUNNER_TEMP/lock-reader" python \
          "$GITHUB_ACTION_PATH/../tools/expose_locked_commands.py" "$VENV"
