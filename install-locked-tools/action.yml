name: Install locked release tools
description: Install selected pylock groups with hashed build dependencies
inputs:
  groups:
    description: Space-separated dependency groups to install
    required: true
  venv:
    description: Virtual environment directory
    required: true
runs:
  using: composite
  steps:
    - name: Install locked pylock reader
      shell: bash
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        uv venv --allow-existing --python 3.15 "$RUNNER_TEMP/lock-tools"
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/lock-tools" --group lock-tools \
          --only-binary :all: --require-hashes "$GITHUB_ACTION_PATH/../pylock.toml"
    - name: Select locked groups and build constraints
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        VENV: ${{ inputs.venv }}
      run: |
        set -euo pipefail
        uv venv --allow-existing --python 3.15 "$VENV"
        groups=()
        while IFS= read -r line; do
          read -ra selected <<<"$line"
          groups+=("${selected[@]}")
        done <<<"$DEPENDENCY_GROUPS"
        if ((${#groups[@]} == 0)); then
          echo '::error::at least one dependency group is required' >&2
          exit 1
        fi
        uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
          "$GITHUB_ACTION_PATH/../tools/check_lock_groups.py" pylock.toml "${groups[@]}"
        package_path=$(uv run --no-project --python "$RUNNER_TEMP/lock-tools" python -c \
          'from pathlib import Path; import packaging; print(Path(packaging.__file__).parent.parent)')
        PYTHONPATH="$package_path" uv run --no-project --python "$VENV" python \
          "$GITHUB_ACTION_PATH/../tools/build_constraints.py" \
          --shared-policy "$GITHUB_ACTION_PATH/../pyproject.toml" "$RUNNER_TEMP/caller-build-constraints.txt" \
          "$GITHUB_ACTION_PATH/../pylock.toml" pylock.toml
        printf '%s\n' "${groups[@]}" >"$RUNNER_TEMP/selected-lock-groups"
    - name: Install selected groups
      shell: bash
      env:
        VENV: ${{ inputs.venv }}
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        groups=()
        while IFS= read -r group; do
          groups+=(--group "$group")
        done <"$RUNNER_TEMP/selected-lock-groups"
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes --python "$VENV" \
          "${groups[@]}" --build-constraints "$RUNNER_TEMP/caller-build-constraints.txt" \
          --require-build-hashes pylock.toml
