name: Install locked Nab
description: Install the lock reader from the shared pylock
runs:
  using: composite
  steps:
    - name: Create lock-tool environment
      shell: bash
      run: uv venv --allow-existing --python 3.15 "$RUNNER_TEMP/lock-tools"
    - name: Install lock reader
      shell: bash
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        digest=$(sha256sum "$GITHUB_ACTION_PATH/../pylock.toml")
        if [[ -f "$RUNNER_TEMP/lock-tools/.lock-digest" &&
          $(cat "$RUNNER_TEMP/lock-tools/.lock-digest") == "${digest%% *}" ]]; then
          exit 0
        fi
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/lock-tools" --group lock-tools \
          --only-binary :all: --require-hashes "$GITHUB_ACTION_PATH/../pylock.toml"
        printf '%s\n' "${digest%% *}" >"$RUNNER_TEMP/lock-tools/.lock-digest"
