default_language_version:
  python: python3.15
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # v6.0.0
    hooks:
      - id: end-of-file-fixer
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: trailing-whitespace
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2 # v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
        additional_dependencies:
          - "ruff==0.17.1" # release-creator managed
      - id: ruff-format
        types_or: [python, pyi]
        additional_dependencies:
          - "ruff==0.17.1" # release-creator managed
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: mdformat --wrap 120
        language: python
        types: [markdown]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - "markdown-it-py==4.2.0" # release-creator managed
          - "mdformat==1.0.0" # release-creator managed
          - "mdit-py-plugins==0.6.1" # release-creator managed
          - "mdurl==0.1.2" # release-creator managed
          - "wcwidth==0.9.2" # release-creator managed
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1 # v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-d"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1 # v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0 # v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1 # v1.31.1
    hooks:
      - id: zizmor
        additional_dependencies:
          - "zizmor==1.31.1" # release-creator managed
