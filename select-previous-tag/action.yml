name: Select previous release tag
description: Select the preceding numeric tag in the release namespace
inputs:
  tag:
    description: Current release tag
    required: true
  executable:
    description: Path to the installed release-creator executable
    default: release-creator
outputs:
  previous:
    description: Preceding tag, or empty for the first release
    value: ${{ steps.select.outputs.previous }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        EXECUTABLE: ${{ inputs.executable }}
      run: |
        set -euo pipefail
        if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
          echo "::error::release tag not found: $TAG" >&2
          exit 1
        fi
        previous=$(git tag --list | "$EXECUTABLE" tags "$TAG" --previous)
        printf 'previous=%s\n' "$previous" >>"$GITHUB_OUTPUT"
