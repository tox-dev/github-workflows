name: Select previous release tag
description: Select the preceding numeric tag in the release namespace
inputs:
  tag:
    description: Current release tag
    required: true
outputs:
  previous:
    description: Preceding tag, or empty for the first release
    value: ${{ steps.select.outputs.previous }}
runs:
  using: composite
  steps:
    - name: 🏷️ Find previous release tag
      id: select
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        args=()
        if [[ "$TAG" == */* ]]; then args+=(--package "${TAG%%/*}"); fi
        previous=$(git tag --list | release-creator tags "$TAG" --previous "${args[@]}")
        printf 'previous=%s\n' "$previous" >>"$GITHUB_OUTPUT"
