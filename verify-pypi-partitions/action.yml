name: Verify PyPI artifact partitions
description: Require matrix selections to cover each staged filename exactly once
inputs:
  manifest:
    description: Global filename allowlist from the keyless stage
    required: true
  partitions-dir:
    description: Directory containing one selected-name manifest per matrix cell
    required: true
  expected-partitions:
    description: Number of matrix cells that supplied a manifest
    required: true
runs:
  using: composite
  steps:
    - name: Compare matrix selections with staged filenames
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        PARTITIONS_DIR: ${{ inputs.partitions-dir }}
        EXPECTED_PARTITIONS: ${{ inputs.expected-partitions }}
      run: |
        set -euo pipefail
        [[ -f "$MANIFEST" && -d "$PARTITIONS_DIR" ]] || exit 1
        shopt -s nullglob
        partitions=("$PARTITIONS_DIR"/*)
        test "${#partitions[@]}" -eq "$EXPECTED_PARTITIONS"
        for partition in "${partitions[@]}"; do
          [[ -f "$partition" && ! -L "$partition" ]] || exit 1
        done
        cat -- "${partitions[@]}" | LC_ALL=C sort >"$RUNNER_TEMP/pypi-partition-names.txt"
        LC_ALL=C sort -u "$RUNNER_TEMP/pypi-partition-names.txt" >"$RUNNER_TEMP/pypi-partition-unique.txt"
        cmp -s "$RUNNER_TEMP/pypi-partition-names.txt" "$RUNNER_TEMP/pypi-partition-unique.txt"
        cmp -s "$RUNNER_TEMP/pypi-partition-unique.txt" "$MANIFEST"
