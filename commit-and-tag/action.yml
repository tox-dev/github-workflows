name: Commit and tag release
description: Commit a validated release patch and atomically push its tag
inputs:
  version:
    description: Release version and tag
    required: true
  token:
    description: Repository-scoped GitHub App installation token
    required: true
  app-slug:
    description: GitHub App slug returned by create-github-app-token
    required: true
  message:
    description: Release commit message
    required: true
  annotated:
    description: Create an annotated tag
    default: "false"
runs:
  using: composite
  steps:
    - name: ⚙️ Set App commit identity
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APP_SLUG: ${{ inputs.app-slug }}
      run: |
        set -euo pipefail
        app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        echo "Commit identity: ${APP_SLUG}[bot] (App user $app_user_id)"
    - name: 🏷️ Commit release patch
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: git commit -m "$MESSAGE"
    - name: 🏷️ Create release tag
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        MESSAGE: ${{ inputs.message }}
        ANNOTATED: ${{ inputs.annotated }}
      run: |
        case "$ANNOTATED" in
        true)
          echo "Tag $VERSION: annotated (annotated input is true)"
          git tag -a -m "$MESSAGE" -- "$VERSION"
          ;;
        *)
          echo "Tag $VERSION: lightweight (annotated input is $ANNOTATED)"
          git tag -- "$VERSION"
          ;;
        esac
    - name: ⬆️ Push release commit and tag
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh auth setup-git --hostname github.com --force
        echo "Pushing the release commit to main and tag $VERSION in one atomic push"
        git push --atomic origin HEAD:refs/heads/main "refs/tags/$VERSION"
