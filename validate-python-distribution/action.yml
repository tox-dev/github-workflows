name: Validate Python distribution
description: Check the exact wheel and sdist before uploading them
inputs:
  lock:
    description: Full project pylock path
    default: pylock.toml
  python-version:
    description: Python version for locked package validators
    default: "3.15"
  validation-group:
    description: Dependency group containing Twine and check-wheel-contents
    default: pkg-meta
  out-dir:
    description: Directory containing the distribution files
    default: dist
runs:
  using: composite
  steps:
    - name: Install locked package validators
      uses: $/install-locked-tools
      with:
        lock: ${{ inputs.lock }}
        groups: ${{ inputs.validation-group }}
        python-version: ${{ inputs.python-version }}
        venv: ${{ runner.temp }}/package-validators
    - name: Check distribution metadata
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: uv run --no-project --python "$RUNNER_TEMP/package-validators" twine check "$OUT_DIR"/*
    - name: Check wheel contents
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: uv run --no-project --python "$RUNNER_TEMP/package-validators" check-wheel-contents --no-config "$OUT_DIR"
