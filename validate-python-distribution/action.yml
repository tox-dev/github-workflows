name: Validate Python distribution
description: Check the exact wheel and sdist before uploading them
runs:
  using: composite
  steps:
    - name: Install locked package validators
      uses: $/install-locked-tools
      with:
        groups: pkg-meta
        venv: ${{ runner.temp }}/package-validators
    - name: Check distribution metadata
      shell: bash
      run: uv run --no-project --python "$RUNNER_TEMP/package-validators" twine check dist/*
    - name: Check wheel contents
      shell: bash
      run: uv run --no-project --python "$RUNNER_TEMP/package-validators" check-wheel-contents --no-config dist
