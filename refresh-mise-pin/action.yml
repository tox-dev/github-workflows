name: Refresh mise release pin
description: Update a release workflow to a seven-day-old, signature-verified mise binary
inputs:
  workflow:
    description: Repository-relative workflow containing the pinned mise step
    required: true
  step-name:
    description: Exact name of the mise setup step in that workflow
    required: true
  github-token:
    description: Token with read access to public GitHub releases
    required: true
outputs:
  changed:
    description: Whether the workflow's mise version or digest changed
    value: ${{ steps.update.outputs.changed }}
  version:
    description: Selected mise version without the v prefix
    value: ${{ steps.update.outputs.version }}
  sha256:
    description: SHA256 of the verified Linux x64 mise executable
    value: ${{ steps.update.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: List upstream releases
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh api --paginate \
          --jq '.[] | {tag_name,published_at,prerelease,draft,assets:[.assets[] |
            select(.name | endswith("-linux-x64")) | {name,digest,created_at,updated_at}]} | @json' \
          'repos/jdx/mise/releases?per_page=100' >"$RUNNER_TEMP/mise-releases.jsonl"
    - name: Install locked YAML editor
      uses: $/install-locked-tools
      with:
        groups: release-mise-editor
        venv: ${{ runner.temp }}/mise-editor
        lock-source: shared
    - name: Select seven-day-old release
      id: select
      shell: bash
      run: |
        uv run --no-project --python "$RUNNER_TEMP/mise-editor" python \
          "$GITHUB_ACTION_PATH/../tools/refresh_mise_pin.py" select \
          "$RUNNER_TEMP/mise-releases.jsonl" "$GITHUB_OUTPUT"
    - name: Install signature-verified mise
      uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      with:
        version: ${{ steps.select.outputs.version }}
        mise_dir: ${{ runner.temp }}/refresh-mise-pin
        cache: "false"
        install: "false"
        env: "false"
        export_path: "false"
        add_shims_to_path: "false"
    - name: Update the workflow pin
      id: update
      shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        STEP_NAME: ${{ inputs.step-name }}
        VERSION: ${{ steps.select.outputs.version }}
        EXPECTED_SHA256: ${{ steps.select.outputs.sha256 }}
      run: |
        uv run --no-project --python "$RUNNER_TEMP/mise-editor" python \
          "$GITHUB_ACTION_PATH/../tools/refresh_mise_pin.py" update \
          "$WORKFLOW" "$STEP_NAME" "$VERSION" "$EXPECTED_SHA256" \
          "$RUNNER_TEMP/refresh-mise-pin/bin/mise" "$GITHUB_OUTPUT"
