name: Render release notes
description: Validate a tagged changelog and render its GitHub Release body to $RUNNER_TEMP/release-notes.md
inputs:
  tag:
    description: Existing release tag
    required: true
  changelog:
    description: Tracked changelog path
    required: true
  artifact-url:
    description: Published ecosystem release URL
    default: ""
  artifact-label:
    description: Link text for the published artifact
    default: PyPI release
  previous:
    description: Previous tag, or auto to calculate it from Git history
    default: auto
runs:
  using: composite
  steps:
    - name: 🏷️ Find previous release tag
      id: selected
      if: inputs.previous == 'auto'
      uses: $/select-previous-tag
      with:
        tag: ${{ inputs.tag }}
    - id: previous
      name: 🏷️ Select previous tag
      shell: bash
      env:
        INPUT_PREVIOUS: ${{ inputs.previous }}
        SELECTED_PREVIOUS: ${{ steps.selected.outputs.previous }}
      run: |
        if [[ "$INPUT_PREVIOUS" == auto ]]; then
          echo "Previous tag for the notes: ${SELECTED_PREVIOUS:-none} (calculated, previous input is auto)"
          echo "previous=$SELECTED_PREVIOUS" >>"$GITHUB_OUTPUT"
        else
          echo "Previous tag for the notes: ${INPUT_PREVIOUS:-none} (from the previous input)"
          echo "previous=$INPUT_PREVIOUS" >>"$GITHUB_OUTPUT"
        fi
    - name: 📝 Render GitHub Release notes
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        CHANGELOG: ${{ inputs.changelog }}
        ARTIFACT_URL: ${{ inputs.artifact-url }}
        ARTIFACT_LABEL: ${{ inputs.artifact-label }}
        PREVIOUS: ${{ steps.previous.outputs.previous }}
      run: |
        set -euo pipefail
        args=(--changelog "$CHANGELOG" --tag "$TAG" --repository "$GITHUB_REPOSITORY")
        if [[ -n "$PREVIOUS" ]]; then
          args+=(--previous "$PREVIOUS")
        fi
        if [[ -n "$ARTIFACT_URL" ]]; then
          args+=(--artifact-url "$ARTIFACT_URL" --artifact-label "$ARTIFACT_LABEL")
          echo "Artifact link: $ARTIFACT_LABEL -> $ARTIFACT_URL"
        else
          echo 'Artifact link skipped: artifact-url input is empty'
        fi
        release-creator notes "${args[@]}" >"$RUNNER_TEMP/release-notes.md"
        entries=$(grep -c '^- ' "$RUNNER_TEMP/release-notes.md" || true)
        categories=$(grep -c '^### ' "$RUNNER_TEMP/release-notes.md" || true)
        echo "Release notes for $TAG: $entries entries in $categories categories from $CHANGELOG -> $RUNNER_TEMP/release-notes.md"
