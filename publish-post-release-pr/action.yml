name: Publish a prepared pull request
description: Reconcile a prepared branch and pull request without checking out project code
inputs:
  base-commit:
    description: Base commit used by the keyless preparation job
    required: true
  branch:
    description: Stable branch name for the pull request
    required: true
  title:
    description: Exact pull request title
    required: true
  body-file:
    description: File containing the exact pull request body
    required: true
  paths-file:
    description: Tab-separated changed path and desired Git blob SHA on each line
    required: true
  allowed-paths:
    description: Newline-separated paths the writer permits the prepared commit to change
    required: true
  bundle:
    description: Bundle containing refs/heads/release-candidate, empty when the change is already merged
    default: ""
  candidate-commit:
    description: Candidate commit SHA in the bundle, empty when the change is already merged
    default: ""
runs:
  using: composite
  steps:
    - name: 🔍 Check the allowed path manifest
      shell: bash
      env:
        PATHS_FILE: ${{ inputs.paths-file }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # GitHub supplies this Action path at runtime.
        source "$GITHUB_ACTION_PATH/../tools/plural.sh"
        trusted_paths=()
        while IFS= read -r path || [[ -n "$path" ]]; do
          trusted_paths+=("$path")
        done < <(printf '%s' "$ALLOWED_PATHS")
        printf '%s\n' "${trusted_paths[@]}" | LC_ALL=C sort -u >"$RUNNER_TEMP/allowed-paths"
        paths=()
        while IFS=$'\t' read -r path blob; do
          case "$path" in
          '' | /* | *[!A-Za-z0-9._/-]* | . | .. | ./* | ../* | */. | */.. | */./* | */../*)
            echo "::error::prepared path '$path' is not a plain relative path" >&2
            exit 1
            ;;
          esac
          if ! grep -Fqx -- "$path" "$RUNNER_TEMP/allowed-paths"; then
            echo "::error::prepared path $path is not in the writer's allowed-paths: ${trusted_paths[*]}" >&2
            exit 1
          fi
          case "$blob" in
          *[!0-9a-f]* | '')
            echo "::error::prepared blob for $path is '$blob', not a lowercase hex SHA" >&2
            exit 1
            ;;
          esac
          if ((${#blob} != 40)); then
            echo "::error::prepared blob for $path is ${#blob} characters long instead of 40" >&2
            exit 1
          fi
          paths+=("$path")
        done <"$PATHS_FILE"
        if ((${#paths[@]} == 0)); then
          echo "::error::prepared path manifest ${PATHS_FILE##*/} lists no paths" >&2
          exit 1
        fi
        duplicates=$(printf '%s\n' "${paths[@]}" | LC_ALL=C sort | uniq -d)
        if [[ -n "$duplicates" ]]; then
          echo "::error::prepared path manifest lists paths more than once: ${duplicates//$'\n'/, }" >&2
          exit 1
        fi
        printf '%s\n' "${paths[@]}" | LC_ALL=C sort >"$RUNNER_TEMP/expected-paths"
        echo "Prepared paths: $(plural "${#paths[@]}" path) allowed by the writer: ${paths[*]}"
    - name: 🔍 Verify the prepared commit
      shell: bash
      env:
        BASE_COMMIT: ${{ inputs.base-commit }}
        BUNDLE: ${{ inputs.bundle }}
        CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
        PATHS_FILE: ${{ inputs.paths-file }}
      run: |
        set -euo pipefail
        if [[ -z "$BUNDLE" ]]; then
          echo 'Prepared commit check skipped: no bundle, the change is already merged'
        else
          BUNDLE=$(python3 -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$BUNDLE")
          git init --bare "$RUNNER_TEMP/post-release.git"
          git -C "$RUNNER_TEMP/post-release.git" bundle verify "$BUNDLE"
          git -C "$RUNNER_TEMP/post-release.git" fetch "$BUNDLE" \
            refs/heads/release-candidate:refs/heads/release-candidate
          bundled=$(git -C "$RUNNER_TEMP/post-release.git" rev-parse refs/heads/release-candidate)
          if [[ "$bundled" != "$CANDIDATE_COMMIT" ]]; then
            echo "::error::bundle release-candidate is $bundled, expected candidate commit $CANDIDATE_COMMIT" >&2
            exit 1
          fi
          read -r commit parent extra < <(
            git -C "$RUNNER_TEMP/post-release.git" rev-list --parents -n 1 "$CANDIDATE_COMMIT"
          )
          if [[ "$commit" != "$CANDIDATE_COMMIT" ]]; then
            echo "::error::bundle resolves $CANDIDATE_COMMIT to $commit" >&2
            exit 1
          fi
          if [[ "${parent:-}" != "$BASE_COMMIT" || -n "${extra:-}" ]]; then
            echo "::error::candidate commit $CANDIDATE_COMMIT has parents '${parent:-} ${extra:-}'," \
              "expected only base commit $BASE_COMMIT" >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/post-release.git" diff --name-only --no-renames "$BASE_COMMIT" "$CANDIDATE_COMMIT" |
            LC_ALL=C sort >"$RUNNER_TEMP/candidate-paths"
          if ! cmp -s "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/candidate-paths"; then
            echo "::error::candidate commit changes $(paste -sd ' ' "$RUNNER_TEMP/candidate-paths")," \
              "the manifest lists $(paste -sd ' ' "$RUNNER_TEMP/expected-paths")" >&2
            exit 1
          fi
          while IFS=$'\t' read -r path blob; do
            if ! read -r mode object actual _ < <(
              git -C "$RUNNER_TEMP/post-release.git" ls-tree "$CANDIDATE_COMMIT" -- "$path"
            ); then
              echo "::error::candidate commit $CANDIDATE_COMMIT deletes $path, the manifest expects blob $blob" >&2
              exit 1
            fi
            if [[ "$mode" != 100644 || "$object" != blob ]]; then
              echo "::error::candidate $path is a $object with mode $mode, expected a 100644 blob" >&2
              exit 1
            fi
            if [[ "$actual" != "$blob" ]]; then
              echo "::error::candidate $path has blob $actual, the manifest expects $blob" >&2
              exit 1
            fi
          done <"$PATHS_FILE"
          echo "Prepared commit $CANDIDATE_COMMIT: one parent $BASE_COMMIT, changes only the prepared paths with the expected blobs"
        fi
    - name: 🔀 Inspect the existing pull request
      shell: bash
      env:
        BASE: main
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        BODY_FILE: ${{ inputs.body-file }}
      run: |
        set -euo pipefail
        head_owner=${GITHUB_REPOSITORY%%/*}
        gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=all -f "head=$head_owner:$BRANCH" -f per_page=100 \
          >"$RUNNER_TEMP/post-release-all-prs.json"
        jq -e --arg repository "$GITHUB_REPOSITORY" --arg title "$TITLE" --arg base "$BASE" \
          --arg branch "$BRANCH" --rawfile body "$BODY_FILE" '
          [.[] | select(.head.repo.full_name == $repository and .head.ref == $branch)] as $existing |
          if any($existing[]; .state == "closed" and .merged_at == null) then
            error("post-release pull request was closed without merging; reopen it to retry")
          else [$existing[] | select(
            .title == $title and .body == $body and .base.ref == $base and
            (.state == "open" or .merged_at != null)
          )] end
        ' "$RUNNER_TEMP/post-release-all-prs.json" >"$RUNNER_TEMP/post-release-prs.json"
        jq -r --arg branch "$BRANCH" '"Branch \($branch): \(length) pull request\(if length == 1 then "" else "s" end) open or merged with the expected title, body and base\(
          if length > 0 then " (#" + (map(.number | tostring) | join(", #")) + ")" else "" end)"' \
          "$RUNNER_TEMP/post-release-prs.json"
    - name: ⚙️ Record an already merged pull request
      shell: bash
      run: |
        set -euo pipefail
        if [[ $(jq -r '.[0].merged_at != null' "$RUNNER_TEMP/post-release-prs.json") == true ]]; then
          jq -r '.[0].number' "$RUNNER_TEMP/post-release-prs.json" >"$RUNNER_TEMP/post-release-number"
          echo "Pull request #$(<"$RUNNER_TEMP/post-release-number") is already merged, skipping the branch push and pull request creation"
        fi
    - name: ⬆️ Push a missing prepared branch
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        if [[ $(jq -r '.[0].merged_at != null' "$RUNNER_TEMP/post-release-prs.json") == true ]]; then
          echo 'Branch push skipped: the pull request is already merged'
        elif gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>"$RUNNER_TEMP/branch-error"; then
          echo "Branch push skipped: $BRANCH already exists"
        else
          if ! grep -Fq '(HTTP 404)' "$RUNNER_TEMP/branch-error"; then
            echo "::error::could not check whether branch $BRANCH exists; GitHub replied:" >&2
            cat "$RUNNER_TEMP/branch-error" >&2
            exit 1
          fi
          echo "Branch $BRANCH is missing, pushing the prepared commit"
          gh auth setup-git --hostname "${GH_HOST:-github.com}" --force
          git -C "$RUNNER_TEMP/post-release.git" remote add origin \
            "https://${GH_HOST:-github.com}/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/post-release.git" push origin "refs/heads/release-candidate:refs/heads/$BRANCH"
        fi
    - name: 🔀 Create a missing pull request
      shell: bash
      env:
        BASE: main
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        BODY_FILE: ${{ inputs.body-file }}
      run: |
        set -euo pipefail
        if [[ $(jq -r '.[0].merged_at != null' "$RUNNER_TEMP/post-release-prs.json") != true ]]; then
          pr_number=$(jq -r '.[0].number // empty' "$RUNNER_TEMP/post-release-prs.json")
          if [[ -z "$pr_number" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f "head=$BRANCH" -f "base=$BASE" \
              -f "title=$TITLE" -F "body=@$BODY_FILE" >"$RUNNER_TEMP/post-release-created.json"
            pr_number=$(jq -r .number "$RUNNER_TEMP/post-release-created.json")
            echo "Created pull request #$pr_number from $BRANCH to $BASE"
          else
            echo "Pull request creation skipped: #$pr_number is already open with the expected title, body and base"
          fi
          printf '%s\n' "$pr_number" >"$RUNNER_TEMP/post-release-number"
        fi
    - name: 🔀 Ensure the maintenance label
      shell: bash
      run: |
        set -euo pipefail
        pr_number=$(cat "$RUNNER_TEMP/post-release-number")
        labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/labels" --jq '.[].name')
        if grep -Fxq 'skip news' <<<"$labels"; then
          echo "Pull request #$pr_number already has the skip news label"
        else
          labels=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr_number/labels" -f 'labels[]=skip news' \
            --jq 'map(.name) | join(", ")')
          echo "Added the skip news label to pull request #$pr_number, labels now: $labels"
        fi
