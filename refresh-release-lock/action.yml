name: Refresh a release-tool lock
description: Compile and check a local release-tool lock without GitHub writes
inputs:
  lock:
    description: Path to the checked-in full project pylock file
    default: pylock.toml
  python-version:
    description: Python version used to run the exporter and release tools
    default: "3.15"
  keep-uv-lock:
    description: Also refresh a checked-in uv.lock for projects that use it for their build
    default: "false"
  build-constraints:
    description: Optional generated backend constraints path kept with this repository's lock
    default: ""
  build-requirements:
    description: Additional build requirements, one per line
    default: ""
  hook-config:
    description: Pre-commit configuration path to protect from generated-file overwrite
    default: .pre-commit-config.yaml
  exclude-newer-packages:
    description: Reviewed package=UTC minimum cutoffs; each expires when the seven-day cutoff passes it
    default: ""
outputs:
  changed:
    description: Whether the lock differs from the checkout
    value: ${{ steps.lock.outputs.changed }}
runs:
  using: composite
  steps:
    - name: Install lock exporter
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/lock-exporter"
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes --only-binary release-creator \
          --python "$RUNNER_TEMP/lock-exporter/bin/python" --group release \
          --build-constraints "$GITHUB_ACTION_PATH/../release-build-constraints.txt" --require-build-hashes \
          "$GITHUB_ACTION_PATH/../pylock.toml"
    - id: cutoff
      name: Set dependency age cutoff
      shell: bash
      run: echo "timestamp=$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
    - id: exceptions
      name: Select active package cutoffs
      shell: bash
      env:
        EXCLUDE_NEWER_PACKAGES: ${{ inputs.exclude-newer-packages }}
        CUTOFF: ${{ steps.cutoff.outputs.timestamp }}
      run: |
        set -euo pipefail
        now=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
        : >"$RUNNER_TEMP/active-package-cutoffs"
        while IFS= read -r entry; do
          if [[ -z "$entry" ]]; then
            continue
          fi
          package=${entry%%=*}
          timestamp=${entry#*=}
          case "$package" in
          '' | *[!a-zA-Z0-9._-]*)
            echo "::error::invalid package cutoff: $entry" >&2
            exit 1
            ;;
          esac
          case "$timestamp" in
          ????-??-??T??:??:??Z) ;;
          *)
            echo "::error::invalid package cutoff: $entry" >&2
            exit 1
            ;;
          esac
          if [[ "$timestamp" > "$now" ]] || \
            [[ $(date --utc --date="$timestamp" '+%Y-%m-%dT%H:%M:%SZ') != "$timestamp" ]]; then
            echo "::error::invalid package cutoff: $entry" >&2
            exit 1
          fi
          if [[ "$timestamp" > "$CUTOFF" ]]; then
            printf '%s\n' "$entry" >>"$RUNNER_TEMP/active-package-cutoffs"
          fi
        done <<<"$EXCLUDE_NEWER_PACKAGES"
        echo "path=$RUNNER_TEMP/active-package-cutoffs" >>"$GITHUB_OUTPUT"
    - name: Refresh full project lock
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.timestamp }}
        ACTIVE_PACKAGE_CUTOFFS: ${{ steps.exceptions.outputs.path }}
        BUILD_REQUIREMENTS: ${{ inputs.build-requirements }}
      run: |
        set -euo pipefail
        exceptions=()
        while IFS= read -r entry; do
          if [[ -z "$entry" ]]; then
            continue
          fi
          exceptions+=(--exclude-newer-package "$entry")
        done <"$ACTIVE_PACKAGE_CUTOFFS"
        requirements=()
        while IFS= read -r requirement; do
          if [[ -n "$requirement" ]]; then
            requirements+=(--build-requirement "$requirement")
          fi
        done <<<"$BUILD_REQUIREMENTS"
        "$RUNNER_TEMP/lock-exporter/bin/release-creator" locks --output "$LOCK" \
          --tool-python ">=$PYTHON_VERSION" "${requirements[@]}" "${exceptions[@]}"
    - name: Refresh uv lock
      if: inputs.keep-uv-lock == 'true'
      shell: bash
      env:
        UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.timestamp }}
        ACTIVE_PACKAGE_CUTOFFS: ${{ steps.exceptions.outputs.path }}
      run: |
        set -euo pipefail
        exceptions=()
        while IFS= read -r entry; do
          if [[ -z "$entry" ]]; then
            continue
          fi
          exceptions+=(--exclude-newer-package "$entry")
        done <"$ACTIVE_PACKAGE_CUTOFFS"
        uv lock --upgrade "${exceptions[@]}"
    - name: Refresh backend constraints
      if: inputs.build-constraints != ''
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
        HOOK_CONFIG: ${{ inputs.hook-config }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        case "$BUILD_CONSTRAINTS" in
        /* | . | .. | ./* | */./* | */. | ../* | */../* | */.. | .git/* | */.git/* | *[!a-zA-Z0-9_./-]*)
          echo "::error::invalid backend constraints path: $BUILD_CONSTRAINTS" >&2
          exit 1
          ;;
        esac
        case "${BUILD_CONSTRAINTS##*/}" in
        *build-constraints.txt) ;;
        *)
          echo "::error::backend constraints filename must end in build-constraints.txt" >&2
          exit 1
          ;;
        esac
        if [[ "$BUILD_CONSTRAINTS" == "$LOCK" || "$BUILD_CONSTRAINTS" == "$HOOK_CONFIG" || \
          "$BUILD_CONSTRAINTS" == pyproject.toml || "$BUILD_CONSTRAINTS" == uv.lock || \
          "$BUILD_CONSTRAINTS" == pylock.toml ]]; then
          echo "::error::backend constraints path collides with a project file: $BUILD_CONSTRAINTS" >&2
          exit 1
        fi
        prefix=.
        IFS=/ read -ra parts <<<"$BUILD_CONSTRAINTS"
        for part in "${parts[@]}"; do
          prefix="$prefix/$part"
          if [[ -L "$prefix" ]]; then
            echo "::error::backend constraints path contains a symlink: $BUILD_CONSTRAINTS" >&2
            exit 1
          fi
        done
        "$RUNNER_TEMP/lock-exporter/bin/release-creator" build-constraints --lock "$LOCK" --group build \
          --python-version "$PYTHON_VERSION" --output "$BUILD_CONSTRAINTS"
    - name: Install refreshed release tools
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        constraints=$BUILD_CONSTRAINTS
        if [[ -z "$constraints" ]]; then
          constraints="$RUNNER_TEMP/refreshed-build-constraints.txt"
          "$RUNNER_TEMP/lock-exporter/bin/release-creator" build-constraints --lock "$LOCK" --group build \
            --python-version "$PYTHON_VERSION" --output "$constraints"
        fi
        uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/release-tools"
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes --only-binary release-creator \
          --python "$RUNNER_TEMP/release-tools/bin/python" --group release \
          --build-constraints "$constraints" --require-build-hashes "$LOCK"
    - name: Run repository checks
      shell: bash
      run: >-
        "$RUNNER_TEMP/release-tools/bin/prek" run --all-files
    - name: Check refreshed lock paths
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        KEEP_UV_LOCK: ${{ inputs.keep-uv-lock }}
        BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
      run: |
        set -euo pipefail
        while IFS= read -r entry; do
          path=${entry:3}
          if [[ "$path" != "$LOCK" && "$path" != "$BUILD_CONSTRAINTS" ]] && \
            [[ "$KEEP_UV_LOCK" != true || "$path" != uv.lock ]]; then
            echo "::error::prek changed file outside the lock file: $path" >&2
            exit 1
          fi
        done < <(git status --porcelain=v1 --untracked-files=all)
    - id: lock
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        KEEP_UV_LOCK: ${{ inputs.keep-uv-lock }}
        BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
      run: |
        set -euo pipefail
        paths=("$LOCK")
        if [[ "$KEEP_UV_LOCK" == true ]]; then
          paths+=(uv.lock)
        fi
        if [[ -n "$BUILD_CONSTRAINTS" ]]; then
          paths+=("$BUILD_CONSTRAINTS")
          git add -N -- "$BUILD_CONSTRAINTS"
        fi
        if git diff --quiet -- "${paths[@]}"; then
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'changed=true' >>"$GITHUB_OUTPUT"
        git diff --binary -- "${paths[@]}" >"$RUNNER_TEMP/lock.patch"
        test -s "$RUNNER_TEMP/lock.patch"
