name: Refresh a release-tool lock
description: Refresh or check a Nab project lock and optional Nab matrix lock
inputs:
  additional-lock:
    description: Optional secondary pylock basename for a separate build matrix
    default: ""
  additional-lock-groups:
    description: Groups for the secondary lock; empty selects build requirements
    default: ""
  additional-lock-selection:
    description: Select project dependencies and configured groups for the secondary lock
    default: build-or-groups
  additional-matrix-python:
    description: Python range for the secondary lock
    default: ""
  additional-matrix-platforms:
    description: Space-separated Nab platform IDs for the secondary lock
    default: ""
  additional-matrix-implementations:
    description: Space-separated Python implementations for the secondary lock
    default: ""
  mode:
    description: Refresh the lock or check that the committed lock is current
    default: refresh
  exclude-newer:
    description: Upload cutoff for the tools this Action installs from PyPI
    default: 7 days
  exclude-newer-package:
    description: Newline-separated name=date cutoffs that override exclude-newer for single packages
    default: ""
outputs:
  changed:
    description: Whether the locks differ from the checkout
    value: ${{ steps.lock.outputs.changed }}
runs:
  using: composite
  steps:
    - name: Install Nab
      shell: bash
      env:
        EXCLUDE_NEWER: ${{ inputs.exclude-newer }}
        EXCLUDE_NEWER_PACKAGE: ${{ inputs.exclude-newer-package }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        requirements=("nab>=0.0.22")
        if [[ "$MODE" == check ]]; then
          version=""
          if [[ -f pylock.toml ]]; then
            version=$(python3 -c 'import tomllib
        with open("pylock.toml", "rb") as lock:
            print(tomllib.load(lock).get("tool", {}).get("nab", {}).get("nab-version", ""))')
          fi
          if [[ -z "$version" ]]; then
            echo '::error::check mode needs the Nab version in pylock.toml [tool.nab] nab-version' >&2
            exit 1
          fi
          # A newer Nab rewrites nab-version, so checking with it would fail every committed lock.
          requirements=("nab==$version")
        fi
        "$GITHUB_ACTION_PATH/../tools/install_live_tools.sh" "$RUNNER_TEMP/lock-tools" "${requirements[@]}"
    - name: Resolve all project groups and extras
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        unset SSL_CERT_FILE SSL_CERT_DIR
        case "$MODE" in
        refresh) refresh=(--upgrade) ;;
        *) refresh=() ;;
        esac
        cp pylock.toml "$RUNNER_TEMP/lock-before.toml"
        uv run --no-project --python "$RUNNER_TEMP/lock-tools" nab lock --all-groups --all-extras --no-cache "${refresh[@]}"
        python3 "$GITHUB_ACTION_PATH/../tools/check_nab_lock.py" --environments-only \
          "$RUNNER_TEMP/lock-before.toml" pylock.toml
        if [[ "$MODE" == check ]]; then
          python3 "$GITHUB_ACTION_PATH/../tools/check_nab_lock.py" "$RUNNER_TEMP/lock-before.toml" pylock.toml
        fi
    - name: Resolve optional Nab matrix
      if: inputs.additional-lock != ''
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ADDITIONAL_LOCK: ${{ inputs.additional-lock }}
        ADDITIONAL_GROUPS: ${{ inputs.additional-lock-groups }}
        ADDITIONAL_SELECTION: ${{ inputs.additional-lock-selection }}
        MATRIX_PYTHON: ${{ inputs.additional-matrix-python }}
        MATRIX_PLATFORMS: ${{ inputs.additional-matrix-platforms }}
        MATRIX_IMPLEMENTATIONS: ${{ inputs.additional-matrix-implementations }}
      run: |
        set -euo pipefail
        unset SSL_CERT_FILE SSL_CERT_DIR
        case "$MODE" in
        refresh) refresh=(--upgrade) ;;
        *) refresh=() ;;
        esac
        platforms=()
        implementations=()
        selected_groups=()
        while IFS= read -r line; do
          read -ra words <<<"$line"
          platforms+=("${words[@]}")
        done <<<"$MATRIX_PLATFORMS"
        while IFS= read -r line; do
          read -ra words <<<"$line"
          implementations+=("${words[@]}")
        done <<<"$MATRIX_IMPLEMENTATIONS"
        while IFS= read -r line; do
          read -ra words <<<"$line"
          selected_groups+=("${words[@]}")
        done <<<"$ADDITIONAL_GROUPS"
        case "$ADDITIONAL_SELECTION" in
        project) selection=() ;;
        *)
          selection=(--build-requirements)
          if ((${#selected_groups[@]})); then selection=(--groups "${selected_groups[@]}"); fi
          ;;
        esac
        cp "$ADDITIONAL_LOCK" "$RUNNER_TEMP/additional-lock-before.toml"
        uv run --no-project --python "$RUNNER_TEMP/lock-tools" nab lock --no-cache pyproject.toml "${selection[@]}" \
          --project-matrix-python "$MATRIX_PYTHON" \
          --project-matrix-platforms "${platforms[@]}" \
          --project-matrix-implementations "${implementations[@]}" \
          --output "$ADDITIONAL_LOCK" "${refresh[@]}"
        python3 "$GITHUB_ACTION_PATH/../tools/check_nab_lock.py" --environments-only \
          "$RUNNER_TEMP/additional-lock-before.toml" "$ADDITIONAL_LOCK"
        if [[ "$MODE" == check ]]; then
          python3 "$GITHUB_ACTION_PATH/../tools/check_nab_lock.py" \
            "$RUNNER_TEMP/additional-lock-before.toml" "$ADDITIONAL_LOCK"
        fi
    - id: lock
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ADDITIONAL_LOCK: ${{ inputs.additional-lock }}
      run: |
        set -euo pipefail
        paths=(pylock.toml)
        if [[ -n "$ADDITIONAL_LOCK" ]]; then paths+=("$ADDITIONAL_LOCK"); fi
        if [[ "$MODE" == check ]]; then
          git diff --exit-code -- "${paths[@]}"
          echo 'changed=false' >>"$GITHUB_OUTPUT"
        elif git diff --quiet -- "${paths[@]}"; then
          echo 'changed=false' >>"$GITHUB_OUTPUT"
        else
          echo 'changed=true' >>"$GITHUB_OUTPUT"
          git diff --binary -- "${paths[@]}" >"$RUNNER_TEMP/lock.patch"
        fi
