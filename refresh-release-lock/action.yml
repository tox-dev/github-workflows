name: Refresh a release-tool lock
description: Compile and check a local release-tool lock without GitHub writes
inputs:
  lock:
    description: Path to the checked-in full project pylock file
    default: pylock.toml
  python-version:
    description: Python version used to run the exporter and release tools
    default: "3.15"
  keep-uv-lock:
    description: Also refresh a checked-in uv.lock for projects that use it for their build
    default: "false"
  exclude-newer-packages:
    description: Package names allowed to use the run-start timestamp instead of the seven-day cutoff, one per line
    default: ""
outputs:
  changed:
    description: Whether the lock differs from the checkout
    value: ${{ steps.lock.outputs.changed }}
  exception-timestamp:
    description: UTC timestamp applied only to explicitly named packages
    value: ${{ steps.cutoff.outputs.current }}
runs:
  using: composite
  steps:
    - name: Install lock exporter
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/lock-exporter"
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/lock-exporter/bin/python" \
          --group release "$GITHUB_ACTION_PATH/../pylock.toml"
    - id: cutoff
      name: Set dependency age cutoff
      shell: bash
      run: |
        current=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
        echo "current=$current" >>"$GITHUB_OUTPUT"
        echo "timestamp=$(date --utc --date="$current 7 days ago" '+%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
    - name: Refresh full project lock
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.timestamp }}
        EXCEPTION_TIMESTAMP: ${{ steps.cutoff.outputs.current }}
        EXCLUDE_NEWER_PACKAGES: ${{ inputs.exclude-newer-packages }}
      run: |
        set -euo pipefail
        exceptions=()
        while IFS= read -r package; do
          if [[ -z "$package" ]]; then
            continue
          fi
          case "$package" in
          *[!a-zA-Z0-9._-]*)
            echo "::error::invalid exclude-newer package name: $package" >&2
            exit 1
            ;;
          esac
          exceptions+=(--exclude-newer-package "$package=$EXCEPTION_TIMESTAMP")
        done <<<"$EXCLUDE_NEWER_PACKAGES"
        "$RUNNER_TEMP/lock-exporter/bin/release-creator" locks --output "$LOCK" \
          --tool-python ">=$PYTHON_VERSION" "${exceptions[@]}"
    - name: Refresh uv lock
      if: inputs.keep-uv-lock == 'true'
      shell: bash
      env:
        UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.timestamp }}
        EXCEPTION_TIMESTAMP: ${{ steps.cutoff.outputs.current }}
        EXCLUDE_NEWER_PACKAGES: ${{ inputs.exclude-newer-packages }}
      run: |
        set -euo pipefail
        exceptions=()
        while IFS= read -r package; do
          if [[ -z "$package" ]]; then
            continue
          fi
          case "$package" in
          *[!a-zA-Z0-9._-]*)
            echo "::error::invalid exclude-newer package name: $package" >&2
            exit 1
            ;;
          esac
          exceptions+=(--exclude-newer-package "$package=$EXCEPTION_TIMESTAMP")
        done <<<"$EXCLUDE_NEWER_PACKAGES"
        uv lock --upgrade "${exceptions[@]}"
    - name: Install refreshed release tools
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/release-tools"
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" \
          --group release "$LOCK"
    - name: Run repository checks
      shell: bash
      run: >-
        "$RUNNER_TEMP/release-tools/bin/prek" run --all-files
    - name: Check refreshed lock paths
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        KEEP_UV_LOCK: ${{ inputs.keep-uv-lock }}
      run: |
        set -euo pipefail
        while IFS= read -r entry; do
          path=${entry:3}
          if [[ "$path" != "$LOCK" && ("$KEEP_UV_LOCK" != true || "$path" != uv.lock) ]]; then
            echo "::error::prek changed file outside the lock file: $path" >&2
            exit 1
          fi
        done < <(git status --porcelain=v1 --untracked-files=all)
    - id: lock
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        KEEP_UV_LOCK: ${{ inputs.keep-uv-lock }}
      run: |
        set -euo pipefail
        paths=("$LOCK")
        if [[ "$KEEP_UV_LOCK" == true ]]; then
          paths+=(uv.lock)
        fi
        if git diff --quiet -- "${paths[@]}"; then
          echo 'changed=false' >>"$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'changed=true' >>"$GITHUB_OUTPUT"
        git diff --binary -- "${paths[@]}" >"$RUNNER_TEMP/lock.patch"
        test -s "$RUNNER_TEMP/lock.patch"
