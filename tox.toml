requires = ["tox>=4.64.7", "tox-uv>=1.36.1"]
env_list = ["type"]

[env.type]
description = "type-check Action tests"
base_python = "3.15"
skip_install = true
allowlist_externals = ["uv"]
commands_pre = [
  [
    "uv", "pip", "install", "--python", "{envpython}", "--group", "test",
  ],
]
commands = [["ty", "check", "--python-platform", "all", "--error", "all", "--output-format", "concise", "tests"]]
