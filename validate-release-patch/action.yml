name: Validate release patch
description: Apply the prepared patch to the original main commit and rerun prek
inputs:
  version:
    description: Release version
    required: true
  patch:
    description: Path to the downloaded patch
    required: true
  changelog:
    description: Changelog path
    required: true
  fragments:
    description: Fragment directory
    required: true
  heading-prefix:
    description: Literal prefix of the version heading
    default: "## "
  branch:
    description: Protected release branch
    default: main
  remote:
    description: Git remote containing the release branch
    default: origin
  expected-sha:
    description: Exact branch commit used for release preparation
    default: ""
runs:
  using: composite
  steps:
    - name: Verify release source
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        REMOTE: ${{ inputs.remote }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
      run: |
        set -euo pipefail
        if [[ -n $(git status --porcelain) ]]; then
          echo '::error::release validation requires a clean checkout' >&2
          exit 1
        fi
        git fetch "$REMOTE" "$BRANCH"
        if [[ $(git rev-parse "$REMOTE/$BRANCH") != "${EXPECTED_SHA:-$GITHUB_SHA}" ]]; then
          echo "::error::$BRANCH changed during release preparation; dispatch again" >&2
          exit 1
        fi
    - name: Apply and inspect release patch
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PATCH: ${{ inputs.patch }}
        CHANGELOG: ${{ inputs.changelog }}
        FRAGMENTS: ${{ inputs.fragments }}
        HEADING_PREFIX: ${{ inputs.heading-prefix }}
      run: |
        set -euo pipefail
        git apply --check "$PATCH"
        git apply --index "$PATCH"
        if git diff --cached --quiet; then
          echo '::error::release patch contains no changes' >&2
          exit 1
        fi
        mapfile -d '' -t paths < <(git diff --cached --name-only -z)
        for path in "${paths[@]}"; do
          if [[ "$path" != "$CHANGELOG" && "$path" != "$FRAGMENTS/"* ]]; then
            echo "::error::unexpected release path: $path" >&2
            exit 1
          fi
        done

        heading_found=false
        mapfile -t changelog_lines <"$CHANGELOG"
        for line in "${changelog_lines[@]}"; do
          if [[ "$line" == "$HEADING_PREFIX$VERSION ("* ]]; then
            heading_found=true
          fi
        done
        if [[ "$heading_found" != true ]]; then
          echo "::error::$CHANGELOG has no section for $VERSION" >&2
          exit 1
        fi
    - name: Run prek on release patch
      shell: bash
      run: |
        set -euo pipefail
        git diff --cached --check
        staged_patch_sha=$(git diff --cached --binary | sha256sum)
        if ! prek run --all-files; then
          echo '::error::prek failed on the validated release patch' >&2
          exit 1
        fi
        if [[ $(git diff --cached --binary | sha256sum) != "$staged_patch_sha" ]] ||
          ! git diff --quiet ||
          [[ -n $(git ls-files --others --exclude-standard) ]]; then
          echo '::error::prek changed the validated release patch' >&2
          exit 1
        fi
