name: Validate release patch
description: Check and apply a prepared release patch, with optional release-tool validation
inputs:
  version:
    description: Release version
    required: true
  patch:
    description: Path to the downloaded patch
    required: true
  changelog:
    description: Changelog path
    required: true
  fragments:
    description: Fragment directory
    required: true
  branch:
    description: Protected release branch
    default: main
  remote:
    description: Git remote containing the release branch
    default: origin
  expected-sha:
    description: Exact branch commit used for release preparation
    default: ""
  repository:
    description: GitHub owner/repository for the rendered changelog
    default: ""
  expected-patch-sha:
    description: SHA-256 digest from a separate keyless validation job
    default: ""
  checks:
    description: Run release-creator and prek after applying the patch
    default: "true"
runs:
  using: composite
  steps:
    - name: Require a clean release checkout
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo '::error::release validation requires a clean checkout' >&2
          exit 1
        fi
    - name: Verify release source
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        REMOTE: ${{ inputs.remote }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
      run: |
        set -euo pipefail
        git fetch "$REMOTE" "$BRANCH"
        if [[ $(git rev-parse "$REMOTE/$BRANCH") != "${EXPECTED_SHA:-$GITHUB_SHA}" ]]; then
          echo "::error::$BRANCH changed during release preparation; dispatch again" >&2
          exit 1
        fi
    - name: Apply release patch
      shell: bash
      env:
        PATCH: ${{ inputs.patch }}
        EXPECTED_PATCH_SHA: ${{ inputs.expected-patch-sha }}
        CHECKS: ${{ inputs.checks }}
      run: |
        set -euo pipefail
        if [[ "$CHECKS" != true && "$CHECKS" != false ]]; then
          echo '::error::checks must be true or false' >&2
          exit 1
        fi
        if [[ "$CHECKS" == false && -z "$EXPECTED_PATCH_SHA" ]]; then
          echo '::error::skipping release checks requires a validated patch digest' >&2
          exit 1
        fi
        read -r patch_sha _ < <(sha256sum "$PATCH")
        if [[ -n "$EXPECTED_PATCH_SHA" && "$patch_sha" != "$EXPECTED_PATCH_SHA" ]]; then
          echo '::error::release patch differs from the validated artifact' >&2
          exit 1
        fi
        git apply --check "$PATCH"
        git apply --index "$PATCH"
        if git diff --cached --quiet; then
          echo '::error::release patch contains no changes' >&2
          exit 1
        fi
    - name: Check release patch paths
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
        FRAGMENTS: ${{ inputs.fragments }}
      run: |
        set -euo pipefail
        reject_fragment() {
          echo "::error::unsupported release fragment: $path" >&2
          exit 1
        }
        case "$CHANGELOG" in
        *.md) fragment_extension=md ;;
        *.rst) fragment_extension=rst ;;
        *) exit 1 ;;
        esac
        if git cat-file -e HEAD:towncrier.toml 2>/dev/null; then
          git show HEAD:towncrier.toml >"$RUNNER_TEMP/release-towncrier.toml"
        else
          git show HEAD:pyproject.toml >"$RUNNER_TEMP/release-towncrier.toml"
        fi
        python3 - "$RUNNER_TEMP/release-towncrier.toml" "$FRAGMENTS" "$CHANGELOG" \
          >"$RUNNER_TEMP/release-fragment-categories" <<'PY'
        import sys
        import tomllib
        from pathlib import Path

        document = tomllib.loads(Path(sys.argv[1]).read_text())
        config = document.get('tool', {}).get('towncrier')
        if not config or not config.get('type'):
            raise SystemExit('Towncrier configuration and categories are required')
        if config.get('directory') != sys.argv[2] or config.get('filename') != sys.argv[3]:
            raise SystemExit('Towncrier paths do not match release inputs')
        for category in config['type']:
            print(category['directory'])
        PY
        git diff --cached --name-status --no-renames -z >"$RUNNER_TEMP/release-paths"
        while IFS= read -r -d '' status && IFS= read -r -d '' path; do
          if [[ "$path" == "$CHANGELOG" ]]; then
            continue
          fi
          if [[ "$path" != "$FRAGMENTS/"* ]]; then
            echo "::error::unexpected release path: $path" >&2
            exit 1
          fi
          if [[ "$status" != D ]]; then
            reject_fragment
          fi
          fragment=${path#"$FRAGMENTS/"}
          case "$fragment" in
          '' | */*) reject_fragment ;;
          *."$fragment_extension") ;;
          *) reject_fragment ;;
          esac
          fragment=${fragment%."$fragment_extension"}
          category=${fragment##*.}
          stem=${fragment%."$category"}
          if [[ -s "$RUNNER_TEMP/release-fragment-categories" ]]; then
            grep -Fqx -- "$category" "$RUNNER_TEMP/release-fragment-categories" || reject_fragment
          fi
          case "$stem" in
          +*)
            case "${stem#+}" in
            '' | [!A-Za-z0-9]* | *[!A-Za-z0-9._-]*) reject_fragment ;;
            esac
            ;;
          '' | *[!0-9]*) reject_fragment ;;
          esac
        done <"$RUNNER_TEMP/release-paths"

        if git diff --cached --quiet -- "$CHANGELOG"; then
          echo "::error::release patch does not change $CHANGELOG" >&2
          exit 1
        fi
    - name: Check release patch file modes
      shell: bash
      env:
        FRAGMENTS: ${{ inputs.fragments }}
      run: |
        set -euo pipefail
        git diff --cached --raw --no-renames -z >"$RUNNER_TEMP/release-modes"
        while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
          read -ra fields <<<"$metadata"
          case "${fields[4]}" in
          A)
            old_mode=000000
            new_mode=100644
            ;;
          M)
            old_mode=100644
            new_mode=100644
            ;;
          D)
            old_mode=100644
            new_mode=000000
            if [[ "$path" != "$FRAGMENTS/"* ]]; then
              echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
              exit 1
            fi
            ;;
          *)
            echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
            exit 1
            ;;
          esac
          if [[ "${fields[0]#\:}" != "$old_mode" ]]; then
            echo "::error::unexpected previous release file mode in $path: ${fields[0]#\:}" >&2
            exit 1
          fi
          if [[ "${fields[1]}" != "$new_mode" ]]; then
            echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
            exit 1
          fi
        done <"$RUNNER_TEMP/release-modes"
    - name: Check RST conflict markers
      if: endsWith(inputs.changelog, '.rst')
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
      run: |
        set -euo pipefail
        git diff --cached --unified=0 -- "$CHANGELOG" >"$RUNNER_TEMP/release-rst-diff"
        while IFS= read -r line; do
          case "$line" in
          +'<<<<<<<'* | +'|||||||'* | +'>>>>>>>'*)
            echo '::error::release changelog contains conflict markers' >&2
            exit 1
            ;;
          esac
        done <"$RUNNER_TEMP/release-rst-diff"
        printf '%s conflict-marker-size=10\n' "$CHANGELOG" >>"$(git rev-parse --git-path info/attributes)"
    - name: Check rendered release section
      if: inputs.checks == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
      run: |
        if ! release-creator notes --changelog "$CHANGELOG" --tag "$VERSION" --repository "$REPOSITORY" >/dev/null; then
          echo "::error::$CHANGELOG has no valid section for $VERSION" >&2
          exit 1
        fi
    - name: Run prek on release patch
      if: inputs.checks == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git diff --cached --check
        staged_patch_sha=$(git diff --cached --binary | sha256sum)
        if ! prek run --all-files; then
          echo '::error::prek failed on the validated release patch' >&2
          exit 1
        fi
        if [[ $(git diff --cached --binary | sha256sum) != "$staged_patch_sha" ]] ||
          ! git diff --quiet ||
          [[ -n $(git ls-files --others --exclude-standard) ]]; then
          echo '::error::prek changed the validated release patch' >&2
          exit 1
        fi
