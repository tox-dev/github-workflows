name: Validate release patch
description: Apply the release patch downloaded to $RUNNER_TEMP/release-patch and check its paths and file modes
inputs:
  allowed-paths:
    description: Newline-separated glob patterns for the only paths the patch may change, in place of the Towncrier configuration
    default: ""
runs:
  using: composite
  steps:
    - name: ⚙️ Apply release patch
      shell: bash
      run: git apply --index --verbose "$RUNNER_TEMP/release-patch/release.patch"
    - name: ⚙️ Read Towncrier configuration
      id: config
      if: inputs.allowed-paths == ''
      uses: $/read-towncrier-config
    - name: 🔍 Check release patch paths and file modes
      shell: bash
      env:
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        CHANGELOG: ${{ steps.config.outputs.changelog }}
        FRAGMENTS: ${{ steps.config.outputs.fragments }}
      run: |
        set -euo pipefail
        patterns=()
        while IFS= read -r pattern; do
          if [[ -n "$pattern" ]]; then
            patterns+=("$pattern")
          fi
        done <<<"$ALLOWED_PATHS"
        git diff --cached --raw --no-renames -z >"$RUNNER_TEMP/release-changes"
        count=0
        removed=0
        while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
          read -ra fields <<<"$metadata"
          status=${fields[4]}
          if [[ -n "$ALLOWED_PATHS" ]]; then
            echo "Release patch path: $status $path"
            matched=false
            for pattern in ${patterns[@]+"${patterns[@]}"}; do
              # shellcheck disable=SC2053 # The patterns are globs, matched on purpose.
              if [[ "$path" == $pattern ]]; then
                matched=true
                break
              fi
            done
            if [[ "$matched" != true ]]; then
              echo "::error::unexpected release path: $path" >&2
              exit 1
            fi
          elif [[ "$path" == "$CHANGELOG" && ("$status" == A || "$status" == M) ]]; then
            echo "Release patch path: $status $path (the changelog)"
          elif [[ "$path" != "$FRAGMENTS/"* ]]; then
            echo "::error::unexpected release path: $path" >&2
            exit 1
          elif [[ "$status" != D ]]; then
            echo "::error::unexpected release path status: $status $path" >&2
            exit 1
          else
            removed=$((removed + 1))
          fi
          case "$status" in
          A)
            old_mode=000000
            new_mode=100644
            ;;
          M)
            old_mode=100644
            new_mode=100644
            ;;
          D)
            old_mode=100644
            new_mode=000000
            ;;
          *)
            echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
            exit 1
            ;;
          esac
          if [[ "${fields[0]#\:}" != "$old_mode" ]]; then
            echo "::error::unexpected previous release file mode in $path: ${fields[0]#\:}" >&2
            exit 1
          fi
          if [[ "${fields[1]}" != "$new_mode" ]]; then
            echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
            exit 1
          fi
          count=$((count + 1))
        done <"$RUNNER_TEMP/release-changes"
        if [[ -n "$ALLOWED_PATHS" ]]; then
          echo "Release patch paths: $(python3 "$GITHUB_ACTION_PATH/../tools/plural.py" "$count" path) within the allowlist"
        else
          echo "Release patch paths: $(python3 "$GITHUB_ACTION_PATH/../tools/plural.py" "$removed" fragment) removed from $FRAGMENTS"
        fi
        echo "Release patch file modes: $(python3 "$GITHUB_ACTION_PATH/../tools/plural.py" "$count" path), each a non-executable regular file or a deletion"
