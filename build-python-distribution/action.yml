name: Build Python distribution
description: Build a wheel and sdist from source checked in a separate job
inputs:
  lock:
    description: Full project pylock containing build backend dependencies
    default: pylock.toml
  python-version:
    description: Python version for uv build
    default: "3.15"
  source:
    description: Distribution source directory
    default: .
  local-tool-source:
    description: Install release-creator from this tagged checkout before planning the build
    default: "false"
  out-dir:
    description: Directory for the wheel and sdist
    default: dist
runs:
  using: composite
  steps:
    - name: Require clean tagged source
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo '::error::tagged source is dirty' >&2
          exit 1
        fi
    - name: Install locked build planner
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
      run: |
        set -euo pipefail
        uv venv --python 3.15 "$RUNNER_TEMP/build-planner"
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes \
          --python "$RUNNER_TEMP/build-planner/bin/python" --group release \
          --build-constraints "$GITHUB_ACTION_PATH/../release-build-constraints.txt" --require-build-hashes "$LOCK"
    - name: Select build interpreter
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/build-python"
    - name: Install the tagged build planner
      if: inputs.local-tool-source == 'true'
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        SOURCE: ${{ inputs.source }}
      run: |
        uv pip sync --preview-features pylock --preview-features build-dependency-hashes \
          --python "$RUNNER_TEMP/build-planner/bin/python" --group release --group build --group project-runtime \
          --build-constraints "$GITHUB_ACTION_PATH/../release-build-constraints.txt" --require-build-hashes "$LOCK"
        uv pip install --python "$RUNNER_TEMP/build-planner/bin/python" --no-deps --no-build-isolation "$SOURCE"
    - name: Write backend constraints
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
      run: |
        "$RUNNER_TEMP/build-planner/bin/release-creator" build-constraints --lock "$LOCK" \
          --python-version "$(
            "$RUNNER_TEMP/build-python/bin/python" -c 'import platform; print(platform.python_version())'
          )" \
          --output "$RUNNER_TEMP/build-constraints.txt"
    - name: Build wheel and sdist
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        uv build --python "$RUNNER_TEMP/build-python/bin/python" --python-preference only-managed --sdist --wheel \
          --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-build-hashes "$SOURCE" --out-dir "$OUT_DIR"
