name: Build Python distribution
description: Build a wheel and sdist from source checked in a separate job
inputs:
  lock:
    description: Full project pylock containing build backend dependencies
    default: pylock.toml
  python-version:
    description: Python version for uv build
    default: "3.15"
  source:
    description: Distribution source directory
    default: .
  out-dir:
    description: Directory for the wheel and sdist
    default: dist
runs:
  using: composite
  steps:
    - name: Require clean tagged source
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo '::error::tagged source is dirty' >&2
          exit 1
        fi
    - name: Install locked build planner
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/build-planner"
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/build-planner/bin/python" --group release "$LOCK"
    - name: Write backend constraints
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
      run: '"$RUNNER_TEMP/build-planner/bin/release-creator" build-constraints --lock "$LOCK" --output "$RUNNER_TEMP/build-constraints.txt"'
    - name: Build wheel and sdist
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        SOURCE: ${{ inputs.source }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        uv build --python "$PYTHON_VERSION" --python-preference only-managed --sdist --wheel \
          --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-build-hashes "$SOURCE" --out-dir "$OUT_DIR"
