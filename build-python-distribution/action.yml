name: Build Python distribution
description: Build a wheel and sdist for a keyless PR check
inputs:
  exclude-newer:
    description: Upload cutoff for the tools this Action installs from PyPI
    default: 7 days
  exclude-newer-package:
    description: Newline-separated name=date cutoffs that override exclude-newer for single packages
    default: ""
runs:
  using: composite
  steps:
    - name: 🐍 Select build interpreter
      shell: bash
      run: uv venv --allow-existing --python 3.15 "$RUNNER_TEMP/build-python"
    - name: 📦 Export locked build constraints
      id: constraints
      uses: $/export-build-constraints
      with:
        exclude-newer: ${{ inputs.exclude-newer }}
        exclude-newer-package: ${{ inputs.exclude-newer-package }}
    - name: 🏗️ Build wheel and sdist
      shell: bash
      env:
        BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        build_python=$(uv python find "$RUNNER_TEMP/build-python")
        export SOURCE_DATE_EPOCH
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        uv build --python "$build_python" \
          --python-preference only-managed --sdist --wheel \
          --build-constraints "$BUILD_CONSTRAINTS" --require-build-hashes . --out-dir dist
