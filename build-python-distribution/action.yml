name: Build Python distribution
description: Build a wheel and sdist from source checked in a separate job
inputs:
  python-version:
    description: Python version for uv build
    default: "3.15"
  source:
    description: Distribution source directory
    default: .
  out-dir:
    description: Directory for the wheel and sdist
    default: dist
runs:
  using: composite
  steps:
    - name: Require clean tagged source
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo '::error::tagged source is dirty' >&2
          exit 1
        fi
    - id: cutoff
      name: Set build dependency age cutoff
      shell: bash
      run: echo "timestamp=$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
    - name: Build wheel and sdist
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        SOURCE: ${{ inputs.source }}
        OUT_DIR: ${{ inputs.out-dir }}
        UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.timestamp }}
      run: |
        uv build --python "$PYTHON_VERSION" --python-preference only-managed --sdist --wheel "$SOURCE" --out-dir "$OUT_DIR"
