name: Install local release-creator
description: Build release-creator from the checkout into .venv and put its command first on PATH
inputs:
  build-constraints:
    description: Hashed build constraints from install-locked-tools
    required: true
runs:
  using: composite
  steps:
    - name: Build and install the local release-creator wheel
      shell: bash
      env:
        BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
      run: |
        set -euo pipefail
        uv build --wheel --build-constraints "$BUILD_CONSTRAINTS" \
          --require-build-hashes --out-dir "$RUNNER_TEMP/local-tool-dist" .
        uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP/local-tool-dist/"*.whl
        uv run --no-project --python "$RUNNER_TEMP/lock-reader" python \
          "$GITHUB_ACTION_PATH/../tools/expose_locked_commands.py" .venv
