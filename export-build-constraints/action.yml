name: Export build constraints
description: Write hashed build dependencies selected from the caller's pylock
inputs:
  lock:
    description: Caller pylock containing build dependencies
    default: pylock.toml
  target-platform:
    description: Nab platform ID for cross-target build constraints
    default: ""
  targets:
    description: Space-separated full Python version and implementation pairs
    default: ""
outputs:
  path:
    description: Path to the generated build constraints
    value: ${{ steps.constraints.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install locked pylock reader
      shell: bash
      run: |
        set -euo pipefail
        unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
        uv venv --allow-existing --python 3.15 "$RUNNER_TEMP/lock-tools"
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/lock-tools" --group lock-tools \
          --only-binary :all: --require-hashes "$GITHUB_ACTION_PATH/../pylock.toml"
    - id: constraints
      name: Export locked build requirements
      shell: bash
      env:
        BUILD_LOCK: ${{ inputs.lock }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        args=()
        if [[ "$BUILD_LOCK" == pylock.toml ]]; then
          args+=(--shared-policy "$GITHUB_ACTION_PATH/../pyproject.toml")
          locks=("$GITHUB_ACTION_PATH/../pylock.toml" pylock.toml)
        else
          locks=("$BUILD_LOCK")
        fi
        if [[ -n "$TARGET_PLATFORM" || -n "$TARGETS" ]]; then
          args+=(--target-platform "$TARGET_PLATFORM" --targets "$TARGETS")
        fi
        uv run --no-project --python "$RUNNER_TEMP/lock-tools" python \
          "$GITHUB_ACTION_PATH/../tools/build_constraints.py" "${args[@]}" \
          "$RUNNER_TEMP/build-constraints.txt" "${locks[@]}"
        echo "path=$RUNNER_TEMP/build-constraints.txt" >>"$GITHUB_OUTPUT"
