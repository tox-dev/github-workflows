name: Check hook update cooldown
description: Require seven days before a hook update pull request can merge
inputs:
  minimum-days:
    description: Minimum age of a proposed hook revision
    default: "7"
  release-app-client-id:
    description: Client ID of the App allowed to update managed hook dependencies
    default: ""
runs:
  using: composite
  steps:
    - id: identity
      name: Verify the pull request identity
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_APP_CLIENT_ID: ${{ inputs.release-app-client-id }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        PR_NUMBER=$(jq -r .number "$GITHUB_EVENT_PATH")
        HEAD_SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
        case "$MINIMUM_DAYS" in
        '' | 0* | *[!0-9]*) exit 1 ;;
        esac
        if ((MINIMUM_DAYS < 7)); then
          echo '::error::hook cooldown must be at least seven days' >&2
          exit 1
        fi
        gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" >"$RUNNER_TEMP/hook-update-pr.json"
        jq -e --arg repository "$REPOSITORY" --arg head "$HEAD_SHA" '
          .state == "open" and .base.repo.full_name == $repository and
          .head.sha == $head and
          (.user.login | type == "string")
        ' "$RUNNER_TEMP/hook-update-pr.json" >/dev/null
        gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' \
          >"$RUNNER_TEMP/hook-update-files"
        if grep -Fxq .pre-commit-config.yaml "$RUNNER_TEMP/hook-update-files"; then
          if [[ $(jq -r .user.type "$RUNNER_TEMP/hook-update-pr.json") == Bot ]]; then
            jq -e --arg repository "$REPOSITORY" '.head.repo.full_name == $repository' \
              "$RUNNER_TEMP/hook-update-pr.json" >/dev/null || {
              echo '::error::bot hook updates must come from this repository' >&2
              exit 1
            }
          fi
          if [[ $(jq -r .user.type "$RUNNER_TEMP/hook-update-pr.json") == User ]]; then
            echo 'human=true' >>"$GITHUB_OUTPUT"
          fi
          if [[ $(jq -r .head.ref "$RUNNER_TEMP/hook-update-pr.json") == automation/update-release-tools ]]; then
            author=$(jq -r .user.login "$RUNNER_TEMP/hook-update-pr.json")
            [[ "$author" == *'[bot]' && -n "$RELEASE_APP_CLIENT_ID" ]] || {
              echo '::error::release tool branch requires the configured release App' >&2
              exit 1
            }
            slug=${author%'[bot]'}
            gh api "apps/$slug" >"$RUNNER_TEMP/release-app.json"
            jq -e --arg slug "$slug" --arg client "$RELEASE_APP_CLIENT_ID" '
              .slug == $slug and .client_id == $client
            ' "$RUNNER_TEMP/release-app.json" >/dev/null || {
              echo '::error::release tool branch has a different App identity' >&2
              exit 1
            }
            echo 'managed=true' >>"$GITHUB_OUTPUT"
          fi
          gh api --paginate -X GET "repos/$REPOSITORY/actions/runs" -f event=pull_request \
            -f head_sha="$HEAD_SHA" -f per_page=100 >"$RUNNER_TEMP/hook-update-runs.jsonl"
          workflow_path=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          workflow_path=${workflow_path%@*}
          if jq -se --arg repository "$(jq -r .head.repo.full_name "$RUNNER_TEMP/hook-update-pr.json")" \
            --arg branch "$(jq -r .head.ref "$RUNNER_TEMP/hook-update-pr.json")" \
            --arg head "$HEAD_SHA" --arg workflow "$workflow_path" \
            --argjson number "$PR_NUMBER" --argjson days "$MINIMUM_DAYS" \
            --argjson opened "$(jq -r '.created_at | fromdateiso8601' "$RUNNER_TEMP/hook-update-pr.json")" '
            [.[].workflow_runs[] | select(
              .event == "pull_request" and .head_repository.full_name == $repository and
              .head_branch == $branch and .head_sha == $head and (.path | split("@")[0]) == $workflow and
              (any(.pull_requests[]; .number == $number) or
                (.pull_requests == [] and (.created_at | fromdateiso8601) >= $opened))
            ) | .created_at | fromdateiso8601] as $observed |
            ($observed | length) > 0 and ($observed | min) <= now - ($days * 86400)
          ' "$RUNNER_TEMP/hook-update-runs.jsonl" >/dev/null; then
            echo 'cooled=true' >>"$GITHUB_OUTPUT"
          fi
          echo 'changed=true' >>"$GITHUB_OUTPUT"
        fi
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      if: steps.identity.outputs.changed == 'true'
      with:
        version: latest-known
        python-version: "3.15"
        enable-cache: false
    - uses: $/install-locked-tools
      if: steps.identity.outputs.changed == 'true'
      with:
        groups: release-hook-check release-notes lock-reader
        lock-source: shared
        venv: ${{ runner.temp }}/hook-tools
    - name: Read the base and proposed hook configurations
      if: steps.identity.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        HEAD_SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
        base_sha=$(jq -r .base.sha "$RUNNER_TEMP/hook-update-pr.json")
        head_repository=$(jq -r .head.repo.full_name "$RUNNER_TEMP/hook-update-pr.json")
        gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$base_sha" --jq .content |
          base64 --decode >"$RUNNER_TEMP/base-hooks.yaml"
        gh api "repos/$head_repository/contents/.pre-commit-config.yaml?ref=$HEAD_SHA" --jq .content |
          base64 --decode >"$RUNNER_TEMP/proposed-hooks.yaml"
        git init -q "$RUNNER_TEMP/hook-cooldown"
    - name: Reject movable hook revisions
      if: steps.identity.outputs.changed == 'true'
      shell: bash
      run: >-
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" python "$GITHUB_ACTION_PATH/../tools/check_frozen_hooks.py" "$RUNNER_TEMP/proposed-hooks.yaml"
    - name: Reject non-revision hook changes
      if: steps.identity.outputs.changed == 'true'
      shell: bash
      env:
        MANAGED: ${{ steps.identity.outputs.managed }}
        HUMAN: ${{ steps.identity.outputs.human }}
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
      run: |
        set -euo pipefail
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" python \
          "$GITHUB_ACTION_PATH/../tools/check_hook_config.py" \
          "$RUNNER_TEMP/base-hooks.yaml" "$RUNNER_TEMP/proposed-hooks.yaml" \
          --managed "$MANAGED" --human "$HUMAN" --minimum-days "$MINIMUM_DAYS"
    - name: Verify managed hook dependency closure
      if: steps.identity.outputs.changed == 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/hook-closure"
        cp "$RUNNER_TEMP/proposed-hooks.yaml" "$RUNNER_TEMP/hook-closure/.pre-commit-config.yaml"
        cd "$RUNNER_TEMP/hook-closure"
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" release-creator hooks \
          --check --minimum-days "$MINIMUM_DAYS"
    - name: Compare proposed hook revisions
      if: steps.identity.outputs.changed == 'true'
      shell: bash
      env:
        HUMAN: ${{ steps.identity.outputs.human }}
      run: |
        set -euo pipefail
        for config in base proposed; do
          uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -c \
            '[.repos[] | select(.repo != "local" and .repo != "meta") | {repo, rev}]' \
            "$RUNNER_TEMP/$config-hooks.yaml" >"$RUNNER_TEMP/$config-hooks.json"
        done
        jq -e -n \
          --slurpfile base "$RUNNER_TEMP/base-hooks.json" \
          --slurpfile proposed "$RUNNER_TEMP/proposed-hooks.json" --arg human "$HUMAN" '
          def identities($entries):
            [$entries | to_entries[] | . as $entry |
              {repo: .value.repo, rev: .value.rev,
                occurrence: ([$entries[:$entry.key][] | select(.repo == $entry.value.repo)] | length)}];
          identities($base[0]) as $old |
          identities($proposed[0]) as $new |
          if $human != "true" and
            ($old | map(.repo)) != ($new | map(.repo))
          then error("hook repository entries changed")
          else [$new[] | . as $entry |
            select(.rev != ([$old[] |
              select(.repo == $entry.repo and .occurrence == $entry.occurrence) | .rev][0] // null)) |
            [.repo, .rev, .occurrence]] end
        ' >"$RUNNER_TEMP/older-hook-revisions.json"
        jq -r '.[] | @tsv' "$RUNNER_TEMP/older-hook-revisions.json" >"$RUNNER_TEMP/older-hook-revisions"
    - name: Find prior pull request heads
      if: steps.identity.outputs.changed == 'true' && steps.identity.outputs.cooled != 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        PR_NUMBER=$(jq -r .number "$GITHUB_EVENT_PATH")
        branch=$(jq -r .head.ref "$RUNNER_TEMP/hook-update-pr.json")
        cutoff=$(jq -nr --argjson days "$MINIMUM_DAYS" 'now - $days * 86400 | todateiso8601')
        gh api --paginate -X GET "repos/$REPOSITORY/actions/runs" -f event=pull_request \
          -f branch="$branch" -f "created=<$cutoff" -f per_page=100 >"$RUNNER_TEMP/hook-branch-runs.jsonl"
        workflow_path=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
        workflow_path=${workflow_path%@*}
        jq -sr --arg repository "$(jq -r .head.repo.full_name "$RUNNER_TEMP/hook-update-pr.json")" \
          --arg branch "$branch" --arg workflow "$workflow_path" \
          --argjson number "$PR_NUMBER" --argjson days "$MINIMUM_DAYS" \
          --argjson opened "$(jq -r '.created_at | fromdateiso8601' "$RUNNER_TEMP/hook-update-pr.json")" '
          [.[].workflow_runs[] | select(
            .event == "pull_request" and .head_repository.full_name == $repository and
            .head_branch == $branch and (.path | split("@")[0]) == $workflow and
            (any(.pull_requests[]; .number == $number) or
              (.pull_requests == [] and (.created_at | fromdateiso8601) >= $opened)) and
            (.created_at | fromdateiso8601) <= now - ($days * 86400)
          ) | .head_sha] | unique[]
        ' "$RUNNER_TEMP/hook-branch-runs.jsonl" >"$RUNNER_TEMP/older-heads"
    - name: Read prior hook revisions
      if: steps.identity.outputs.changed == 'true' && steps.identity.outputs.cooled != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$(jq -r .head.repo.full_name "$RUNNER_TEMP/hook-update-pr.json")
        : >"$RUNNER_TEMP/observed-revisions.jsonl"
        while IFS= read -r head; do
          if gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$head" --jq .content \
            >"$RUNNER_TEMP/older-hooks.b64" 2>"$RUNNER_TEMP/older-hooks-error"; then
            base64 --decode <"$RUNNER_TEMP/older-hooks.b64" >"$RUNNER_TEMP/older-hooks.yaml"
          elif grep -Fq '(HTTP 404)' "$RUNNER_TEMP/older-hooks-error"; then
            continue
          else
            cat "$RUNNER_TEMP/older-hooks-error" >&2
            exit 1
          fi
          if ! uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -c '
            [.repos[] | select(.repo != "local" and .repo != "meta") | {repo, rev}]
          ' "$RUNNER_TEMP/older-hooks.yaml" >"$RUNNER_TEMP/older-revisions.json"; then
            echo "::warning::skip malformed hook config at $head" >&2
            continue
          fi
          jq -c '
            . as $entries | to_entries[] | . as $entry |
            {repo: .value.repo, rev: .value.rev,
              occurrence: ([$entries[:$entry.key][] | select(.repo == $entry.value.repo)] | length)}
          ' "$RUNNER_TEMP/older-revisions.json" >>"$RUNNER_TEMP/observed-revisions.jsonl"
        done <"$RUNNER_TEMP/older-heads"
    - name: Verify the first GitHub observation of each revision
      if: steps.identity.outputs.changed == 'true' && steps.identity.outputs.cooled != 'true'
      shell: bash
      run: |
        jq -n --slurpfile base "$RUNNER_TEMP/base-hooks.json" \
          --slurpfile proposed "$RUNNER_TEMP/proposed-hooks.json" '
          def identities($entries):
            [$entries | to_entries[] | . as $entry |
              {repo: .value.repo, rev: .value.rev,
                occurrence: ([$entries[:$entry.key][] | select(.repo == $entry.value.repo)] | length)}];
          identities($base[0]) as $old |
          [identities($proposed[0])[] | . as $entry |
            select(.rev != ([$old[] |
              select(.repo == $entry.repo and .occurrence == $entry.occurrence) | .rev][0] // null))]
        ' >"$RUNNER_TEMP/proposed-revisions.json"
        if ! jq -se --slurpfile proposed "$RUNNER_TEMP/proposed-revisions.json" '
          . as $observed |
          all($proposed[0][]; . as $revision |
            any($observed[];
              .repo == $revision.repo and .occurrence == $revision.occurrence and .rev == $revision.rev))
        ' "$RUNNER_TEMP/observed-revisions.jsonl" >/dev/null; then
          echo '::error::hook revision has not been observed on this pull request for seven days' >&2
          exit 1
        fi
    - name: Verify older pinned revisions
      if: steps.identity.outputs.changed == 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
      run: |
        set -euo pipefail
        while IFS=$'\t' read -r repository revision occurrence; do
          if [[ ${#revision} -eq 40 ]]; then
            case "$revision" in
            *[!0-9a-f]*) exit 1 ;;
            esac
            tags=()
            while read -r commit ref; do
              if [[ "$commit" == "$revision" ]]; then
                tag=${ref#refs/tags/}
                tags+=("${tag%"^{}"}")
              fi
            done < <(git ls-remote --tags "$repository")
            options=(--freeze)
          else
            tags=("$revision")
            options=()
          fi
          accepted=false
          for tag in "${tags[@]}"; do
            cp "$RUNNER_TEMP/proposed-hooks.yaml" "$RUNNER_TEMP/candidate-hooks.yaml"
            uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -y -i --arg repository "$repository" \
              "(.repos[] | select(.repo == \$repository) | .rev) = \"0000000000000000000000000000000000000000\"" \
              "$RUNNER_TEMP/candidate-hooks.yaml"
            uv run --no-project --python "$RUNNER_TEMP/hook-tools" prek update -C "$RUNNER_TEMP/hook-cooldown" \
              --config "$RUNNER_TEMP/candidate-hooks.yaml" --repo "$repository" \
              --repo-include-tag "$repository=$tag" --cooldown-days "$MINIMUM_DAYS" \
              "${options[@]}" --no-progress
            selected_revisions=$(uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -r \
              --arg repository "$repository" \
              ".repos[] | select(.repo == \$repository) | .rev" "$RUNNER_TEMP/candidate-hooks.yaml")
            mapfile -t selected <<<"$selected_revisions"
            if [[ "${selected[$occurrence]:-}" == "$revision" ]]; then
              accepted=true
              break
            fi
          done
          if [[ "$accepted" != true ]]; then
            echo "::error::hook revision is not eligible: $repository $revision" >&2
            exit 1
          fi
        done <"$RUNNER_TEMP/older-hook-revisions"
