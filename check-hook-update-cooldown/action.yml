name: Check hook update cooldown
description: Require seven days before a pre-commit.ci update pull request can merge
inputs:
  repository:
    description: Repository containing the pull request
    required: true
  pull-request:
    description: Pull request number
    required: true
  head-sha:
    description: Exact pull request head from the triggering event
    required: true
  minimum-days:
    description: Minimum age of a proposed hook revision
    default: "7"
runs:
  using: composite
  steps:
    - id: identity
      name: Verify the pull request identity
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull-request }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "$REPOSITORY" in
        */*) ;;
        *) exit 1 ;;
        esac
        for part in "${REPOSITORY%%/*}" "${REPOSITORY#*/}"; do
          case "$part" in
          '' | *[!A-Za-z0-9_.-]*) exit 1 ;;
          esac
        done
        case "$PR_NUMBER" in
        '' | 0* | *[!0-9]*) exit 1 ;;
        esac
        test "${#HEAD_SHA}" -eq 40
        case "$HEAD_SHA" in
        *[!0-9a-f]*) exit 1 ;;
        esac
        case "$MINIMUM_DAYS" in
        '' | 0* | *[!0-9]*) exit 1 ;;
        esac
        test "$GITHUB_EVENT_NAME" = pull_request
        jq -e --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" '
          .number == $number and .pull_request.head.sha == $head
        ' "$GITHUB_EVENT_PATH" >/dev/null
        gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" >"$RUNNER_TEMP/hook-update-pr.json"
        jq -e --arg repository "$REPOSITORY" --arg head "$HEAD_SHA" '
          .state == "open" and .base.repo.full_name == $repository and
          .head.sha == $head and
          (.user.login | type == "string")
        ' "$RUNNER_TEMP/hook-update-pr.json" >/dev/null
        if [[ $(jq -r .user.login "$RUNNER_TEMP/hook-update-pr.json") == 'pre-commit-ci[bot]' ]]; then
          echo 'bot=true' >>"$GITHUB_OUTPUT"
        fi
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      if: steps.identity.outputs.bot == 'true'
      with:
        version: latest-known
        python-version: "3.15"
        enable-cache: false
    - name: Install locked hook tools
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      run: |
        uv venv --python 3.15 "$RUNNER_TEMP/hook-tools"
        uv pip sync --preview-features pylock --python "$RUNNER_TEMP/hook-tools/bin/python" \
          --group release "$GITHUB_ACTION_PATH/../pylock.toml"
    - name: Read the base and proposed hook configurations
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        HEAD_SHA: ${{ inputs.head-sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        base_sha=$(jq -r .base.sha "$RUNNER_TEMP/hook-update-pr.json")
        gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$base_sha" --jq .content |
          base64 --decode >"$RUNNER_TEMP/base-hooks.yaml"
        gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$HEAD_SHA" --jq .content |
          base64 --decode >"$RUNNER_TEMP/proposed-hooks.yaml"
        cp "$RUNNER_TEMP/base-hooks.yaml" "$RUNNER_TEMP/eligible-hooks.yaml"
        git init -q "$RUNNER_TEMP/hook-cooldown"
    - name: Select eligible hook revisions
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
      run: |
        "$RUNNER_TEMP/hook-tools/bin/prek" update -C "$RUNNER_TEMP/hook-cooldown" \
          --config "$RUNNER_TEMP/eligible-hooks.yaml" \
          --cooldown-days "$MINIMUM_DAYS" --no-progress
    - name: Check proposed hook revisions
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      run: |
        set -euo pipefail
        for config in base proposed eligible; do
          "$RUNNER_TEMP/hook-tools/bin/yq" -c \
            '[.repos[] | select(.repo != "local" and .repo != "meta") | {repo, rev}]' \
            "$RUNNER_TEMP/$config-hooks.yaml" >"$RUNNER_TEMP/$config-hooks.json"
        done
        jq -e -n \
          --slurpfile base "$RUNNER_TEMP/base-hooks.json" \
          --slurpfile proposed "$RUNNER_TEMP/proposed-hooks.json" \
          --slurpfile eligible "$RUNNER_TEMP/eligible-hooks.json" '
          ($base[0] | map({key: .repo, value: .rev}) | from_entries) as $old |
          ($eligible[0] | map({key: .repo, value: .rev}) | from_entries) as $allowed |
          ($proposed[0] | map({key: .repo, value: .rev}) | from_entries) as $new |
          ($old | keys) == ($new | keys) and
          all($new | to_entries[]; .value == $old[.key] or .value == $allowed[.key])
        ' || {
          echo '::error::Hook PR proposes a revision newer than the cooldown permits' >&2
          exit 1
        }
