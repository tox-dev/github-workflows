name: Check hook update cooldown
description: Require seven days before a pre-commit.ci update pull request can merge
inputs:
  minimum-days:
    description: Minimum age of a proposed hook revision
    default: "7"
runs:
  using: composite
  steps:
    - id: identity
      name: Verify the pull request identity
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        PR_NUMBER=$(jq -r .number "$GITHUB_EVENT_PATH")
        HEAD_SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
        case "$REPOSITORY" in
        */*) ;;
        *) exit 1 ;;
        esac
        for part in "${REPOSITORY%%/*}" "${REPOSITORY#*/}"; do
          case "$part" in
          '' | *[!A-Za-z0-9_.-]*) exit 1 ;;
          esac
        done
        case "$PR_NUMBER" in
        '' | 0* | *[!0-9]*) exit 1 ;;
        esac
        test "${#HEAD_SHA}" -eq 40
        case "$HEAD_SHA" in
        *[!0-9a-f]*) exit 1 ;;
        esac
        case "$MINIMUM_DAYS" in
        '' | 0* | *[!0-9]*) exit 1 ;;
        esac
        test "$GITHUB_EVENT_NAME" = pull_request
        jq -e --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" '
          .number == $number and .pull_request.head.sha == $head
        ' "$GITHUB_EVENT_PATH" >/dev/null
        gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" >"$RUNNER_TEMP/hook-update-pr.json"
        jq -e --arg repository "$REPOSITORY" --arg head "$HEAD_SHA" '
          .state == "open" and .base.repo.full_name == $repository and
          .head.sha == $head and
          (.user.login | type == "string")
        ' "$RUNNER_TEMP/hook-update-pr.json" >/dev/null
        if [[ $(jq -r .user.type "$RUNNER_TEMP/hook-update-pr.json") == Bot ]]; then
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' \
            >"$RUNNER_TEMP/hook-update-files"
        fi
        if [[ -f "$RUNNER_TEMP/hook-update-files" ]] &&
          grep -Fxq .pre-commit-config.yaml "$RUNNER_TEMP/hook-update-files"; then
          gh api --paginate -X GET "repos/$REPOSITORY/actions/runs" -f event=pull_request \
            -f head_sha="$HEAD_SHA" -f per_page=100 >"$RUNNER_TEMP/hook-update-runs.jsonl"
          if jq -se --arg repository "$REPOSITORY" \
            --arg branch "$(jq -r .head.ref "$RUNNER_TEMP/hook-update-pr.json")" \
            --arg head "$HEAD_SHA" --argjson number "$PR_NUMBER" --argjson days "$MINIMUM_DAYS" '
            [.[].workflow_runs[] | select(
              .event == "pull_request" and .head_repository.full_name == $repository and
              .head_branch == $branch and .head_sha == $head and
              any(.pull_requests[]; .number == $number)
            ) | .created_at | fromdateiso8601] as $observed |
            ($observed | length) > 0 and ($observed | min) <= now - ($days * 86400)
          ' "$RUNNER_TEMP/hook-update-runs.jsonl" >/dev/null; then
            echo 'cooled=true' >>"$GITHUB_OUTPUT"
          fi
          echo 'bot=true' >>"$GITHUB_OUTPUT"
        fi
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      if: steps.identity.outputs.bot == 'true'
      with:
        version: latest-known
        python-version: "3.15"
        enable-cache: false
    - uses: $/install-locked-tools
      if: steps.identity.outputs.bot == 'true'
      with:
        groups: release-hook-check
        venv: ${{ runner.temp }}/hook-tools
    - name: Read the base and proposed hook configurations
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        HEAD_SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
        base_sha=$(jq -r .base.sha "$RUNNER_TEMP/hook-update-pr.json")
        gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$base_sha" --jq .content |
          base64 --decode >"$RUNNER_TEMP/base-hooks.yaml"
        gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$HEAD_SHA" --jq .content |
          base64 --decode >"$RUNNER_TEMP/proposed-hooks.yaml"
        cp "$RUNNER_TEMP/base-hooks.yaml" "$RUNNER_TEMP/eligible-hooks.yaml"
        git init -q "$RUNNER_TEMP/hook-cooldown"
    - name: Select eligible hook revisions
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
      run: |
        uv run --no-project --python "$RUNNER_TEMP/hook-tools" prek update -C "$RUNNER_TEMP/hook-cooldown" \
          --config "$RUNNER_TEMP/eligible-hooks.yaml" \
          --cooldown-days "$MINIMUM_DAYS" --no-progress
    - name: Compare proposed hook revisions
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      run: |
        set -euo pipefail
        for config in base proposed eligible; do
          uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -c \
            '[.repos[] | select(.repo != "local" and .repo != "meta") | {repo, rev}]' \
            "$RUNNER_TEMP/$config-hooks.yaml" >"$RUNNER_TEMP/$config-hooks.json"
        done
        jq -e -n \
          --slurpfile base "$RUNNER_TEMP/base-hooks.json" \
          --slurpfile proposed "$RUNNER_TEMP/proposed-hooks.json" \
          --slurpfile eligible "$RUNNER_TEMP/eligible-hooks.json" '
          $base[0] as $old |
          $eligible[0] as $allowed |
          $proposed[0] as $new |
          if ($old | map(.repo)) != ($new | map(.repo)) or
            ($old | map(.repo)) != ($allowed | map(.repo))
          then error("hook repository entries changed")
          else [range(0; $new | length) as $index |
            $new[$index] |
            select(.rev != $old[$index].rev and .rev != $allowed[$index].rev) |
            [.repo, .rev, ([$new[:$index][] | select(.repo == $new[$index].repo)] | length)]] end
        ' >"$RUNNER_TEMP/older-hook-revisions.json"
        jq -r '.[] | @tsv' "$RUNNER_TEMP/older-hook-revisions.json" >"$RUNNER_TEMP/older-hook-revisions"
    - name: Find prior pull request heads
      if: steps.identity.outputs.bot == 'true' && steps.identity.outputs.cooled != 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        PR_NUMBER=$(jq -r .number "$GITHUB_EVENT_PATH")
        branch=$(jq -r .head.ref "$RUNNER_TEMP/hook-update-pr.json")
        cutoff=$(jq -nr --argjson days "$MINIMUM_DAYS" 'now - $days * 86400 | todateiso8601')
        gh api --paginate -X GET "repos/$REPOSITORY/actions/runs" -f event=pull_request \
          -f branch="$branch" -f "created=<$cutoff" -f per_page=100 >"$RUNNER_TEMP/hook-branch-runs.jsonl"
        jq -sr --arg repository "$REPOSITORY" --arg branch "$branch" \
          --argjson number "$PR_NUMBER" --argjson days "$MINIMUM_DAYS" '
          [.[].workflow_runs[] | select(
            .event == "pull_request" and .head_repository.full_name == $repository and
            .head_branch == $branch and any(.pull_requests[]; .number == $number) and
            (.created_at | fromdateiso8601) <= now - ($days * 86400)
          ) | .head_sha] | unique[]
        ' "$RUNNER_TEMP/hook-branch-runs.jsonl" >"$RUNNER_TEMP/older-heads"
    - name: Read prior hook revisions
      if: steps.identity.outputs.bot == 'true' && steps.identity.outputs.cooled != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPOSITORY=$GITHUB_REPOSITORY
        : >"$RUNNER_TEMP/observed-revisions.jsonl"
        while IFS= read -r head; do
          if gh api "repos/$REPOSITORY/contents/.pre-commit-config.yaml?ref=$head" --jq .content \
            >"$RUNNER_TEMP/older-hooks.b64" 2>"$RUNNER_TEMP/older-hooks-error"; then
            base64 --decode <"$RUNNER_TEMP/older-hooks.b64" >"$RUNNER_TEMP/older-hooks.yaml"
          elif grep -Fq '(HTTP 404)' "$RUNNER_TEMP/older-hooks-error"; then
            continue
          else
            cat "$RUNNER_TEMP/older-hooks-error" >&2
            exit 1
          fi
          if ! uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -c '
            [.repos[] | select(.repo != "local" and .repo != "meta") | {repo, rev}]
          ' "$RUNNER_TEMP/older-hooks.yaml" >"$RUNNER_TEMP/older-revisions.json"; then
            echo "::warning::skip malformed hook config at $head" >&2
            continue
          fi
          jq -c '
            . as $entries | to_entries[] | . as $entry |
            {repo: .value.repo, rev: .value.rev,
              occurrence: ([$entries[:$entry.key][] | select(.repo == $entry.value.repo)] | length)}
          ' "$RUNNER_TEMP/older-revisions.json" >>"$RUNNER_TEMP/observed-revisions.jsonl"
        done <"$RUNNER_TEMP/older-heads"
    - name: Verify the first GitHub observation of each revision
      if: steps.identity.outputs.bot == 'true' && steps.identity.outputs.cooled != 'true'
      shell: bash
      run: |
        jq -n --slurpfile base "$RUNNER_TEMP/base-hooks.json" \
          --slurpfile proposed "$RUNNER_TEMP/proposed-hooks.json" '
          [$proposed[0] as $entries | $entries | to_entries[] | . as $entry |
            select(.value.rev != $base[0][.key].rev) |
            {repo: .value.repo, rev: .value.rev,
              occurrence: ([$entries[:$entry.key][] | select(.repo == $entry.value.repo)] | length)}]
        ' >"$RUNNER_TEMP/proposed-revisions.json"
        if ! jq -se --slurpfile proposed "$RUNNER_TEMP/proposed-revisions.json" '
          . as $observed |
          all($proposed[0][]; . as $revision |
            any($observed[];
              .repo == $revision.repo and .occurrence == $revision.occurrence and .rev == $revision.rev))
        ' "$RUNNER_TEMP/observed-revisions.jsonl" >/dev/null; then
          echo '::error::hook revision has not been observed on this pull request for seven days' >&2
          exit 1
        fi
    - name: Verify older pinned revisions
      if: steps.identity.outputs.bot == 'true'
      shell: bash
      env:
        MINIMUM_DAYS: ${{ inputs.minimum-days }}
      run: |
        set -euo pipefail
        while IFS=$'\t' read -r repository revision occurrence; do
          if [[ ${#revision} -eq 40 ]]; then
            case "$revision" in
            *[!0-9a-f]*) exit 1 ;;
            esac
            tags=()
            while read -r commit ref; do
              if [[ "$commit" == "$revision" ]]; then
                tag=${ref#refs/tags/}
                tags+=("${tag%"^{}"}")
              fi
            done < <(git ls-remote --tags "$repository")
            options=(--freeze)
          else
            tags=("$revision")
            options=()
          fi
          accepted=false
          for tag in "${tags[@]}"; do
            cp "$RUNNER_TEMP/base-hooks.yaml" "$RUNNER_TEMP/candidate-hooks.yaml"
            uv run --no-project --python "$RUNNER_TEMP/hook-tools" prek update -C "$RUNNER_TEMP/hook-cooldown" \
              --config "$RUNNER_TEMP/candidate-hooks.yaml" --repo "$repository" \
              --repo-include-tag "$repository=$tag" --cooldown-days "$MINIMUM_DAYS" \
              "${options[@]}" --no-progress
            selected_revisions=$(uv run --no-project --python "$RUNNER_TEMP/hook-tools" yq -r \
              --arg repository "$repository" \
              ".repos[] | select(.repo == \$repository) | .rev" "$RUNNER_TEMP/candidate-hooks.yaml")
            mapfile -t selected <<<"$selected_revisions"
            if [[ "${selected[$occurrence]:-}" == "$revision" ]]; then
              accepted=true
              break
            fi
          done
          if [[ "$accepted" != true ]]; then
            echo "::error::hook revision is not eligible: $repository $revision" >&2
            exit 1
          fi
        done <"$RUNNER_TEMP/older-hook-revisions"
