[project]
name = "github-workflows"
version = "0.0.0"
description = "Shared release actions for tox-dev repositories"
requires-python = ">=3.15"
dependencies = []
license = "MIT"
license-files = [ "LICENSE" ]

[dependency-groups]
build = [ "Cython>=3.0", "setuptools>=80" ]
lock-tools = [ "nab==0.0.22", "tomlkit>=0.13" ]
lock-reader = [ "certifi>=2026.7.22", "packaging>=26.3" ]
release-notes = [ "release-creator>=2.0.0" ]
release-mise-editor = [ "pyyaml>=6" ]
release-news = [ "release-creator>=2.0.0", "towncrier>=26.9" ]
release-prepare = [ "release-creator>=2.0.0", "towncrier>=26.9", "prek>=0.2" ]
release-validate = [ "release-creator>=2.0.0", "prek>=0.2" ]
release-check = [ "prek>=0.2" ]
release-attestations = [ "certifi>=2026.7.22", "pypi-attestations>=0.0.30" ]
release-shell = [ "prek>=0.2", "yq>=4.4.5" ]
release-hooks = [ "release-creator>=2.0.0", "prek>=0.2" ]
release-hook-check = [ "prek>=0.2", "yq>=4.4.5" ]
test = [
  "certifi",
  "check-wheel-contents>=0.6.3",
  "coverage[toml]>=7.10",
  "hatchling>=1.28",
  "pytest>=9",
  "pytest-httpserver",
  "pytest-mock>=3.16",
  "pytest-xdist>=3",
  "pyyaml>=6",
  "tomlkit>=0.13",
  "tox>=4.64.7",
  "tox-uv>=1.36.1",
  "trustme",
  "twine>=7",
  "ty",
]

[tool.release-creator.locks.exclude-newer-package]
nab = "2026-10-18T05:45:09Z"
nab-index = "2026-10-18T05:45:09Z"
nab-markersets = "2026-10-18T05:45:09Z"
nab-project = "2026-10-18T05:45:09Z"
nab-provider = "2026-10-18T05:45:09Z"
nab-resolver = "2026-10-18T05:45:09Z"
release-creator = "2026-10-25T07:08:32Z"
uv = "2026-10-22T01:32:34Z"

[tool.ruff]
line-length = 120

[tool.coverage.run]
branch = true
patch = [ "subprocess" ]
source_dirs = [ "tests", "tools" ]
# The bootstrap starts coverage in subprocesses, so it runs before measurement begins.
omit = [ "*/coverage_bootstrap/*" ]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [ "INP001" ] # Test modules intentionally have no package marker.

[tool.towncrier]
name = "github-workflows"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]
