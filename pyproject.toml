[project]
name = "github-workflows"
version = "0.0.0"
description = "Shared release actions for tox-dev repositories"
requires-python = ">=3.15"
dependencies = []
license = "MIT"
license-files = [ "LICENSE" ]

[dependency-groups]
build = [ "Cython>=3.0", "setuptools>=80" ]
lock-tools = [ "nab==0.0.22", "tomlkit>=0.13" ]
lock-reader = [ "certifi>=2026.7.22", "packaging>=26.3" ]
release-notes = [ "release-creator>=0.6.7" ]
release-news = [ "release-creator>=0.6.7", "towncrier>=26.9" ]
release-prepare = [ "release-creator>=0.6.7", "towncrier>=26.9", "prek>=0.2" ]
release-validate = [ "release-creator>=0.6.7", "prek>=0.2" ]
release-check = [ "prek>=0.2" ]
release-attestations = [ "certifi>=2026.7.22", "pypi-attestations>=0.0.30" ]
release-shell = [ "prek>=0.2", "yq>=4.4.5" ]
release-hooks = [ "release-creator>=0.6.7", "prek>=0.2" ]
release-hook-check = [ "prek>=0.2", "yq>=4.4.5" ]
test = [
  "certifi",
  "check-wheel-contents>=0.6.3",
  "coverage[toml]>=7.10",
  "hatchling>=1.28",
  "pytest>=9",
  "pytest-httpserver",
  "pytest-mock>=3.17",
  "pytest-xdist>=3",
  "pyyaml>=6",
  "tomlkit>=0.13",
  "tox>=4.64.7",
  "tox-uv>=1.36.1",
  "trustme",
  "twine>=7",
  "ty",
]

[tool.nab]
mode = "universal"
uploaded-prior-to = "P7D"
decision-order = "stable"
base-group = "project-runtime"
default-groups = []

[tool.nab.matrix]
python = ">=3.15,<3.16"
platforms = [ "linux_x86_64", "linux_aarch64", "macos_x86_64", "macos_arm64", "windows_amd64", "windows_arm64" ]

[tool.nab.packages.nab]
uploaded-prior-to = "2026-10-18T05:45:09Z"

[tool.nab.packages.nab-index]
uploaded-prior-to = "2026-10-18T05:45:09Z"

[tool.nab.packages.nab-markersets]
uploaded-prior-to = "2026-10-18T05:45:09Z"

[tool.nab.packages.nab-project]
uploaded-prior-to = "2026-10-18T05:45:09Z"

[tool.nab.packages.nab-provider]
uploaded-prior-to = "2026-10-18T05:45:09Z"

[tool.nab.packages.nab-resolver]
uploaded-prior-to = "2026-10-18T05:45:09Z"

[tool.nab.packages.release-creator]
uploaded-prior-to = "2026-10-23T21:40:06Z"

[tool.ruff]
line-length = 120

[tool.coverage.run]
branch = true
patch = [ "subprocess" ]
source_dirs = [ "tools" ]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [ "INP001" ] # Test modules intentionally have no package marker.

[tool.towncrier]
name = "github-workflows"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]
